}
// Antall dager fra én ISO-dato til en annen (toIso - fromIso). Brukes bl.a. til å
// beregne gjennomsnittlig behandlingstid i Verkstedrapporten (Fase 8).
function isoDateDiff(fromIso, toIso){
  const mf = /^(\d{4})-(\d{2})-(\d{2})$/.exec(fromIso || '');
  const mt = /^(\d{4})-(\d{2})-(\d{2})$/.exec(toIso || '');
  if(!mf || !mt) return null;
  const from = Date.UTC(Number(mf[1]), Number(mf[2]) - 1, Number(mf[3]));
  const to = Date.UTC(Number(mt[1]), Number(mt[2]) - 1, Number(mt[3]));
  return Math.round((to - from) / 86400000);
}

// ================= Dekk: DOT-kode, alder og sesongvarsel =================
// DOT-koden på et dekk avslutter alltid med 4 siffer: UUÅÅ (produksjonsuke +
// produksjonsår), f.eks. "2224" = uke 22 i 2024. Produksjonsdato beregnes
// derfor automatisk ut fra DOT-koden i stedet for å måtte tastes inn separat.
function parseDotDato(dot){
  if(!dot) return null;
  const m = String(dot).trim().match(/^(\d{2})(\d{2})$/);
  if(!m) return null;
  const uke = parseInt(m[1], 10);
  const aar = 2000 + parseInt(m[2], 10);
  if(uke < 1 || uke > 53) return null;
  return new Date(Date.UTC(aar, 0, 1) + (uke - 1) * 7 * 24 * 60 * 60 * 1000);

const MAANEDER_NB = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Sletter ALL operativ historikk (skader, verkstedtimer, sjåførkontroller, varsellamper)
// og nullstiller kilometerstand/status på hver bil — men beholder selve kjøretøyene
// (bilnummer, regnr, merke/modell, kategori, løyvenummer), Verkstedregisteret,
// Administratorbrukere og alle systeminnstillinger uendret.
async function resetFleetData(){
  if(!isAdmin) return;
  const antallBiler = vehicles.length;
  const advarsel = 'Nullstille all bilparkdata?\n\n' +
    'Dette sletter PERMANENT for alle ' + antallBiler + ' biler:\n' +
    '– Kilometerstand og status\n' +
    '– Alle registrerte skader og skadebilder\n' +
    '– Alle aktive varsellamper og varsellampehistorikk\n' +
    '– Alle sjåførkontroller og kontrollhistorikk\n' +
    '– Alle kommende og tidligere verkstedtimer\n\n' +
    'Selve bilene (regnr, bilnummer, merke, kategori, løyvenummer), Verkstedregisteret, ' +
    'Administratorbrukere og Systeminnstillinger BEHOLDES uendret.\n\n' +
    'Dette kan ikke angres. Fortsette?';
  if(!confirm(advarsel)) return;

  // Rydd opp bilder knyttet til det som slettes, før selve postene fjernes
  for(const d of damages){ if(d.hasPhoto) await deletePhoto('damage:'+d.id); }
  for(const k of kontroller){
    for(let i = 0; i < (k.skadeBilderCount || 0); i++){ await deletePhoto('kontroll:'+k.id+':'+i); }
  }

  damages = [];
  verkstedtimer = [];
  kontroller = [];
  varsellys = [];
  await saveDamages();
  await saveVerkstedtimer();
  await saveKontroller();
  await saveVarsellys();

  vehicles.forEach(v => {
    v.km = '';
    v.status = 'ok';
  });
  await saveVehicles();

  alert('Bilparkdata nullstilt. Alle ' + antallBiler + ' biler står klare uten historikk.');
  goTo('dashboard');
}

  if(!s) return;
  const verkstedResultat = document.getElementById('swz-resultat-'+id).value;
  const utfortDatoRaw = document.getElementById('swz-utfort-dato-'+id).value.trim();
  const resolutionNote = document.getElementById('swz-sluttkommentar-'+id).value.trim();
  const msgEl = document.getElementById('swz-fullfor-msg-'+id);
  if(lukkSaken && (!verkstedResultat || !resolutionNote || !utfortDatoRaw)){
    if(msgEl) msgEl.textContent = 'For å lukke saken må resultat, sluttkommentar og faktisk utført dato fylles ut.';
    return;
  }
  const completedAt = utfortDatoRaw ? readDateInput('swz-utfort-dato-'+id) : null;
  if(utfortDatoRaw && !completedAt){
    if(msgEl) msgEl.textContent = 'Ugyldig utført dato. Bruk format DD/MM/ÅÅÅÅ.';
    return;
  }
  let kreverAvsetting = false, avsettingsManed = '', avsettingsBelopRaw = '', estimertRaw = '', faktiskRaw = '';
  if(s.linkedVtId){
    const kreverAvsettingEl = document.getElementById('swz-krever-avsetting-'+id);
    kreverAvsetting = kreverAvsettingEl ? kreverAvsettingEl.value === 'ja' : false;
    const avsettingsManedEl = document.getElementById('swz-avsettingsmaned-'+id);
    const avsettingsBelopEl = document.getElementById('swz-avsettingsbelop-'+id);
    avsettingsManed = avsettingsManedEl ? avsettingsManedEl.value : '';
    avsettingsBelopRaw = avsettingsBelopEl ? avsettingsBelopEl.value.trim() : '';
    if(kreverAvsetting && (!avsettingsManed || !avsettingsBelopRaw)){
      if(msgEl) msgEl.textContent = 'Fyll ut avsettingsmåned og avsettingsbeløp når "Krever avsetting" er satt til Ja.';
      return;
    }
    estimertRaw = (document.getElementById('swz-estimert-'+id)||{}).value?.trim() || '';
    faktiskRaw = (document.getElementById('swz-faktisk-'+id)||{}).value?.trim() || '';
  }

  // Prioritet 12: er dette en flerpunkts sak, fullfør (kun) de avvikene som faktisk hører
  // til DENNE verkstedrunden (samme linkedVtId som sakens gjeldende s.linkedVtId) — resten
  // av avvikene i saken forblir aktive, upåvirket av denne innsendingen.
  const erFlerpunkts = Array.isArray(s.avvik) && s.avvik.length > 0;
  if(erFlerpunkts && s.linkedVtId){
    s.avvik.forEach(a => {
      if(a.status === 'aktiv' && a.linkedVtId === s.linkedVtId){
        a.status = 'utfort';
        a.resolvedAt = completedAt || todayISO();
      }
    });
  }
  if(erFlerpunkts && lukkSaken && !sakAlleAvvikFerdig(s)){
    const gjenstaende = sakAvvikAktive(s);
    if(msgEl) msgEl.textContent = `${gjenstaende.length} avvik står fortsatt som aktive (${gjenstaende.map(a=>a.label).join(', ')}) — saken kan ikke lukkes før alle avvik er utført eller markert utført. Bruk "Lagre uten å lukke" i stedet.`;
    return;
  }

  sakWizardSaving = true; render();
  s.resolutionNote = resolutionNote;
  s.verkstedResultat = verkstedResultat || null;
  s.completedAt = completedAt;
  if(s.linkedVtId){
    s.estimatedCost = estimertRaw ? Number(estimertRaw.replace(/\s/g,'').replace(',','.')) : null;
    s.actualCost = faktiskRaw ? Number(faktiskRaw.replace(/\s/g,'').replace(',','.')) : null;
    s.requiresProvision = kreverAvsetting;
    s.provisionMonth = kreverAvsetting ? avsettingsManed : null;
    s.provisionAmount = kreverAvsetting && avsettingsBelopRaw ? Number(avsettingsBelopRaw.replace(/\s/g,'').replace(',','.')) : null;
  }
  const varGammelStatusLukket = s.status === 'lukket';
  if(lukkSaken){
    // Nådd hit betyr alle avvik er ferdige (validert over for flerpunkts saker; ett
    // enkeltavvik som når hit er per definisjon ferdig siden det er saken selv som lukkes).
    s.status = 'lukket';
    if(!varGammelStatusLukket){ s.resolvedAt = todayISO(); s.resolvedBy = loggedInRole || 'Ukjent'; }
  } else if(erFlerpunkts){
    // Prioritet 12 — kjerneregelen: hopper ALDRI tilbake til "Vurderes" bare fordi noen
    // avvik er ferdige. Gjenstår aktive avvik → "Delvis utført". Er alt ferdig → "Utført",
    // akkurat som en enkeltavvik-sak alltid har gjort.
    sakOppdaterStatusEtterAvvik(s);
  } else if(verkstedResultat || resolutionNote || completedAt){
    s.status = 'utfort';
  }
  s.updatedAt = new Date().toISOString();
  await saveAktiveSaker();
  sakWizardSaving = false;
  if(lukkSaken){ editingSakId = null; sakWizardStep = null; }
  render();
}

// ================= Sjåførkontroll-mutasjoner =================
function vehicleKontroller(vid){
  return kontroller.filter(k => k.vehicleId === vid).sort((a,b) => (b.dato+((b.tidspunkt)||'')).localeCompare(a.dato+((a.tidspunkt)||'')));
}
// Siste kontroll for en bil (nyeste først, se vehicleKontroller over).
function lastKontrollForVehicle(vid){
  const list = vehicleKontroller(vid);
  return list.length ? list[0] : null;
}
// "Kontrollert i dag" er ikke et lagret flagg, men regnes ut live mot dagens dato i
// Europe/Oslo (todayISO()). Det gjør at statusen nullstilles helt automatisk ved
// midnatt norsk tid, uten noen egen tidsstyrt jobb eller reset-logikk.
function isKontrollertIdag(vid){
  const last = lastKontrollForVehicle(vid);
  return !!(last && last.dato === todayISO());
}
// ---- Optimalisering 14: Reservebil-logikk ----
// En reservebil er unntatt dagens kontrollkrav (og alt som er avledet av det — Mangler
// kontroll, Morgenvisning, Krever handling nå, Bilparkhelse) SÅ LENGE den faktisk ikke er
// tatt i bruk ennå i dag. Ingen eget lagret flagg/status — regnes live, akkurat som
// isKontrollertIdag()/vehicleAktivSjafor() selv, og nullstilles derfor helt automatisk ved
// hvert operative dagskille (04:00) uten noen egen "gå tilbake til reserve"-jobb: i morgen
// er isKontrollertIdag/vehicleAktivSjafor tilbake til usann for bilen med mindre den faktisk
// brukes på nytt den dagen.
// Tatt i bruk = enten allerede kontrollert i dag (vanligvis via Aktiv Biløkt sin
// "Velg bil"-flyt, men gjelder uansett hvor kontrollen kom fra), ELLER har en aktiv
// biløkt akkurat nå (i det sjeldne tilfellet en biløkt skulle stå aktiv uten at
// isKontrollertIdag enda reflekterer det). Så snart ÉN av disse er sanne, opphører
// unntaket for resten av den operative dagen — "vanlige regler gjelder" fra da av.
function vehicleErReserveUnntatt(vehicleId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v || v.kategori !== 'reserve') return false;
  if(isKontrollertIdag(vehicleId)) return false;
  if(vehicleAktivSjafor(vehicleId)) return false;
  return true;
}
async function submitKontroll(ev){
  ev.preventDefault();
  const msgEl = document.getElementById('kt-msg');
  const vehicleId = document.getElementById('kt-vehicle').value;
  const km = document.getElementById('kt-km').value;
  const sjaforNavn = (document.getElementById('kt-sjafornavn').value || '').trim();
  if(!vehicleId || !km || !sjaforNavn){
    msgEl.textContent = 'Fyll ut sjåførnavn, velg bil, og fyll ut kilometerstand.';
    return;
  }
  const v = vehicles.find(x => x.id === vehicleId);
  if(Number(km) < Number(v.km || 0)){
    if(!confirm('Kilometerstanden du oppga (' + Number(km).toLocaleString('nb-NO') + ' km) er lavere enn det som er registrert fra før (' + Number(v.km||0).toLocaleString('nb-NO') + ' km). Registrere likevel?')) return;
  }

  const varsellamper = kontrollFormVarsellamper.slice();
  if(kontrollFormAnnet && !varsellamper.includes('annet')) varsellamper.push('annet');
  const avvik = kontrollFormAvvik.slice();
  const annetTekst = kontrollFormAnnet ? (document.getElementById('kt-annet-tekst').value || '').trim() : '';
  const harNyeSkader = kontrollFormHarSkader;
  const skadeBeskrivelse = harNyeSkader ? (document.getElementById('kt-skade-beskrivelse').value || '').trim() : '';
  const kommentar = (document.getElementById('kt-kommentar').value || '').trim();

  if(harNyeSkader && !skadeBeskrivelse){
    msgEl.textContent = 'Beskriv skaden du har oppdaget.';
    return;
  }

  const id = uid();
  const dato = todayISO();
  const tidspunkt = nowTimeOslo();
  const sjafor = sjaforNavn;

  // Logging av alt som sendes inn, slik at eventuelle lagringsproblemer (spesielt på
  // mobil) er enkle å diagnostisere via nettleserkonsollen (F12 / eksterne debug-verktøy).
  console.log('[submitKontroll] Sender inn kontroll', {
    id, vehicleId, dato, tidspunkt, sjafor, km, varsellamper, annetTekst,
    harNyeSkader, skadeBeskrivelse, kommentar, antallBilder: pendingKontrollPhotos.length,
    userAgent: navigator.userAgent, standalone: (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true
  });

  const submitBtn = document.getElementById('kt-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  msgEl.textContent = '';

  try{
    let linkedDamageId = null;
    if(harNyeSkader){
      linkedDamageId = uid();
      damages.push({
        id: linkedDamageId, vehicleId, dato, beskrivelse: skadeBeskrivelse,
        alvorlighet: 'middels', kommentar: 'Meldt via sjåførkontroll' + (kommentar ? ' · ' + kommentar : ''),
        status: 'registrert', registrertAv: sjafor, hasPhoto: pendingKontrollPhotos.length > 0,
        createdByControlId: id
      });
      await saveDamages();
      console.log('[submitKontroll] Skade lagret', linkedDamageId);
      if(pendingKontrollPhotos.length > 0) await savePhoto('damage:'+linkedDamageId, pendingKontrollPhotos[0]);
    }

    for(let i = 0; i < pendingKontrollPhotos.length; i++){
      await savePhoto('kontroll:'+id+':'+i, pendingKontrollPhotos[i]);
    }

    kontroller.push({
      id, vehicleId, dato, tidspunkt, sjafor, km,
      varsellamper, annetTekst, harNyeSkader, skadeBeskrivelse,
      skadeBilderCount: pendingKontrollPhotos.length, kommentar, linkedDamageId
    });
    await saveKontroller();
    console.log('[submitKontroll] Kontroll lagret i kontroller-listen', id);

    // Varsellamper er vedvarende: en huket boks oppretter kun en ny aktiv varsellys-
    // sak dersom det ikke allerede finnes en aktiv sak av samme type på bilen fra før.
    // Kun administrator kan lukke en aktiv sak (kvitterVarsellys) — å la være å huke av
    // en allerede aktiv lampe i et senere skjema fjerner den IKKE automatisk.
    // createdByControlId peker på kontrollen som først opprettet saken, til bruk ved
    // full tilbakeføring dersom akkurat den kontrollen slettes (se performKontrollDeletion).
    let nyeVarselsaker = false;
    varsellamper.forEach(key => {
      const alleredeAktiv = varsellys.some(w => w.vehicleId === vehicleId && w.type === key && w.status === 'aktiv');
      if(!alleredeAktiv){
        varsellys.push({
          id: uid(), vehicleId, type: key, annetTekst: key === 'annet' ? annetTekst : '',
          status: 'aktiv', registrertDato: dato, registrertAv: sjafor, kvittertDato: '', kvittertAv: '',
          createdByControlId: id
        });
        nyeVarselsaker = true;
      }
    });
    if(nyeVarselsaker) await saveVarsellys();

    // ---- Fase 2 / Prioritet 12: automatisk opprettelse/oppdatering av Aktive Saker ----
    // Kjøres synkront (ingen egne await/save per kall) — samlet lagring til slutt.
    // Varsellamper + kontrollavvik fra DENNE kontrollen samles i ÉN sak (Prioritet 12 —
    // Sammenslåtte Kontrollavvik) via registrerKontrollAvvikSomSak, i stedet for én sak
    // per avvik. Skade holdes utenfor sammenslåingen (egen struktur/flyt) og bruker
    // fortsatt den uendrede, enkeltavvik-baserte registrerAvvikSomSak under.
    let sakerEndret = false;
    const kontrollAvvikBatch = [];
    varsellamper.forEach(key => {
      kontrollAvvikBatch.push({
        caseType: 'varsellampe', sourceId: key,
        label: avvikTypeLabel('varsellampe', key, annetTekst), prioritet: 'hoy'
      });
    });
    avvik.forEach(key => {
      kontrollAvvikBatch.push({
        caseType: 'kontrollavvik', sourceId: key,
        label: avvikTypeLabel('kontrollavvik', key, ''), prioritet: 'normal'
      });
    });
    if(kontrollAvvikBatch.length > 0){
      registrerKontrollAvvikSomSak(vehicleId, kontrollAvvikBatch, {reportedBy: sjafor, reportedAt: dato, controlId: id, kommentar});
      sakerEndret = true;
    }
    if(harNyeSkader && linkedDamageId){
      registrerAvvikSomSak({
        vehicleId, caseType: 'skade', sourceId: linkedDamageId,
        tittel: 'Skade registrert', beskrivelse: 'Automatisk generert fra skaderegistrering.' + (skadeBeskrivelse ? ' ' + skadeBeskrivelse : ''),
        prioritet: 'normal', reportedBy: sjafor, reportedAt: dato, kommentar: kommentar,
        controlId: id
      });
      sakerEndret = true;
    }
    if(sakerEndret){
      await saveAktiveSaker();
      console.log('[submitKontroll] Aktive Saker oppdatert (Fase 2)');
    }

    v.km = km;
    await saveVehicles();
    console.log('[submitKontroll] Kilometerstand oppdatert på kjøretøy', vehicleId, km);

    pendingKontrollPhotos = [];
    kontrollFormVehicleId = ''; kontrollFormAnnet = false; kontrollFormHarSkader = false; kontrollPrefillVehicleId = '';
    kontrollFormKm = ''; kontrollFormAnnetTekst = ''; kontrollFormSkadeBeskrivelse = ''; kontrollFormKommentar = '';
    kontrollFormVarsellamper = []; kontrollDraftRestored = false; kontrollVarsellamperOpen = false;
    kontrollFormAvvik = []; kontrollAvvikOpen = false;
    clearKontrollDraft();
    console.log('[submitKontroll] FERDIG — alt lagret uten feil for kontroll', id);
    alert('Kontroll registrert for ' + vehicleLabel(v) + '.');
    if(driverMode){
      // Kontrollen er unnagjort — start biløkten på denne bilen for denne sjåføren, og
      // send videre til Min Bil (sjåførens arbeidsflate resten av den operative dagen).
      await startBilokt(vehicleId, sjafor);
      driverScreen = 'min-bil';
      render();
    } else {
      goTo('bilkort', vehicleId);
    }
  }catch(err){
    // Skjer normalt kun ved svært spesielle forhold (f.eks. lagringsplassen på enheten
    // er full). Gir en tydelig, synlig feilmelding i skjemaet i stedet for at
    // innsendingen stille forsvinner uten at sjåføren vet det.
    console.error('[submitKontroll] LAGRING FEILET', err);
    if(submitBtn) submitBtn.disabled = false;
    msgEl.innerHTML = '⚠️ Kunne ikke lagre kontrollen på denne enheten (' + esc(err && err.message ? err.message : 'ukjent feil') + '). Sjekk at enheten har ledig lagringsplass, og prøv igjen. Ta skjermbilde av denne meldingen og kontakt administrator dersom problemet gjentar seg.';
  }
}

// Analyserer hva én eller flere kontroller har opprettet, til bruk i slettedialogen
// og i selve slettelogikken. Ren analyse — endrer ingenting.
function analyserKontrollPavirkning(ids){
  const idSet = new Set(ids);
  const kontrollerListe = kontroller.filter(k => idSet.has(k.id));
  const vehicleIds = [...new Set(kontrollerListe.map(k => k.vehicleId))];
  const paavirkedeSkader = damages.filter(d => d.createdByControlId && idSet.has(d.createdByControlId));
  const paavirkedeVarsler = varsellys.filter(w => w.createdByControlId && idSet.has(w.createdByControlId) && w.status === 'aktiv');
  const paavirkedeSaker = aktiveSaker.filter(s => s.createdByControlId && idSet.has(s.createdByControlId));
  const viderebehandledeSaker = paavirkedeSaker.filter(sakHarBlittViderebehandlet);
  const sikreSaker = paavirkedeSaker.filter(s => !sakHarBlittViderebehandlet(s));
  const historikkhendelser = paavirkedeSaker.reduce((sum, s) => sum + (Array.isArray(s.historikk) ? s.historikk.length : 1), 0);
  const oppfolgingspunkter = paavirkedeSaker.filter(s => s.followUpDate || s.nextAction).length;
  // Optimalisering 13: avvik-nivå oppsummering til dialogen (f.eks. "2 varsellamper · 1
  // kontrollavvik"), til forskjell fra paavirkedeSaker som teller SAKER (kort) — én
  // flerpunkts sak (Prioritet 12) kan inneholde flere avvik av ulik type. Fungerer
  // identisk for eldre enkeltavvik-saker via sakAvvikListe()'s bakoverkompatible fallback.
  const alleAvvik = paavirkedeSaker.flatMap(sakAvvikListe);
  const avvikVarsellamper = alleAvvik.filter(a => a.caseType === 'varsellampe').length;
  const avvikKontroll = alleAvvik.filter(a => a.caseType === 'kontrollavvik').length;
  const avvikAndre = alleAvvik.length - avvikVarsellamper - avvikKontroll;
  return {kontrollerListe, vehicleIds, paavirkedeSkader, paavirkedeVarsler, paavirkedeSaker, viderebehandledeSaker, sikreSaker, historikkhendelser, oppfolgingspunkter, avvikVarsellamper, avvikKontroll, avvikAndre};
}

// Full tilbakeføring av én eller flere slettede kontroller.
// modus 'kun' (Alternativ 1): fjerner KUN kontrollen(e) selv + tilhørende bilder.
// Aktive saker, varsellamper, skader og all annen historikk står urørt — brukes når
// kontrollen ble registrert ved en feil, men den underliggende saken fortsatt er reell.
// modus 'full' (Alternativ 2): fjerner i tillegg alt som utelukkende stammer fra denne/
// disse kontrollen(e) — skader og varsellamper (kun dersom fortsatt uendret/ikke lenger
// støttet av gjenværende kontroller, som før), og nå også aktive saker (kun dersom IKKE
// viderebehandlet, med mindre administrator har krysset av for å bekrefte likevel).
// Uansett modus: kilometerstand rekalkuleres alltid (rent avledet tall, ingen "sak"),
// og det logges én bevart historikkhendelse ("Kontroll slettet") på hver berørte bil.
async function performKontrollDeletion(toDelete, opts){
  const fullCleanup = !!(opts && opts.fullCleanup);
  const arsak = (opts && opts.arsak) || '';
  const bekreftViderebehandlet = !!(opts && opts.bekreftViderebehandlet);
  const affectedVehicleIds = [...new Set(toDelete.map(k => k.vehicleId))];
  const deletedIds = new Set(toDelete.map(k => k.id));

  // Historikkhendelse FØR kontrollen fjernes, slik at den bevares i Kjøretøyhistorikk
  // (vehicleHistorikkTidslinje) selv om selve kontrollen forsvinner — gjenbruker det
  // eksisterende StatusHistorikk-feltet fra Fase 7 fremfor å opprette et nytt.
  affectedVehicleIds.forEach(vehicleId => {
    const v = vehicles.find(x => x.id === vehicleId);
    if(!v) return;
    if(!Array.isArray(v.statusHistorikk)) v.statusHistorikk = [];
    const antallHer = toDelete.filter(k => k.vehicleId === vehicleId).length;
    v.statusHistorikk.push({
      dato: todayISO(), handling: 'kontroll-slettet', arsak: arsak || '',
      kommentar: `${antallHer} kontroll${antallHer===1?'':'er'} slettet (${fullCleanup ? 'full cleanup' : 'kun kontroll'})`,
      av: loggedInRole || 'Ukjent'
    });
  });

  kontroller = kontroller.filter(k => !deletedIds.has(k.id));
  await saveKontroller();

  for(const k of toDelete) await deleteKontrollPhotos(k);

  if(fullCleanup){
    // Skader opprettet automatisk av kontrollen: slettes kun hvis de fortsatt har
    // uendret status/alvorlighetsgrad (dvs. ingen administrator har rukket å behandle
    // saken). Er den endret, beholdes skaden som en vanlig, uavhengig skaderegistrering
    // — men referansen til den slettede kontrollen fjernes uansett (Optimalisering 13:
    // ingen foreldreløse referanser skal bli liggende, selv på data som bevisst beholdes).
    let damagesChanged = false;
    for(const k of toDelete){
      if(!k.linkedDamageId) continue;
      const d = damages.find(x => x.id === k.linkedDamageId);
      if(!d) continue;
      const opprettetAvDenneKontrollen = d.createdByControlId !== undefined ? d.createdByControlId === k.id : true;
      if(!opprettetAvDenneKontrollen) continue;
      const uendretSidenOpprettelse = d.status === 'registrert' && d.alvorlighet === 'middels';
      if(uendretSidenOpprettelse){
        damages = damages.filter(x => x.id !== d.id);
        if(d.hasPhoto) await deletePhoto('damage:'+d.id);
        damagesChanged = true;
      } else {
        d.createdByControlId = null;
        damagesChanged = true;
      }
    }
    if(damagesChanged) await saveDamages();

    // Varsellamper rekalkuleres per berørt bil ut fra hvilke kontroller som faktisk
    // er igjen — ikke bare den ene som ble slettet.
    let varsellysChanged = false;
    for(const vehicleId of affectedVehicleIds){
      const remaining = vehicleKontroller(vehicleId); // nyeste først
      const fortsattStøttet = new Set();
      remaining.forEach(k => (k.varsellamper || []).forEach(type => fortsattStøttet.add(type)));
      const before = varsellys.length;
      varsellys = varsellys.filter(w => {
        if(w.vehicleId !== vehicleId) return true; // rør ikke andre biler
        const opprettetAvSlettet = w.createdByControlId && deletedIds.has(w.createdByControlId);
        if(!opprettetAvSlettet) return true;
        if(w.status !== 'aktiv'){
          // Allerede kvittert — beholdes som historikk, men referansen til den slettede
          // kontrollen fjernes her og nå (Optimalisering 13: ingen foreldreløs referanse).
          w.createdByControlId = null;
          varsellysChanged = true;
          return true;
        }
        if(fortsattStøttet.has(w.type)){
          // Fortsatt meldt av en gjenværende kontroll — beholdes, men referansen til
          // nettopp DENNE slettede kontrollen fjernes (en annen, gjenværende kontroll
          // "eier" den videre).
          w.createdByControlId = null;
          varsellysChanged = true;
          return true;
        }
        return false; // fjern — ingen gjenværende kontroll melder den lenger
      });
      if(varsellys.length !== before) varsellysChanged = true;
    }
    if(varsellysChanged) await saveVarsellys();

    // Aktive saker som utelukkende stammer fra denne/disse kontrollen(e): fjernes kun
    // dersom de IKKE er viderebehandlet, eller administrator har eksplisitt bekreftet.
    let sakerChanged = false;
    aktiveSaker = aktiveSaker.filter(s => {
      if(!s.createdByControlId || !deletedIds.has(s.createdByControlId)) return true;
      const kanFjernesAutomatisk = !sakHarBlittViderebehandlet(s) || bekreftViderebehandlet;
      if(kanFjernesAutomatisk){ sakerChanged = true; return false; }
      s.createdByControlId = null; // beholdes, men referansen til den slettede kontrollen fjernes
      return true;
    });
    if(sakerChanged) await saveAktiveSaker();
  } else {
    // "Kun slett kontroll": rydder opp gjenværende referanser til den slettede
    // kontrollen på ALT som bevisst beholdes (saker, skader, varsellamper), slik at
    // ingenting peker på en kontroll som ikke lenger finnes ("spøkelsesreferanse") —
    // selve innholdet er urørt (Optimalisering 13 — utvidet fra kun saker til alle tre).
    let sakerRefRyddet = false, damagesRefRyddet = false, varsellysRefRyddet = false;
    aktiveSaker.forEach(s => { if(s.createdByControlId && deletedIds.has(s.createdByControlId)){ s.createdByControlId = null; sakerRefRyddet = true; } });
    damages.forEach(d => { if(d.createdByControlId && deletedIds.has(d.createdByControlId)){ d.createdByControlId = null; damagesRefRyddet = true; } });
    varsellys.forEach(w => { if(w.createdByControlId && deletedIds.has(w.createdByControlId)){ w.createdByControlId = null; varsellysRefRyddet = true; } });
    if(sakerRefRyddet) await saveAktiveSaker();
    if(damagesRefRyddet) await saveDamages();
    if(varsellysRefRyddet) await saveVarsellys();
  }

  // Kilometerstand rekalkuleres uansett modus — dette er kun et avledet tall, ikke en
  // egen "sak" eller historikk, og skal aldri fortsette å vise data fra en slettet kontroll.
  for(const vehicleId of affectedVehicleIds){
    const remaining = vehicleKontroller(vehicleId);
    const v = vehicles.find(x => x.id === vehicleId);
    if(v && remaining.length > 0) v.km = remaining[0].km;
  }
  await saveVehicles();
}

// ---- Slettedialog (erstatter tidligere window.confirm()-baserte sletting) ----
function openKontrollSlettDialog(ids){
  if(!isAdmin || !ids || ids.length === 0) return;
  kontrollSlettDialog = {ids};
  kontrollSlettArsak = '';
  kontrollSlettBekreftViderebehandlet = false;
  render();
}
function lukkKontrollSlettDialog(){
  kontrollSlettDialog = null;
  render();
}
async function utforKontrollSletting(fullCleanup){
  if(!kontrollSlettDialog) return;
  const { viderebehandledeSaker } = analyserKontrollPavirkning(kontrollSlettDialog.ids);
  if(fullCleanup && viderebehandledeSaker.length > 0 && !kontrollSlettBekreftViderebehandlet) return; // knappen skal være deaktivert i dette tilfellet, men dobbeltsjekk uansett
  const toDelete = kontroller.filter(k => kontrollSlettDialog.ids.includes(k.id));
  await performKontrollDeletion(toDelete, {
    fullCleanup, arsak: kontrollSlettArsak, bekreftViderebehandlet: kontrollSlettBekreftViderebehandlet
  });
  kontrollSlettDialog.ids.forEach(id => kthSelectedIds.delete(id));
  kontrollSlettDialog = null;
  render();
}
function deleteKontroll(id){
  openKontrollSlettDialog([id]);
}
function deleteSelectedKontroller(){
  if(!isAdmin || kthSelectedIds.size === 0) return;
  openKontrollSlettDialog([...kthSelectedIds]);
}

async function addVerksted(){
  const input = document.getElementById('new-verksted-navn');
  const navn = input.value.trim();
  if(!navn) return;
  verksteder.push({id: uid(), navn});
  await saveVerksteder();
  render();
}
function toggleEditVerksted(id){
  editingVerkstedId = editingVerkstedId === id ? null : id;
  render();
}
async function saveVerkstedEdit(id){
  const w = verksteder.find(x => x.id === id);
  if(!w) return;
  const nyttNavn = document.getElementById('edit-verksted-'+id).value.trim();
  if(!nyttNavn) return;
  const gammeltNavn = w.navn;
  w.navn = nyttNavn;
  await saveVerksteder();
  if(gammeltNavn !== nyttNavn){
    // Hold eksisterende verkstedtimer konsistente med det nye navnet
    let endret = false;
    verkstedtimer.forEach(t => { if(t.verksted === gammeltNavn){ t.verksted = nyttNavn; endret = true; } });
    if(endret) await saveVerkstedtimer();
  }
  editingVerkstedId = null;
  render();
}
async function deleteVerksted(id){
  const inUse = verkstedtimer.some(t => {
    const w = verksteder.find(x => x.id === id);
    return w && t.verksted === w.navn;
  });
  if(inUse && !confirm('Dette verkstedet er brukt på registrerte verkstedtimer. Slette likevel? Eksisterende timer beholder navnet som tekst.')) return;
  verksteder = verksteder.filter(w => w.id !== id);
  await saveVerksteder();
  render();
}

async function addAdminUser(){
  const navnInput = document.getElementById('new-admin-navn');
  const tittelInput = document.getElementById('new-admin-tittel');
  const brukInput = document.getElementById('new-admin-brukernavn');
  const passInput = document.getElementById('new-admin-passord');

  const tittel = tittelInput.value;
  const brukernavn = brukInput.value.trim();

  }

  showAddAdminUser = false;
  render();
}
async function deleteAdminUser(id){
  if(adminUsers.length <= 1){ alert('Kan ikke slette siste administratorbruker.'); return; }
  const u = adminUsers.find(x => x.id === id);
  if(!u) return;
  if(!confirm('Slette administratorbrukeren «' + u.rolle + '»?')) return;
  adminUsers = adminUsers.filter(x => x.id !== id);
  await saveAdminUsers();
  if(loggedInRole === u.rolle){ logout(); return; }
  render();
}

// ================= Render dispatch =================
function render(){
  if(!loaded){ app.innerHTML = 'Laster inn...'; return; }
  if(driverMode){ renderDriverShell(); return; }
  if(!loggedInRole && screen !== 'login'){ screen = 'login'; }
  if(screen === 'login'){ renderLoginShell(); return; }
  let body = '';
  if(screen === 'dashboard') body = renderDashboard();
  else if(screen === 'register') body = renderRegister();
  else if(screen === 'bilkort') body = renderBilkort();
  else if(screen === 'skader') body = renderSkader();
  else if(screen === 'verksted') body = renderVerksted();
  else if(screen === 'innstillinger') body = renderInnstillinger();
  else if(screen === 'kontroll') body = renderKontroll();
  else if(screen === 'varsler') body = renderVarslerOversikt();
  else if(screen === 'dekkoversikt') body = renderDekkoversikt();
  else if(screen === 'kontrolloversikt') body = renderKontrolloversikt();
  else if(screen === 'kostnadsoversikt') body = renderKostnadsoversikt();
  else if(screen === 'aktivesaker') body = renderAktiveSaker();
  else if(screen === 'rapporter') body = renderRapporter();
  else if(screen === 'analyse') body = renderAnalyse();
  else if(screen === 'historikk') body = renderHistorikk();
  else if(screen === 'planlegging') body = renderPlanlegging();

  const menuActive = screen === 'register' || screen === 'innstillinger';
  // Optimalisering 15/Prioritet 17 (Del 4-5): Bilparkhelse Status og "Biler i drift nå"
  // i toppfeltet — men KUN på selve Dashboard-skjermen (appens "kontrollrom"), ikke
  // globalt på alle sider, for å unngå å smøre driftsdata utover sider som Innstillinger/
  // Rapporter der det ikke hører hjemme. Beregnes direkte her med de samme funksjonene
  // (vehicleHovedstatus/vehicleAktivSjafor) som resten av appen allerede bruker — ingen
  // egen, parallell tellelogikk.
  //
  // Prioritet 17 Del 4: "Biler i drift nå" er nå DEL AV samme rad som Bilparkhelse Status
  // (samme høydenivå, som sjekklisten ber om), i stedet for å stå i toppraden ved siden av
  // ☰ Meny. ☰ Meny-knappen selv er bevisst IKKE flyttet ned under Bilparkhelse på mobil,
  // selv om sjekklistens mobil-mockup kan leses slik — meny-knappen er delt på tvers av
  // ALLE skjermer i appen (ikke bare Dashboard), og må sitte på nøyaktig samme sted
  // uansett hvilken side brukeren er på for å være pålitelig gjenfinnbar. Å flytte den kun
  // på Dashboard ville gjort at den "hopper" avhengig av hvilken skjerm man er på.
  const uiExp = currentUiExperience();
  let dashHeaderStatusHtml = '';
  if(screen === 'dashboard' && uiExp === 'desktop'){
    const hbp = {operativ:0, oppfolging:0, verksted:0, kritisk:0};
    vehicles.forEach(v => { const st = vehicleHovedstatus(v.id); if(hbp[st] !== undefined) hbp[st]++; });
    const hDriftCount = vehicles.filter(v => !!vehicleAktivSjafor(v.id)).length;
    dashHeaderStatusHtml = `
    <div class="shell-top-status">
      <span class="shell-top-status-label">Bilparkhelse Status</span>
      <span class="shell-top-status-item" data-goto-biloversikt-filter="operativ">🟢 ${hbp.operativ} Operative</span>
      <span class="shell-top-status-item" data-goto-biloversikt-filter="oppfolging">🟡 ${hbp.oppfolging} Oppfølging</span>
      <span class="shell-top-status-item" data-goto-biloversikt-filter="verksted">🟠 ${hbp.verksted} Verksted</span>
      <span class="shell-top-status-item" data-goto-biloversikt-filter="kritisk">🔴 ${hbp.kritisk} Kritiske</span>
      <span class="shell-top-drift" data-goto-biloversikt-filter="har-aktiv-sjafor">🚚 ${hDriftCount} biler i drift nå</span>
    </div>`;
  }
  // Prioritet 27 (Design 2.0) — desktop sidebar. Regel 1/4: fem primære punkter
  // (Dashboard/Aktive saker/Historikk/Planlegging/Biloversikt) + sekundære lenker
  // (Analyse, Innstillinger, manuell overstyring) nederst. Eksisterende ☰ Meny/drawer
  // ER UENDRET og fortsatt fullt funksjonell bak sidebaren (kun visuelt skjult via CSS
  // på desktop, se .app-shell-desktop .shell-top-right) — minimerer risiko ved å ikke
  // røre drawer-logikken i det hele tatt, kun legge sidebaren til SIDEN AV den.
  const desktopSidebarHtml = uiExp === 'desktop' ? renderDesktopSidebarHtml() : '';

  app.innerHTML = `
    <div class="app-shell ${uiExp === 'desktop' ? 'app-shell-desktop' : ''}">
      ${desktopSidebarHtml}
      <div class="app-shell-main">
        <div class="shell-top">
          ${brandBlockHtml()}
          <div class="shell-top-right">
            <div class="menu-wrap">
              <button class="btn secondary small header-link ${menuActive ? 'active' : ''}" id="header-menu-btn" aria-haspopup="true" aria-expanded="${headerMenuOpen}">
                ☰ Meny
              </button>
            </div>
          </div>
          ${dashHeaderStatusHtml}
        </div>
        ${body}
      </div>
    </div>
  `;

  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => goTo(el.dataset.nav)));
  document.getElementById('header-menu-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleHeaderMenu(); });
  if(uiExp === 'desktop') attachDesktopSidebarListeners();

  renderDrawer();
  renderKontrollSlettModal();
  attachKontrollSlettModalListeners();

  if(screen === 'dashboard'){ if(currentUiExperience() === 'mobil') attachMobilHjemListeners(); else attachDashboardListeners(); }
  else if(screen === 'register') attachRegisterListeners();
  else if(screen === 'bilkort') attachBilkortListeners();
  else if(screen === 'skader') attachSkaderListeners();
  else if(screen === 'verksted') attachVerkstedListeners();
  else if(screen === 'innstillinger') attachInnstillingerListeners();
  else if(screen === 'kontroll') attachKontrollListeners();
  else if(screen === 'varsler') attachVarslerOversiktListeners();
  else if(screen === 'dekkoversikt') attachDekkoversiktListeners();
  else if(screen === 'kontrolloversikt') attachKontrolloversiktListeners();
  else if(screen === 'kostnadsoversikt') attachKostnadsoversiktListeners();
  else if(screen === 'aktivesaker') attachAktiveSakerListeners();
  else if(screen === 'rapporter') attachRapporterListeners();
  else if(screen === 'analyse') attachAnalyseListeners();
  else if(screen === 'historikk') attachHistorikkListeners();
  else if(screen === 'planlegging') attachPlanleggingListeners();
}

// ================= Mobilmeny (drawer) =================
// Bygd som ett samlet menypunkt for ALT av navigasjon (ikke bare Bilregister/
// Innstillinger som tidligere), siden appen hovedsakelig brukes på mobil og
// fanerekken øverst (.navtabs) er for trang til å være god nok alene der.
// Drawer-elementet ligger utenfor #app (se index.html), så selve glidningen
// (CSS-transition på .drawer/.drawer-overlay) ikke avbrytes av at render()
// bygger om resten av siden hver gang.
function drawerItemHtml(scr, icon, label, sub){
  const active = screen === scr;
  return `
    <button class="drawer-item ${sub ? 'sub' : ''} ${active ? 'active' : ''}" data-drawer-nav="${scr}">
      <span class="drawer-icon">${icon}</span><span>${label}</span>
      ${active ? '<span class="drawer-dot" aria-hidden="true"></span>' : ''}
    </button>`;
}
// Prioritet 27 (Design 2.0), Regel 5: Historikk-huben ERSTATTER Kontrolloversikt/
// Skadeoversikt/Dekkoversikt/Kostnadsoversikt/Verkstedoversikt/Varseloversikt som
// navigasjonspunkter i mobilens ☰ Meny (samme prinsipp som desktop-sidebaren). De
// opprinnelige renderX()-funksjonene er UENDRET i koden (kun ikke lenger koblet til
// noen meny/sidebar) — se CLAUDE.md.
function drawerOversikterHtml(){
  return `
    ${drawerItemHtml('register', '🚐', 'Biloversikt')}
    ${drawerItemHtml('historikk', '🕐', 'Historikk')}
    ${drawerItemHtml('planlegging', '📅', 'Planlegging')}
  `;
}
function renderDrawer(){
  const drawerEl = document.getElementById('app-drawer');
  if(!drawerEl) return;
  drawerEl.innerHTML = `
    <div class="drawer-header">
      <span class="drawer-title">Meny</span>
      <button class="drawer-close" id="drawer-close-btn" aria-label="Lukk meny">✕</button>
    </div>
    <div class="drawer-user">Innlogget: ${esc(loggedInRole || '')}</div>
    <div class="drawer-nav">
      ${drawerItemHtml('dashboard', '🏠', 'Dashboard')}
      ${drawerItemHtml('aktivesaker', '🗂️', 'Aktive Saker')}
      ${drawerItemHtml('rapporter', '📈', 'Rapporter')}
      ${drawerItemHtml('analyse', '🔍', 'Analyse')}
      ${drawerOversikterHtml()}
    </div>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label">Administrasjon</div>
    <div class="drawer-nav">
      ${drawerItemHtml('innstillinger', '⚙️', 'Innstillinger')}
    </div>
    <div class="drawer-footer">
      <button class="drawer-item" id="mobil-override-btn"><span class="drawer-icon">🖥️</span><span>Bytt til Desktop-visning</span></button>
      <button class="drawer-item" id="drawer-logout-btn"><span class="drawer-icon">🚪</span><span>Logg ut</span></button>
    </div>
  `;
  drawerEl.classList.toggle('open', headerMenuOpen);
  const overlayEl = document.getElementById('drawer-overlay');
  if(overlayEl) overlayEl.classList.toggle('open', headerMenuOpen);
  document.body.style.overflow = headerMenuOpen ? 'hidden' : '';

  drawerEl.querySelectorAll('[data-drawer-nav]').forEach(el => el.addEventListener('click', () => {
    closeDrawer();
    goTo(el.dataset.drawerNav);
  }));
  document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
  document.getElementById('drawer-logout-btn').addEventListener('click', () => { closeDrawer(); logout(); });
  attachMobilOverrideListener();
}
function openDrawer(){
  headerMenuOpen = true;
  const drawerEl = document.getElementById('app-drawer');
  const overlayEl = document.getElementById('drawer-overlay');
  if(drawerEl) drawerEl.classList.add('open');
  if(overlayEl) overlayEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  const btn = document.getElementById('header-menu-btn');
  if(btn) btn.setAttribute('aria-expanded', 'true');
}
function closeDrawer(){
  headerMenuOpen = false;
  const drawerEl = document.getElementById('app-drawer');
  const overlayEl = document.getElementById('drawer-overlay');
  if(drawerEl) drawerEl.classList.remove('open');
  if(overlayEl) overlayEl.classList.remove('open');
  document.body.style.overflow = '';
  const btn = document.getElementById('header-menu-btn');
  if(btn) btn.setAttribute('aria-expanded', 'false');
}
function toggleHeaderMenu(){
  if(headerMenuOpen) closeDrawer(); else openDrawer();
}

// ================= Optimalisering 3: smart slettedialog for kontroller =================
const KONTROLL_SLETT_ARSAK_ALTERNATIVER = ['Feilregistrering', 'Duplikat', 'Testdata', 'Annet'];

  const fullDeaktivert = a.viderebehandledeSaker.length > 0 && !kontrollSlettBekreftViderebehandlet;

    <div class="modal-overlay open" id="kontroll-slett-overlay">
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="Slett kontroll">

        ${harData ? `
        <div class="panel" style="margin-bottom:14px;">
          <div class="ov-label" style="margin-bottom:8px;">${flertall ? 'De valgte kontrollene har' : 'Denne kontrollen har'} opprettet:</div>
          <ul class="dmg-simple-list">
            ${a.paavirkedeVarsler.length > 0 ? `<li><span class="dmg-simple-main">🚨 ${a.paavirkedeVarsler.length} varsellampe${a.paavirkedeVarsler.length===1?'':'r'}</span></li>` : ''}
            ${a.avvikKontroll > 0 ? `<li><span class="dmg-simple-main">📋 ${a.avvikKontroll} kontrollavvik</span></li>` : ''}
            ${a.avvikAndre > 0 ? `<li><span class="dmg-simple-main">📁 ${a.avvikAndre} annet avvik</span></li>` : ''}
            ${a.paavirkedeSkader.length > 0 ? `<li><span class="dmg-simple-main">⚠️ ${a.paavirkedeSkader.length} skade${a.paavirkedeSkader.length===1?'':'r'}</span></li>` : ''}
            ${a.paavirkedeSaker.length > 0 ? `<li><span class="dmg-simple-main">🗂️ ${a.paavirkedeSaker.length} aktiv${a.paavirkedeSaker.length===1?'':'e'} sak${a.paavirkedeSaker.length===1?'':'er'}</span></li>` : ''}
            ${a.historikkhendelser > 0 ? `<li><span class="dmg-simple-main">🕐 ${a.historikkhendelser} historikkhendelse${a.historikkhendelser===1?'':'r'}</span></li>` : ''}
            ${a.oppfolgingspunkter > 0 ? `<li><span class="dmg-simple-main">📅 ${a.oppfolgingspunkter} oppfølgingspunkt${a.oppfolgingspunkter===1?'':'er'}</span></li>` : ''}
          </ul>
        </div>` : `<div class="empty-note" style="margin-bottom:14px;">Ingen tilknyttede saker eller varsler funnet — kontrollen kan trygt slettes.</div>`}

        ${a.viderebehandledeSaker.length > 0 ? `
        <div class="required-hint" style="background:var(--red-soft);color:var(--red);padding:12px 14px;border-radius:10px;font-weight:600;margin-bottom:12px;">
          ⚠️ ${a.viderebehandledeSaker.length} sak${a.viderebehandledeSaker.length===1?'':'er'} ${a.viderebehandledeSaker.length===1?'er':'er'} allerede viderebehandlet (f.eks. verksted bestilt eller nye registreringer). Automatisk sletting anbefales ikke.
        </div>
        <label style="display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;font-size:13.5px;font-weight:600;cursor:pointer;">
          <input type="checkbox" id="kontroll-slett-bekreft-videre" style="width:20px;height:20px;flex-shrink:0;margin-top:1px;" ${kontrollSlettBekreftViderebehandlet?'checked':''}>
          Jeg forstår, og ønsker å fjerne disse sakene også
        </label>` : ''}

        <div class="field" style="margin-bottom:16px;"><label>Årsak til sletting (valgfritt)</label>
          <select id="kontroll-slett-arsak">
            <option value="">Ingen valgt</option>
            ${KONTROLL_SLETT_ARSAK_ALTERNATIVER.map(a2 => `<option value="${a2}" ${kontrollSlettArsak===a2?'selected':''}>${a2}</option>`).join('')}

function attachKontrollSlettModalListeners(){
  if(!kontrollSlettDialog) return;
  const overlay = document.getElementById('kontroll-slett-overlay');
  if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) lukkKontrollSlettDialog(); });
  const avbrytBtn = document.getElementById('kontroll-slett-avbryt-btn');
  if(avbrytBtn) avbrytBtn.addEventListener('click', () => lukkKontrollSlettDialog());
  const kunBtn = document.getElementById('kontroll-slett-kun-btn');
  if(kunBtn) kunBtn.addEventListener('click', () => utforKontrollSletting(false));
  const fullBtn = document.getElementById('kontroll-slett-full-btn');
  if(fullBtn) fullBtn.addEventListener('click', () => utforKontrollSletting(true));
  const bekreftCheck = document.getElementById('kontroll-slett-bekreft-videre');
  if(bekreftCheck) bekreftCheck.addEventListener('change', (e) => { kontrollSlettBekreftViderebehandlet = e.target.checked; render(); });
  const arsakSelect = document.getElementById('kontroll-slett-arsak');
  if(arsakSelect) arsakSelect.addEventListener('change', (e) => { kontrollSlettArsak = e.target.value; });
}

// ---- Ny funksjon: Aktiv Biløkt / Min Bil — sjåførskjermer ----
// Steg 1: Velg bil. Kontrollen tilhører bilen — appen sjekker selv om dagens kontroll
// allerede er utført, og sender sjåføren rett videre uten å be om unødvendig dobbeltarbeid.
function renderDriverVelgBil(){
  return `
    <h2 style="font-size:19px;margin-bottom:6px;">Velg bil</h2>
    <div class="required-hint" style="margin-bottom:16px;">Kontrollen tilhører bilen — velg kjøretøyet du kjører i dag.</div>
    <div class="field" style="margin-bottom:18px;">
      <label>Ditt navn</label>
      <input id="db-navn" type="text" placeholder="F.eks. Ola Nordmann" value="${esc(driverNavn)}" required>
    </div>
    <div id="db-navn-msg" class="form-msg"></div>
    <div class="acc-list">
      ${sortedVehicles(vehicles).map(v => {
        const kontrollert = isKontrollertIdag(v.id);
        const aktivSjafor = vehicleAktivSjafor(v.id);
        return `
        <div class="panel" style="cursor:pointer;margin-bottom:10px;padding:16px;" data-velg-bil="${v.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div>
              <div style="font-weight:700;font-size:15.5px;font-family:'Space Grotesk',sans-serif;">${esc(v.bilnummer)} · ${esc(v.regnr)}</div>
              <div class="required-hint" style="margin-top:2px;">${esc(v.merke)} ${esc(v.modell)}${aktivSjafor ? ' · 👤 ' + esc(aktivSjafor) : ''}</div>
            </div>
            <span class="badge ${kontrollert ? 'ok' : 'unset'}">${kontrollert ? '✅ Kontrollert' : '⚪ Ikke kontrollert'}</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function attachDriverVelgBilListeners(){
  document.querySelectorAll('[data-velg-bil]').forEach(el => el.addEventListener('click', () => {
    const navnInput = document.getElementById('db-navn');
    const navn = ((navnInput ? navnInput.value : driverNavn) || '').trim();
    if(!navn){
      const msg = document.getElementById('db-navn-msg');
      if(msg) msg.textContent = 'Skriv inn navnet ditt før du velger bil.';
      if(navnInput) navnInput.focus();
      return;
    }
    driverNavn = navn;
    driverVelgBilId = el.dataset.velgBil;
    if(isKontrollertIdag(driverVelgBilId)){
      driverScreen = 'allerede-kontrollert';
    } else {
      kontrollFormVehicleId = driverVelgBilId;
      kontrollFormSjaforNavn = navn;
      syncKontrollAnnetFromActive(kontrollFormVehicleId);
      driverScreen = 'kontroll';
    }
    render();
  }));
}

function attachDriverAlleredeKontrollertListeners(){

// Steg 3: Min Bil — sjåførens arbeidsflate resten av den operative dagen.
function renderDriverMinBil(){
  const v = vehicles.find(x => x.id === driverActiveVehicleId);
  if(!v){ driverScreen = 'velg-bil'; return renderDriverVelgBil(); }
  const siste = lastKontrollForVehicle(v.id);
  const vAktiveSaker = vehicleAktiveSaker(v.id);
  const vNesteVT = vehicleVT(v.id).filter(t => t.dato >= todayISO()).sort((a,b) => a.dato.localeCompare(b.dato))[0] || null;
  const hovedstatus = vehicleHovedstatus(v.id);
  const activeVarsellysList = activeVarsellysForVehicle(v.id);
  const activeVarselTypes = new Set(activeVarsellysList.map(w => w.type));
  const activeAvvikTypes = new Set(aktiveSaker.filter(s => s.vehicleId === v.id && s.caseType === 'kontrollavvik' && sakErApen(s)).map(s => s.sourceId));

  return `
    <h2 style="font-size:19px;margin-bottom:2px;">Min Bil</h2>
    <div class="required-hint" style="margin-bottom:16px;">👤 ${esc(driverNavn)}</div>

  if(avvikBtn) avvikBtn.addEventListener('click', () => { minBilAksjon = minBilAksjon === 'avvik' ? '' : 'avvik'; render(); });

  if(kontaktBtn) kontaktBtn.addEventListener('click', () => { minBilAksjon = minBilAksjon === 'kontakt' ? '' : 'kontakt'; render(); });

  const skadeLagreBtn = document.getElementById('mb-skade-lagre-btn');

  document.querySelectorAll('[data-mb-varsel]').forEach(el => el.addEventListener('click', () => {

  if(varselAnnetInput) varselAnnetInput.addEventListener('input', e => { minBilVarselAnnetTekst = e.target.value; });
  const varselLagreBtn = document.getElementById('mb-varsel-lagre-btn');
  if(varselLagreBtn) varselLagreBtn.addEventListener('click', submitMinBilVarsel);

  document.querySelectorAll('[data-mb-avvik]').forEach(el => el.addEventListener('click', () => {

function vehicleReasons(v){
  const reasons = [];
  if(v.status === 'oppfolging') reasons.push('Trenger oppfølging');
  if(v.status === 'verksted') reasons.push('På verksted');
  return reasons;
}
function isFlagged(v){
  const openCount = damages.filter(d => d.vehicleId === v.id && skadeIsOpen(d)).length;
  return vehicleReasons(v).length > 0 || openCount > 0;
}

// ================= Prioritet 27 (Design 2.0) — Mobil hjemskjerm =================
// Regel 3: "Mobil Dashboard skal ikke eksistere som Desktop Dashboard." Ikonbasert,
// handlingsdrevet hjemskjerm — IKKE en smal utgave av desktopens kort-baserte Dashboard.
// Samme underliggende data som resten av appen (kun badge-tall på tre av ikonene) —
// totaltKreverHandlingCount()/flatePlanleggingData() er delte funksjoner, ingen egen
// datamodell for mobil.
const MOBIL_HJEM_IKONER = [
  {key:'minbil', ikon:'🚚', label:'Min bil'},
  {key:'kontroll', ikon:'✅', label:'Kontroll'},
  {key:'avvik', ikon:'🚨', label:'Registrer avvik'},
  {key:'aktivesaker', ikon:'📋', label:'Aktive saker'},
  {key:'service', ikon:'🔧', label:'Service'},
  {key:'dekk', ikon:'🛞', label:'Dekk'},
  {key:'biloversikt', ikon:'🚐', label:'Biloversikt'},
  {key:'planlegging', ikon:'📅', label:'Planlegging'}
];
function renderMobilHjem(){
  const badgeAktiveSaker = totaltKreverHandlingCount();
  const planData = flatePlanleggingData(30);
  const badgePlanlegging = planData.service.length + planData.dekk.length + planData.verksted.length + planData.oppfolging.length + planData.euKontroll.length;
  const BADGE = {aktivesaker: badgeAktiveSaker, planlegging: badgePlanlegging};
  return `
    <div class="mobil-hjem-grid">
      ${MOBIL_HJEM_IKONER.map(x => `
        <button type="button" class="mobil-hjem-btn" data-mobilhjem="${x.key}">

          <span class="mobil-hjem-label">${x.label}</span>

      `).join('')}

function attachMobilHjemListeners(){
  document.querySelectorAll('[data-mobilhjem]').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.mobilhjem;
    if(key === 'minbil') goToMinBil();
    else if(key === 'kontroll') goToRegisterKontroll('');
    else if(key === 'avvik') goToRegisterSak('');
    else if(key === 'aktivesaker') goTo('aktivesaker');
    else if(key === 'service'){ mobilBilvalgMaal = 'service'; goTo('register'); }
    else if(key === 'dekk'){ mobilBilvalgMaal = 'dekk'; goTo('register'); }
    else if(key === 'biloversikt') goTo('register');
    else if(key === 'planlegging') goTo('planlegging');
  }));
}

function renderDashboard(){
  if(oppdaterVerkstedStatuser()) saveAktiveSaker();
  // Regel 3 (Prioritet 27 — Design 2.0): mobil får en helt annen forside her — ingen av
  // kortene/logikken under kjøres i det hele tatt for mobil, kun for desktop.
  if(currentUiExperience() === 'mobil') return renderMobilHjem();
  const totalVehicles = vehicles.length;

  const today = todayISO();
  const upcomingVT = verkstedtimer.filter(t => t.dato >= today).sort((a,b) => (a.dato+((a.tidspunkt)||'')).localeCompare(b.dato+((b.tidspunkt)||'')));
  const nearestVT = upcomingVT[0] || null;
  const nearestWithin7 = nearestVT ? vtWithinWeek(nearestVT.dato) : false;

  const kontrollertIdagCount = vehicles.filter(v => isKontrollertIdag(v.id)).length;
  // Optimalisering 14: reservebiler som ikke er tatt i bruk ennå i dag telles verken som
  // "kontrollert" eller "mangler kontroll" — de er unntatt fra kontrollkravet helt til de
  // faktisk tas i bruk (se vehicleErReserveUnntatt()), og skal ikke skape støy her.
  const reserveUnntattCount = vehicles.filter(v => vehicleErReserveUnntatt(v.id)).length;
  const manglerKontrollCount = totalVehicles - kontrollertIdagCount - reserveUnntattCount;
  // ---- Krever handling nå (Kort 1) — uendret fra Optimalisering 2, kun utvidet med et
  // "prioritet"-felt (Kritisk/Høy/Normal) per element, jf. Prioritet 26.2 sitt krav om
  // en synlig Prioritet-kolonne. Fortsatt gjenbruk av sakKreverHandling() — ingen ny
  // forretningslogikk, kun samlet presentasjon.
  const kritiskeSakerAlle = aktiveSaker.filter(s => sakErApen(s) && s.priority === 'kritisk');
  const oppfolgingKreverHandlingSaker = aktiveSaker.filter(s => sakErApen(s) && s.priority !== 'kritisk' && sakKreverHandling(s));
  const uteAvDriftBiler = vehicles.filter(v => v.uteAvDrift);
  const dashTotalHandlinger = kritiskeSakerAlle.length + oppfolgingKreverHandlingSaker.length + manglerKontrollCount;
  // Optimalisering 15 (Del 5): kun kritiske saker/ute av drift skal farge panelet rødt —
  // manglende kontroll (og oppfølging i dag) er lavere alvorlighetsgrad og skal IKKE lenger
  // gjøre hele "Krever handling nå" rød bare fordi noen biler ikke er kontrollert ennå.
  const krHarKritisk = kritiskeSakerAlle.length > 0 || uteAvDriftBiler.length > 0;
  const dashKreverListe = [];
  uteAvDriftBiler.forEach(v => dashKreverListe.push({sort:-1, ikon:'⛔', prioritet:'Kritisk', vehicleId:v.id, linje1:'Ute av drift', linje2: v.uteAvDriftArsak || '', aksjon:'Vurder driftssituasjon'}));
  kritiskeSakerAlle.forEach(s => {
    const alder = sakAlderDager(s);
    dashKreverListe.push({sort:0, ikon:'🔴', prioritet:'Kritisk', vehicleId:s.vehicleId, sakId:s.id, linje1:sakKortOverskrift(s), linje2:`Åpen i ${alder===null?'–':alder} dag${alder===1?'':'er'}`, aksjon: s.nextAction || 'Kontakt verksted'});
  });
  oppfolgingKreverHandlingSaker.forEach(s => {
    const op = sakOppfolgingStatus(s);
    const linje2 = op === 'forfalt' ? `Oppfølging forfalt med ${-daysUntil(s.followUpDate)} dag${-daysUntil(s.followUpDate)===1?'':'er'}` : sakVarslingTekst(s);
    const aksjon = s.nextAction || (op === 'forfalt' ? 'Følg opp forfalt sak' : 'Følg opp sak i dag');
    dashKreverListe.push({sort: op === 'forfalt' ? 1 : 2, ikon: op === 'forfalt' ? '🔴' : '🟠', prioritet: op === 'forfalt' ? 'Høy' : 'Normal', vehicleId:s.vehicleId, sakId:s.id, linje1:sakKortOverskrift(s), linje2, aksjon});
  });
  vehicles.filter(v => !isKontrollertIdag(v.id) && !vehicleErReserveUnntatt(v.id)).forEach(v => {
    dashKreverListe.push({sort:3, ikon:'🟡', prioritet:'Normal', vehicleId:v.id, linje1:'Kontroll mangler i dag', linje2:'', aksjon:'Registrer kontroll'});
  });
  dashKreverListe.sort((a,b) => a.sort - b.sort);
  const dashKreverTop5 = dashKreverListe.slice(0, 5);

  // ---- Prioritet 26.2 (Dashboard Nullstilling) — Kort 2: "Kommer snart" ----
  // Slår sammen det som faktisk finnes i kodebasen av "kommer snart"-data: kommende
  // verkstedtimer (inntil 7 dager, gjenbruker eksisterende vtWithinWeek()) og saker med
  // oppfølgingsdato innen 3 dager (sakOppfolgingStatus() === 'snart' — allerede
  // eksisterende terskel, ingen ny prognoselogikk). Det som allerede vises i "Krever
  // handling nå" (dagens/forfalte oppfølginger, kritiske saker, mangler kontroll) er
  // bevisst utelatt her for å unngå dobbeltinformasjon. Service-/kontrollprognoser
  // finnes ikke i kodebasen og er bevisst IKKE bygget nå (se foranalyse).
  const kommerSnartVT = verkstedtimer.filter(t => vtWithinWeek(t.dato))
    .map(t => ({sortDato: t.dato, ikon:'🔧', vehicleId:t.vehicleId, vtId:t.id, sakId:t.sakId,
      linje1: t.dato === today ? 'Verksted i dag' : `Verksted ${fmt(t.dato)}`,
      linje2: t.tidspunkt ? `kl. ${t.tidspunkt}` : ''}));
  const kommerSnartOppfolging = aktiveSaker.filter(s => sakOppfolgingStatus(s) === 'snart')
    .map(s => ({sortDato: s.followUpDate, ikon:'📋', vehicleId:s.vehicleId, sakId:s.id,
      linje1: sakKortOverskrift(s), linje2: `Oppfølging ${fmt(s.followUpDate)}`}));
  const kommerSnartListe = kommerSnartVT.concat(kommerSnartOppfolging)
    .sort((a,b) => a.sortDato.localeCompare(b.sortDato))
    .slice(0, 5);

  // ---- Prioritet 26.2 — Kort 3: "Prioriterte biler" ----
  // Samme dashKreverListe som Kort 1, men gruppert PER BIL (ikke per sak) — én rad per
  // bil, med bilens mest alvorlige årsak (laveste sort-verdi, siden dashKreverListe
  // allerede er sortert kritisk→forfalt→oppfølging→mangler kontroll). Ingen ny
  // forretningslogikk eller datakilde.
  const prioriterteBilerMap = new Map();
  dashKreverListe.forEach(item => { if(!prioriterteBilerMap.has(item.vehicleId)) prioriterteBilerMap.set(item.vehicleId, item); });
  const prioriterteBilerListe = Array.from(prioriterteBilerMap.values()).slice(0, 5);

  // Ny funksjon: Aktiv Biløkt — antall biler med en aktiv sjåfør akkurat nå (kun tallet
  // vises på Dashboard, i toppfeltet — detaljene finnes i Biloversikt, se Svar 4).
  const bilerIDriftCount = vehicles.filter(v => !!vehicleAktivSjafor(v.id)).length;

  const g = greetingInfo();
  const displayNavn = loggedInRole || '';
  const loggedInUser = adminUsers.find(u => u.rolle === loggedInRole);
  const displayTittel = loggedInUser && loggedInUser.tittel ? loggedInUser.tittel : '';

  return `
    <div class="greeting-card ${g.klasse}" style="position:relative;">
      <div class="greeting-actions" style="position:absolute;top:16px;right:18px;display:flex;gap:4px;">
        <button style="background:var(--surface);border:none;padding:2px 4px;border-radius:5px;font-size:18px;line-height:1;cursor:pointer;" id="greet-kontroll-btn" title="Registrer kontroll">✅</button>
        <button style="background:var(--surface);border:none;padding:2px 4px;border-radius:5px;font-size:18px;line-height:1;cursor:pointer;" id="greet-vt-btn" title="Registrer verkstedtime">🔧</button>
      </div>
      <div class="greeting-grid">
        <div class="greeting-left">
          <div class="greeting-title">${g.hilsen}, ${esc(displayNavn)} ${g.ikon}</div>
          ${displayTittel ? `<div class="greeting-role">${esc(displayTittel)}</div>` : ''}
          <div class="greeting-sub">${g.sub}</div>
          <div class="greeting-datetime">${fmtDateTime(todayISO(), nowTimeOslo())}</div>
          ${weatherData ? `<div class="greeting-weather">${weatherData.ikon} ${weatherData.temp}°C i Larvik · ${esc(weatherData.tekst)}</div>` : ''}
        </div>
        <div class="greeting-right">
          <div class="panel" style="cursor:pointer;padding:12px 16px;text-align:right;margin:0;" ${nearestVT ? `data-goto-vt-vehicle="${nearestVT.vehicleId}"` : `data-stat-nav="kommende-vt"`}>
            <div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">⭐ Neste verkstedtime</div>
            <div style="font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;">${nearestVT ? fmt(nearestVT.dato) + ' – ' + esc((vehicles.find(x => x.id === nearestVT.vehicleId) || {}).regnr || '?') : 'Ingen planlagt'}</div>
          </div>
        </div>

function renderRegister(){
  const q = filterSearch.trim().toLowerCase();
  const filtered = vehicles.filter(v => {
    if(q && !((v.bilnummer||'').toLowerCase().includes(q) || v.regnr.toLowerCase().includes(q) || (v.modell||'').toLowerCase().includes(q) || (v.loyvenummer||'').toLowerCase().includes(q))) return false;
    if(filterKategori && v.kategori !== filterKategori) return false;
    if(filterKontrollStatus === 'kontrollert' && !isKontrollertIdag(v.id)) return false;
    if(filterKontrollStatus === 'ikke' && (isKontrollertIdag(v.id) || vehicleErReserveUnntatt(v.id))) return false;
    if(filterLoyve === 'har' && !v.loyvenummer) return false;
    if(filterLoyve === 'mangler' && v.loyvenummer) return false;
    // Prioritet 26.2/27: samme filter Dashboardets Bilparkhelse-chips og mobilens
    // 🚚 Min bil-ikon bruker — gjenbruker vehicleHovedstatus()/vehicleAktivSjafor()
    // uendret, ingen ny tellelogikk.
    if(filterHovedstatus === 'har-aktiv-sjafor' && !vehicleAktivSjafor(v.id)) return false;
    if(filterHovedstatus === 'tilgjengelig' && vehicleAktivSjafor(v.id)) return false;
    if(filterHovedstatus && filterHovedstatus !== 'har-aktiv-sjafor' && filterHovedstatus !== 'tilgjengelig' && vehicleHovedstatus(v.id) !== filterHovedstatus) return false;
    return true;

          <select id="new-dekk">

        </div>
        <div class="field"><label>Kilometerstand</label><input id="new-km" type="number" inputmode="numeric" min="0" step="1" placeholder="F.eks. 42000"></div>
      </div>
      <div class="field" style="margin-bottom:10px;"><label>Løyvenummer</label><input id="new-loyvenummer" type="text" inputmode="numeric" placeholder="F.eks. 123456, NO-12345 eller BRING-001"></div>
      <div class="form-msg" id="new-vehicle-msg"></div>

    <div class="filters-row">

      <div class="dash-group-grid" style="grid-template-columns:1fr;">
        ${KATEGORI_ORDER.filter(k => filtered.some(v => v.kategori === k)).map(k => {
          const gruppeBiler = sortedVehicles(filtered.filter(v => v.kategori === k));
          // Er kun ÉN kategori synlig pga. filter, eller man kommer fra mobilens
          // Service/Dekk-dyplenke (rett i gang med å velge bil), åpnes gruppen automatisk
          // i tillegg til manuelt åpnede grupper.
          const open = registerGrupperApne.has(k) || filterKategori === k || !!mobilBilvalgMaal;
          return `

            <div class="group-card-head" data-toggle-register-gruppe="${k}">

                <div class="gallery" style="margin-top:12px;">

              </div>

        }).join('')}
      </div>

function attachRegisterListeners(){
  document.getElementById('register-back').addEventListener('click', () => goBack('dashboard'));
  document.getElementById('add-vehicle-btn').addEventListener('click', () => { showAddVehicleForm = !showAddVehicleForm; render(); });
  const f = document.getElementById('add-vehicle-form');
  if(f) f.addEventListener('submit', submitAddVehicle);
  document.getElementById('f-search').addEventListener('input', e => {
    filterSearch = e.target.value; render();
    const el = document.getElementById('f-search'); el.focus(); el.selectionStart = el.value.length;
  });
  document.getElementById('f-kategori').addEventListener('change', e => { filterKategori = e.target.value; render(); });
  document.getElementById('f-kontrollstatus').addEventListener('change', e => { filterKontrollStatus = e.target.value; render(); });
  document.getElementById('f-hovedstatus').addEventListener('change', e => { filterHovedstatus = e.target.value; render(); });
  document.getElementById('f-loyve').addEventListener('change', e => { filterLoyve = e.target.value; render(); });
  document.querySelectorAll('[data-toggle-register-gruppe]').forEach(el => el.addEventListener('click', () => toggleRegisterGruppe(el.dataset.toggleRegisterGruppe)));
  document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => {
    const vid = el.dataset.open;
    const maal = mobilBilvalgMaal;
    mobilBilvalgMaal = '';
    goTo('bilkort', vid);
    // goTo('bilkort', ...) nullstiller bilkortOpenSections til en ny, tom Set — derfor må
    // 'dekk' legges til ETTER goTo(), ikke før, ellers overskrives den umiddelbart.
    if(maal === 'dekk'){ bilkortOpenSections.add('dekk'); render(); }
    if(maal){
      // Vent til bilkort er rendret før vi scroller til riktig seksjon.
      setTimeout(() => { const el2 = document.getElementById('bilkort-seksjon-' + maal); if(el2) el2.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
    }
  }));
}
function galleryCard(v){
  const openCount = damages.filter(d => d.vehicleId === v.id && skadeIsOpen(d)).length;
  const totalCount = damages.filter(d => d.vehicleId === v.id).length;
  const aktiveVarsler = activeVarsellysForVehicle(v.id);
  const kontrollertIdag = isKontrollertIdag(v.id);
  // Optimalisering 14: reservebil som ikke er tatt i bruk ennå i dag — vis tydelig HVORFOR
  // kontroll ikke er forventet, i stedet for den vanlige amber "Ikke kontrollert"-varselen.
  const reserveUnntatt = vehicleErReserveUnntatt(v.id);
  // Optimalisering 8: samme vehicleAktivSjafor() som Dashboard/Kjøretøyprofil — ingen ny
  // datakilde, kun lagt til visning her (manglet tidligere på selve Biloversikt-siden).
  const aktivSjafor = vehicleAktivSjafor(v.id);
  return `
    <div class="gcard ${v.status}" data-open="${v.id}">
      <div class="gcard-head">
        <div class="plate"><span class="cc">N</span><span class="num">${esc(v.regnr)}</span></div>
        <div class="gcard-titles">
          <div class="model">${esc(v.bilnummer)} · ${esc(v.merke)} ${esc(v.modell)}</div>
          <div class="model-sub">${v.km ? Number(v.km).toLocaleString('nb-NO') + ' km' : 'Km ikke satt'}${v.arsmodell ? ' · Årsmodell ' + esc(v.arsmodell) : ''}${v.loyvenummer ? ' · Løyve ' + esc(v.loyvenummer) : ''}</div>
          <div class="vl-indicator ${aktiveVarsler.length > 0 ? 'red' : 'green'}" style="margin-top:4px;">
            ${aktiveVarsler.length > 0 ? `🔴 ${aktiveVarsler.length} aktiv${aktiveVarsler.length===1?'':'e'} varsellampe${aktiveVarsler.length===1?'':'r'}` : '🟢 Ingen aktive varsellamper'}
          </div>
          <div class="vl-indicator ${reserveUnntatt ? 'green' : (kontrollertIdag ? 'green' : 'amber')}" style="margin-top:2px;">
            ${reserveUnntatt ? '🚐 Reservebil — ikke i bruk i dag' : (kontrollertIdag ? '✅ Kontrollert i dag' : '⚠️ Ikke kontrollert i dag')}
          </div>
          <div class="vl-indicator ${aktivSjafor ? 'amber' : 'green'}" style="margin-top:2px;">
            ${aktivSjafor ? `👤 Aktiv sjåfør: ${esc(aktivSjafor)}` : '⚪ Tilgjengelig'}
          </div>
        </div>
      </div>
      <div class="gcard-badges">
        <span class="badge ${v.status}">${STATUS_LABEL[v.status] || 'OK'}</span>
        <span class="badge unset">${KATEGORI_LABEL[v.kategori] || '—'}</span>
        ${totalCount > 0 ? `<span class="badge ${openCount > 0 ? 'overdue' : 'unset'}">${totalCount} skade${totalCount === 1 ? '' : 'r'}</span>` : ''}
      </div>
    </div>
  `;
}

function attachDamageCardListeners(list){

  document.querySelectorAll('[data-mark-fikset]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); markSkadeFikset(el.dataset.markFikset); }));
  list.forEach(d => {
    const saveBtn = document.getElementById('e-sk-save-'+d.id);
    if(saveBtn) saveBtn.addEventListener('click', (e) => { e.stopPropagation(); saveDamageEdit(d.id); });
    const cancelBtn = document.getElementById('e-sk-cancel-'+d.id);
    if(cancelBtn) cancelBtn.addEventListener('click', (e) => { e.stopPropagation(); editingDamageId = null; render(); });
    const delBtn = document.getElementById('e-sk-delete-'+d.id);
    if(delBtn) delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteDamage(d.id); });
    const photoInput = document.getElementById('e-sk-photo-'+d.id);
    if(photoInput) photoInput.addEventListener('click', e => e.stopPropagation());
    if(photoInput) photoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      pendingPhotoData = await resizeImage(file);
      const img = document.getElementById('edit-photo-preview-'+d.id);
      if(img){ img.src = pendingPhotoData; img.style.display = 'block'; }
    });
  });
}
// Kanonisk, felles sortering for kjøretøy — speiler nøyaktig samme gruppering og
// rekkefølge som Dashboardet (Bil 1–11, deretter Lastebiler, deretter Monteringsbiler,
// sortert på bilnummer innad i hver gruppe — aldri alfabetisk, aldri på regnr).
// ALLE bil-dropdowns i appen henter rekkefølgen sin herfra via vehicleOptions() under,
// slik at Dashboard, Bilregister, Verkstedtimer, Skader og Sjåførkontroll alltid stemmer
// overens — endres denne ene funksjonen, oppdateres alle dropdowns automatisk.
function sortedVehicles(list){
  return (list || vehicles).slice().sort((a, b) => {
    const catA = KATEGORI_ORDER.indexOf(a.kategori);
    const catB = KATEGORI_ORDER.indexOf(b.kategori);
    if(catA !== catB) return catA - catB;
    return ruteNumber(a) - ruteNumber(b);
  });
}
function vehicleOptions(selectedId){
  const sorted = sortedVehicles(vehicles);
  return KATEGORI_ORDER.map(kat => {
    const gruppe = sorted.filter(v => v.kategori === kat);
    if(gruppe.length === 0) return '';
    const options = gruppe.map(v => `<option value="${v.id}" ${v.id===selectedId?'selected':''}>${esc(vehicleLabel(v))} — ${esc(v.merke)} ${esc(v.modell)}</option>`).join('');
    return `<optgroup label="${esc(KATEGORI_GROUP_LABEL[kat])}">${options}</optgroup>`;
  }).join('');
}

async function submitAddDekkkostnad(ev){
  ev.preventDefault();

  const dato = readDateInput('dkk-dato');

  const msgEl = document.getElementById('dkk-msg');
  if(!vehicleId || !dato || !kostnadRaw){
    msgEl.textContent = 'Fyll ut bil, dato (DD/MM/ÅÅÅÅ) og kostnad.';

  const kostnad = Number(kostnadRaw.replace(/\s/g,'').replace(',','.'));

function attachDekkoversiktListeners(){
  document.getElementById('dekk-back').addEventListener('click', () => goBack());

    showAddDekkkostnad = !showAddDekkkostnad;
    render();
  });
  const dkkForm = document.getElementById('add-dekkkostnad-form');
  if(dkkForm) dkkForm.addEventListener('submit', submitAddDekkkostnad);
  document.querySelectorAll('[data-delete-dekkkostnad]').forEach(el => el.addEventListener('click', () => deleteDekkkostnad(el.dataset.deleteDekkkostnad)));
  document.querySelectorAll('[data-toggle-dekk-vehicle]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.toggleDekkVehicle;
    if(dekkOversiktOpenVehicles.has(id)) dekkOversiktOpenVehicles.delete(id); else dekkOversiktOpenVehicles.add(id);

    goTo('bilkort', el.dataset.gotoBilkortDekk);
  }));
}

function isoDaysAgo(n){
  const d = new Date(todayISO() + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0,10);
}
function isoMonthsAgo(n){
  const d = new Date(todayISO() + 'T00:00:00Z');
  d.setUTCMonth(d.getUTCMonth() - n);
  return d.toISOString().slice(0,10);
}
function mondayOfWeek(iso){
  const d = new Date(iso + 'T00:00:00Z');
  const day = d.getUTCDay(); // 0=søndag, 1=mandag, ...
  d.setUTCDate(d.getUTCDate() + (day === 0 ? -6 : 1 - day));
  return d.toISOString().slice(0,10);
}

// ================= scrKontrolloversikt (analyse/oppfølging) =================
function renderKontrolloversikt(){
  const today = todayISO();
  let periodeFiltrert;
  if(kontrolloversiktPeriode === 'idag') periodeFiltrert = kontroller.filter(k => k.dato === today);
  else if(kontrolloversiktPeriode === '7dager'){ const grense = isoDaysAgo(6); periodeFiltrert = kontroller.filter(k => k.dato >= grense && k.dato <= today); }
  else if(kontrolloversiktPeriode === 'maned'){ const prefix = today.slice(0,7); periodeFiltrert = kontroller.filter(k => k.dato && k.dato.startsWith(prefix)); }
  else periodeFiltrert = kontroller.filter(k => (!kontrolloversiktFraDato || k.dato >= kontrolloversiktFraDato) && (!kontrolloversiktTilDato || k.dato <= kontrolloversiktTilDato));

  const byVehicle = new Map();
  periodeFiltrert.forEach(k => {
    if(!byVehicle.has(k.vehicleId)) byVehicle.set(k.vehicleId, []);
    byVehicle.get(k.vehicleId).push(k);
  });
  const bilerMedKontroller = vehicles.filter(v => byVehicle.has(v.id))
    .sort((a,b) => (byVehicle.get(b.id).length) - (byVehicle.get(a.id).length));

  // Faste totalstatistikker — uavhengig av det valgte periodefilteret.
  const totaltAntall = kontroller.length;
  const antallIdag = kontroller.filter(k => k.dato === today).length;
  const antall7Dager = kontroller.filter(k => k.dato >= isoDaysAgo(6) && k.dato <= today).length;
  const antallDenneMaaneden = kontroller.filter(k => k.dato && k.dato.startsWith(today.slice(0,7))).length;
  const countPerVehicleAlleTider = new Map();
  kontroller.forEach(k => countPerVehicleAlleTider.set(k.vehicleId, (countPerVehicleAlleTider.get(k.vehicleId)||0) + 1));
  let mestKontrollerte = null, minstKontrollerte = null;
  vehicles.forEach(v => {
    const c = countPerVehicleAlleTider.get(v.id) || 0;
    if(!mestKontrollerte || c > mestKontrollerte.antall) mestKontrollerte = {v, antall: c};
    if(!minstKontrollerte || c < minstKontrollerte.antall) minstKontrollerte = {v, antall: c};
  });

  return `
    <div class="backrow"><button class="backbtn" id="ko-back">← Tilbake</button></div>
    <h2 style="font-size:19px;margin-bottom:6px;">📋 Kontrolloversikt</h2>
    <div class="required-hint" style="margin-bottom:16px;">Analyse og oppfølging av sjåførkontroller per bil.</div>

    <div class="dekk-status-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
      <div class="ov-item"><span class="ov-label">Kontroller totalt</span><span class="ov-value" style="font-size:20px;">${totaltAntall}</span></div>
      <div class="ov-item"><span class="ov-label">I dag</span><span class="ov-value" style="font-size:20px;">${antallIdag}</span></div>
      <div class="ov-item"><span class="ov-label">Siste 7 dager</span><span class="ov-value" style="font-size:20px;">${antall7Dager}</span></div>
      <div class="ov-item"><span class="ov-label">Denne måneden</span><span class="ov-value" style="font-size:20px;">${antallDenneMaaneden}</span></div>
      <div class="ov-item"><span class="ov-label">Mest kontrollerte</span><span class="ov-value" style="font-size:14.5px;">${mestKontrollerte && mestKontrollerte.antall > 0 ? esc(vehicleLabel(mestKontrollerte.v)) + ' (' + mestKontrollerte.antall + ')' : '—'}</span></div>
      <div class="ov-item"><span class="ov-label">Minst kontrollerte</span><span class="ov-value" style="font-size:14.5px;">${minstKontrollerte ? esc(vehicleLabel(minstKontrollerte.v)) + ' (' + minstKontrollerte.antall + ')' : '—'}</span></div>
    </div>

    <div class="filters-row" style="margin-bottom:18px;">
      <button class="btn small ${kontrolloversiktPeriode==='idag'?'':'secondary'}" data-periode="idag">Kontroller i dag</button>
      <button class="btn small ${kontrolloversiktPeriode==='7dager'?'':'secondary'}" data-periode="7dager">Siste 7 dager</button>
      <button class="btn small ${kontrolloversiktPeriode==='maned'?'':'secondary'}" data-periode="maned">Denne måneden</button>
      <button class="btn small ${kontrolloversiktPeriode==='egendefinert'?'':'secondary'}" data-periode="egendefinert">Egendefinert periode</button>
    </div>
    ${kontrolloversiktPeriode === 'egendefinert' ? `
    <div class="filters-row" style="margin-bottom:18px;">
      <input type="text" id="ko-fra" inputmode="numeric" data-kind="date" placeholder="Fra DD/MM/ÅÅÅÅ" maxlength="10" value="${kontrolloversiktFraDato ? fmt(kontrolloversiktFraDato) : ''}">
      <input type="text" id="ko-til" inputmode="numeric" data-kind="date" placeholder="Til DD/MM/ÅÅÅÅ" maxlength="10" value="${kontrolloversiktTilDato ? fmt(kontrolloversiktTilDato) : ''}">
    </div>` : ''}

    <div class="required-hint" style="margin-bottom:14px;">${periodeFiltrert.length} kontroller i valgt periode, fordelt på ${bilerMedKontroller.length} biler.</div>

    ${isAdmin && kthSelectedIds.size > 0 ? `
    <div class="toolbar">
      <div class="count">${kthSelectedIds.size} valgt${kthSelectedIds.size === 1 ? '' : 'e'}</div>
      <button class="btn danger-outline small" id="kth-delete-selected-btn">🗑️ Slett valgte</button>
    </div>` : ''}

    ${bilerMedKontroller.length === 0 ? `<div class="empty-note">Ingen kontroller registrert i valgt periode.</div>` : `
    <div class="acc-list">
      ${bilerMedKontroller.map(v => {
        const kList = byVehicle.get(v.id).sort((a,b) => (b.dato+((b.tidspunkt)||'')).localeCompare(a.dato+((a.tidspunkt)||'')));
        const open = kontrolloversiktOpenVehicles.has(v.id);
        return `
        <div class="acc-row ${open?'expanded':''}">
          <div class="acc-head" data-toggle-ko-vehicle="${v.id}">
            <div class="acc-head-left"><div class="flag-name">📍 ${esc(v.bilnummer||'')} – ${esc(v.regnr)}</div></div>
            <div class="acc-head-right"><span class="group-count">${kList.length} kontroll${kList.length===1?'':'er'}</span><span class="chevron">⌄</span></div>
          </div>
          ${open ? `<div class="acc-body"><div class="dmg-list">${kList.map(k => kontrollHistorikkRow(k)).join('')}</div></div>` : ''}
        </div>`;
      }).join('')}
    </div>`}
  `;
}

  document.getElementById('ko-back').addEventListener('click', () => goBack());
  document.querySelectorAll('[data-periode]').forEach(el => el.addEventListener('click', () => { kontrolloversiktPeriode = el.dataset.periode; render(); }));

}
