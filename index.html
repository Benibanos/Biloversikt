  if(annetTekstInput) annetTekstInput.addEventListener('input', e => { kontrollFormAnnetTekst = e.target.value; saveKontrollDraft(); });
  const skadeBeskrivelseInput = document.getElementById('kt-skade-beskrivelse');
  if(skadeBeskrivelseInput) skadeBeskrivelseInput.addEventListener('input', e => { kontrollFormSkadeBeskrivelse = e.target.value; saveKontrollDraft(); });

  const annetBtn = document.getElementById('kt-varsel-annet');
  if(annetBtn) annetBtn.addEventListener('click', () => {
    kontrollFormAnnet = !kontrollFormAnnet;
    if(!kontrollFormAnnet) kontrollFormAnnetTekst = '';
    saveKontrollDraft();
    render();
  });
  VARSELLAMPE_ORDER.filter(k => k !== 'annet').forEach(key => {
    const btn = document.getElementById('kt-varsel-'+key);
    if(btn) btn.addEventListener('click', () => {
      if(kontrollFormVarsellamper.includes(key)) kontrollFormVarsellamper = kontrollFormVarsellamper.filter(k => k !== key);
      else kontrollFormVarsellamper.push(key);
      saveKontrollDraft();
      render();
    });
  });
  KONTROLLAVVIK_ORDER.forEach(key => {
    const btn = document.getElementById('kt-avvik-'+key);
    if(btn) btn.addEventListener('click', () => {
      if(kontrollFormAvvik.includes(key)) kontrollFormAvvik = kontrollFormAvvik.filter(k => k !== key);
      else kontrollFormAvvik.push(key);
      saveKontrollDraft();
      render();
    });
  });

  const jaRadio = document.getElementById('kt-skade-ja');
  const neiRadio = document.getElementById('kt-skade-nei');
  if(jaRadio) jaRadio.addEventListener('change', () => { kontrollFormHarSkader = true; saveKontrollDraft(); render(); });
  if(neiRadio) neiRadio.addEventListener('change', () => { kontrollFormHarSkader = false; saveKontrollDraft(); render(); });

  const fotoInput = document.getElementById('kt-skade-foto');
  if(fotoInput) fotoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await resizeImage(file);
      pendingKontrollPhotos.push(dataUrl);
    }
    render();
  });
  document.querySelectorAll('[data-remove-photo]').forEach(btn => btn.addEventListener('click', (e) => {
    e.preventDefault();
    pendingKontrollPhotos.splice(Number(btn.dataset.removePhoto), 1);
    render();
  }));
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && headerMenuOpen) closeDrawer();
});
const drawerOverlayEl = document.getElementById('drawer-overlay');
if(drawerOverlayEl) drawerOverlayEl.addEventListener('click', closeDrawer);

// ================= Sveipenavigasjon (mobil) =================
// Optimalisering 7: to uavhengige sveipegester, skilt på HVOR sveipen starter
// (ikke bare retning), slik at de aldri kommer i konflikt med hverandre:
//
// 1) Sveip høyre fra en smal sone helt ute i venstre skjermkant
//    (SWIPE_EDGE_SONE) = åpne sidemenyen (samme som ☰ Meny/`openDrawer()`).
//    Fungerer på alle hovedsider (Dashboard, Biloversikt, Kontrolloversikt,
//    Verkstedoversikt, Aktive Saker, Kjøretøyprofil, Skadeoversikt,
//    Varseloversikt, Dekkoversikt) siden menyknappen finnes likt på alle
//    admin-skjermer. Sjåførmodus ("Min Bil") har ingen sidemeny i det hele
//    tatt (egen, bevisst minimal skjermflyt) og er derfor uendret utelatt.
// 2) Sveip høyre som IKKE starter i kantsonen beholder den eksisterende
//    "tilbake"-logikken (samme som ← Tilbake-knappen, via
//    navigasjonshistorikken) på oversiktssidene — helt uendret oppførsel,
//    ingen eksisterende navigasjon brytes.
// Sveip venstre hvor som helst = lukk menyen når den er åpen (samme
// `toggleHeaderMenu()` som før — åpner den også når den er lukket, uendret).
// Rene vertikale bevegelser (scrolling) og sveip som starter i input/select/
// textarea/knapp ignoreres, slik at de ikke kommer i konflikt med normal bruk.
const OVERSIKT_SWIPE_BACK_SCREENS = ['kontrolloversikt', 'verksted', 'skader', 'varsler', 'dekkoversikt', 'kostnadsoversikt', 'aktivesaker', 'rapporter', 'analyse', 'historikk', 'planlegging', 'bilkort', 'kontroll', 'register', 'innstillinger'];
const SWIPE_EDGE_SONE = 24; // px fra venstre kant — bevisst smal for presisjon, ikke aggressiv deteksjon
let swipeStartX = null, swipeStartY = null, swipeIgnored = false, swipeFraKant = false;
const SWIPE_TERSKEL = 70;
document.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1){ swipeStartX = null; return; }
  const target = e.target;
  swipeIgnored = !!(target.closest && target.closest('input, select, textarea, button, a, [data-kind], .datepicker-popup, .timepicker-popup'));
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeFraKant = swipeStartX <= SWIPE_EDGE_SONE;
}, {passive: true});
document.addEventListener('touchmove', (e) => {
  if(swipeStartX === null || swipeIgnored) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  // Klart vertikal bevegelse (scrolling) — ikke tolk som sveip.
  if(Math.abs(dy) > Math.abs(dx)){ swipeIgnored = true; }
}, {passive: true});
document.addEventListener('touchend', (e) => {
  if(swipeStartX === null || swipeIgnored){ swipeStartX = null; return; }
  const touch = e.changedTouches[0];
  const dx = touch.clientX - swipeStartX;
  const dy = touch.clientY - swipeStartY;
  const fraKant = swipeFraKant;
  swipeStartX = null;
  if(Math.abs(dx) < SWIPE_TERSKEL || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if(dx > 0){
    if(fraKant){
      // Sveip høyre fra venstre kant: åpne sidemenyen (kun der menyknappen finnes).
      if(!driverMode && loggedInRole && !headerMenuOpen) openDrawer();
      return;
    }
    // Sveip høyre (ikke fra kanten): samme "tilbake"-logikk som ← Tilbake-
    // knappen (går til reell forrige skjerm via navigasjonshistorikken).
    // Ingenting på Dashboard selv. Uendret fra tidligere.
    if(!driverMode && OVERSIKT_SWIPE_BACK_SCREENS.includes(screen)){
      if((screen === 'rapporter' && rapportType) || (screen === 'analyse' && analyseType)){
        if(screen === 'rapporter'){ rapportType = ''; showRapportFilterMeny = false; }
        else { analyseType = ''; showAnalyseFilterMeny = false; }
        render();
      } else {
        goBack(screen === 'bilkort' ? 'register' : 'dashboard');
      }
    }
  } else {
    // Sveip venstre: lukk menyen om den er åpen, ellers uendret oppførsel
    // (åpner menyen — samme som før).
    if(!driverMode && loggedInRole){
      toggleHeaderMenu();
    }
  }
}, {passive: true});

detectDriverMode();
if(driverMode){ screen = 'kontroll'; kontrollDraftRestored = loadKontrollDraft(); }
// Sørger for at "Installer app" mens man står i sjåførmodus installerer en snarvei
// som alltid åpner rett i kontrollskjemaet — se manifest-sjafor.json. Uten dette
// ville en installert snarvei brukt admin-manifestets start_url (index.html uten
// parameter) og sendt sjåføren til innloggingssiden neste gang ikonet trykkes.
if(driverMode){
  const manifestLink = document.querySelector('link[rel="manifest"]');
  if(manifestLink) manifestLink.setAttribute('href', 'manifest-sjafor.json');
}
loadAll();
if(!driverMode) fetchWeather();

// Prioritet 27 — Adaptiv Layout: reagerer på faktisk vindusendring (nettleser endres i
// sanntid, nettbrett roteres) — ikke bare ved sideinnlasting. Re-renderer KUN dersom
// selve UI-opplevelsen (mobil/desktop) faktisk krysser en grense, ikke ved hver eneste
// pikselendring, for å unngå unødvendige re-renders mens noen f.eks. drar i et
// nettleservindu. Debounces (150ms) av samme grunn. Ingen effekt når `deviceOverride`
// er satt — da er brukeren bevisst i manuell modus og skal ikke bli "hentet tilbake" av
// en tilfeldig vindusendring.
let lastKnownUiExperience = currentUiExperience();
let resizeDebounceTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeDebounceTimer);
  resizeDebounceTimer = setTimeout(() => {
    const ny = currentUiExperience();
    if(ny !== lastKnownUiExperience){
      lastKnownUiExperience = ny;
      if(!driverMode && screen !== 'login') render();
    }
  }, 150);
});

// ================= PWA: installasjon og offline-støtte =================
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('Kunne ikke registrere service worker', e));
  });
}
let deferredInstallPrompt = null;
const installBar = document.getElementById('pwa-install-bar');
const installBtn = document.getElementById('pwa-install-btn');
const installDismiss = document.getElementById('pwa-install-dismiss');
let pwaInstallBarDismissed = false; // erstatter sessionStorage — nullstilles ved sideoppdatering, som er greit for en "ikke vis igjen nå"-linje
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone() && !pwaInstallBarDismissed) {
    installBar.style.display = 'flex';
  }
});
if (installBtn) installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBar.style.display = 'none';
});
if (installDismiss) installDismiss.addEventListener('click', () => {
  installBar.style.display = 'none';
  pwaInstallBarDismissed = true;
});
window.addEventListener('appinstalled', () => {
  installBar.style.display = 'none';
  deferredInstallPrompt = null;
});
const iosHint = document.getElementById('pwa-ios-hint');
const iosDismiss = document.getElementById('pwa-ios-dismiss');
let pwaIosHintDismissed = false; // erstatter sessionStorage, se pwaInstallBarDismissed over
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
if (isIOS() && !isStandalone() && !pwaIosHintDismissed) {
  iosHint.style.display = 'flex';
}
if (iosDismiss) iosDismiss.addEventListener('click', () => {
  iosHint.style.display = 'none';
  pwaIosHintDismissed = true;
});
</script>
