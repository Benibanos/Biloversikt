<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilpark</title>

<meta name="theme-color" content="#1C2024">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilpark">

<!-- Airtable — sentral database. Se AIRTABLE_MIGRATION.md for full forklaring
     og oppsett, inkludert et viktig sikkerhetsforbehold om at API-tokenet i
     airtable-config.js er synlig for alle som besøker siden. -->
<script src="airtable-config.js"></script>
<script src="storage.airtable.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#EEF0F0;
    --surface:#FFFFFF;
    --ink:#1C2024;
    --muted:#5B6470;
    --line:#DCE0E2;
    --red:#E30613;
    --red-soft:#FDE8E9;
    --amber:#B4720A;
    --amber-soft:#FBEEDC;
    --green:#1F8A57;
    --green-soft:#E7F4EC;
    --blue:#003399;
    --blue-soft:#E7ECFA;
    --plate-blue:#003399;
    --chrome-bg:#1C2024;
    --chrome-text:#FFFFFF;
    --radius:14px;
  }
  /* Mørkemodus: mørkegrå (ikke helsvart) med lyse tekster og samme fargeprofil,
     satt via data-theme på <html> (styrt av tema-valget i Innstillinger). */
  :root[data-theme="dark"]{
    --bg:#15171B;
    --surface:#1E2126;
    --ink:#ECEDEE;
    --muted:#9AA1AB;
    --line:#33373E;
    --red:#FF6B6B;
    --red-soft:#3D1418;
    --amber:#F5B94D;
    --amber-soft:#3D2E0E;
    --green:#4ADE94;
    --green-soft:#0F2B1E;
    --blue:#7AA2FF;
    --blue-soft:#141C33;
    --chrome-bg:#ECEDEE;
    --chrome-text:#15171B;
  }
  *{box-sizing:border-box;}
  /* Felles, global regel — IKKE per komponent — som sørger for at absolutt alle
     <select>-nedtrekksmenyer i appen (bilvalg, verkstedvalg, statusvalg, kategori,
     filtre, Administratorbrukere, Verkstedregister osv.) følger valgt tema, inkludert
     selve popup-listen med valgene når man klikker ned menyen. Dette er den ene
     felles løsningen alle nåværende OG fremtidige select-elementer arver automatisk,
     uten at noen enkelt-dropdown trenger egen styling. */
  select, select option{background-color:var(--surface);color:var(--ink);}
  select option:checked, select option:hover{background-color:var(--bg);}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;padding-top:env(safe-area-inset-top, 0px);}
  #app{max-width:1080px;margin:0 auto;padding:24px 16px calc(80px + env(safe-area-inset-bottom, 0px));}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;}

  /* ---- App shell ---- */
  .shell-top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    padding-bottom:14px;margin-bottom:14px;
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,#0B8457 0%,#0B8457 45%,#FF7A00 100%) 1;
  }
  .brand-block{display:flex;flex-direction:column;gap:2px;padding-top:2px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
  .brand-sub{font-size:11.5px;color:var(--muted);font-weight:500;}
  .header-link.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .header-action-btn{
    background:var(--surface);color:var(--ink);border:1.5px solid var(--line);
  }
  .header-action-btn:hover{background:var(--bg);}
  .header-action-btn.active{
    background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);
    box-shadow:0 0 0 3px var(--amber-soft);
  }
  .btn-label-short{display:none;}
  .shell-top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .menu-wrap{position:relative;}
  .datepicker-popup{
    position:absolute;width:min(300px,92vw);background:var(--surface);border:1.5px solid var(--line);
    border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;z-index:300;
  }
  .dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-nav{background:none;border:1.5px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:16px;color:var(--ink);cursor:pointer;}
  .dp-nav:hover{background:var(--bg);}
  .dp-month-year{background:none;border:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;padding:6px 10px;border-radius:8px;}
  .dp-month-year:hover{background:var(--bg);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .dp-weekdays div{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{
    aspect-ratio:1;border:none;background:none;border-radius:8px;font-size:13px;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:38px;font-family:'Inter',sans-serif;
  }
  .dp-day:hover{background:var(--bg);}
  .dp-day.muted{color:var(--muted);opacity:.45;}
  .dp-day.today{border:1.5px solid var(--chrome-bg);font-weight:700;}
  .dp-day.selected{background:var(--chrome-bg);color:var(--chrome-text);font-weight:700;}
  .dp-today-btn{width:100%;margin-top:10px;padding:9px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
  .dp-today-btn:hover{background:var(--bg);}
  .dp-year-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:230px;overflow-y:auto;}
  .dp-year-opt{padding:9px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .dp-year-opt:hover{background:var(--bg);}
  .dp-year-opt.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .timepicker-popup{
    position:absolute;width:140px;max-height:280px;overflow-y:auto;background:var(--surface);
    border:1.5px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);
    padding:6px;z-index:300;
  }
  .tp-list{display:flex;flex-direction:column;gap:2px;}
  .tp-row{
    padding:10px 12px;min-height:40px;border:none;background:none;border-radius:8px;
    font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .tp-row:hover{background:var(--bg);}
  .tp-row.selected{background:var(--chrome-bg);color:var(--chrome-text);font-weight:700;}
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;height:100dvh;width:min(340px,88vw);
    background:var(--surface);z-index:201;box-shadow:-10px 0 34px rgba(0,0,0,.22);
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;border-bottom:1.5px solid var(--line);flex-shrink:0;
  }
  .drawer-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--ink);}
  .drawer-close{
    background:none;border:1.5px solid var(--line);border-radius:10px;
    width:42px;height:42px;min-width:42px;font-size:18px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .drawer-close:hover{background:var(--bg);}
  .drawer-user{
    padding:12px 18px;font-size:12px;color:var(--muted);font-weight:600;
    border-bottom:1.5px solid var(--line);flex-shrink:0;
  }
  .drawer-section-label{
    padding:16px 18px 6px;font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;
  }
  .drawer-nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;}
  .drawer-item{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:none;border:none;border-radius:12px;padding:14px 13px;min-height:52px;
    font-size:15px;font-weight:600;color:var(--ink);font-family:'Inter',sans-serif;cursor:pointer;
  }
  .drawer-item:hover{background:var(--bg);}
  .drawer-item .drawer-icon{font-size:19px;width:24px;text-align:center;flex-shrink:0;}
  .drawer-item.active{background:var(--amber-soft);font-weight:700;}
  .drawer-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;margin-left:auto;}
  .drawer-divider{height:1.5px;background:var(--line);margin:10px 14px;flex-shrink:0;}
  .drawer-footer{padding:10px 10px 16px;margin-top:auto;border-top:1.5px solid var(--line);flex-shrink:0;}
  @media (max-width:640px){
    .drawer{width:100%;box-shadow:none;}
  }

  .navtabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .navtab{background:none;border:1.5px solid var(--line);color:var(--muted);padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .navtab.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .navtab:not(.active):hover{border-color:var(--ink);color:var(--ink);}
  .navtab:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{background:var(--chrome-bg);color:var(--chrome-text);border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn:hover{filter:brightness(0.85);}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.danger-outline{background:var(--surface);color:var(--red);border:1.5px solid var(--red-soft);font-weight:600;}
  .btn.danger-outline:hover{background:var(--red-soft);}
  .btn.danger{background:var(--red);color:#fff;border:1.5px solid var(--red);font-weight:700;}
  .btn.danger:hover{opacity:.9;}
  .danger-zone{
    margin-top:40px;padding:18px;border:1.5px dashed var(--red);border-radius:var(--radius);
    background:var(--red-soft);
  }
  .danger-zone-title{font-size:13px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .backbtn{background:none;border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink);font-weight:600;min-height:44px;display:inline-flex;align-items:center;}
  .backbtn:hover{border-color:var(--ink);}

  /* ---- Dashboard ---- */
  .greeting-card{
    background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:20px;
  }
  .greeting-card.morgen{border-left-color:var(--amber);}
  .greeting-card.dag{border-left-color:var(--ink);}
  .greeting-card.kveld{border-left-color:var(--blue);}
  .greeting-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .greeting-sub{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .greeting-role{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;opacity:.7;}
  .greeting-datetime{font-size:12.5px;color:var(--muted);margin-top:10px;}
  .greeting-weather{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .greeting-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;}
  .greeting-right{
    display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:flex-start;
    padding-left:20px;border-left:1.5px solid var(--line);
  }
  .status-chip{
    display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:100px;
    background:var(--bg);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--ink);white-space:nowrap;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  }
  .status-chip:hover{border-color:var(--ink);}
  .status-chip:active{transform:scale(0.95);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;
    cursor:pointer;transition:box-shadow .15s ease, transform .1s ease, border-color .15s ease;
  }
  .stat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--muted);}
  .stat-card:active{transform:scale(0.97);}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .stat-label{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:8px;}
  .stat-card.accent-red .stat-num{color:var(--red);}
  .stat-card.accent-amber .stat-num{color:var(--amber);}
  .stat-card.accent-blue .stat-num{color:var(--blue);}

  .section-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .group-count{background:var(--line);color:var(--muted);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .dash-row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:26px;}
  .dash-row-2 .stat-grid{margin-bottom:0;}
  .dash-group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .dash-group-card{padding:0;overflow:hidden;}
  .group-card-head{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:16px 18px;min-height:44px;cursor:pointer;
  }
  .group-card-title{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:700;}
  .group-card-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .group-card-head .chevron{transition:transform .2s ease;flex-shrink:0;}
  .group-card-head .chevron.open{transform:rotate(180deg);}
  /* Myk åpne/lukke-animasjon uten JS-målt høyde: raden animerer mellom 0fr og 1fr,
     og det indre laget skjuler overflyt mens den er lukket. Arver temaet automatisk
     siden ingen farger er hardkodet her. */
  .vehicle-group-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .vehicle-group-body.open{grid-template-rows:1fr;}
  .vehicle-group-body > div{overflow:hidden;padding:0 18px;}
  .vehicle-group-body.open > div{padding-bottom:16px;}
  .flag-name{font-weight:600;font-size:13.5px;}
  .flag-reason{font-size:12px;color:var(--muted);}
  .empty-note{color:var(--muted);font-size:13px;padding:16px 0;}

  .acc-list{display:flex;flex-direction:column;gap:10px;}
  .acc-row{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);border-left:5px solid var(--line);overflow:hidden;transition:box-shadow .15s;}
  .acc-row.ok{border-left-color:var(--green);}
  .acc-row.oppfolging{border-left-color:var(--amber);}
  .acc-row.verksted{border-left-color:var(--blue);}
  .acc-row.varsel{border-left-color:var(--red);}
  .acc-row:hover{box-shadow:0 3px 14px rgba(0,0,0,.06);}
  .acc-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap;}
  .acc-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .acc-head-right{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .acc-row .chevron{color:var(--muted);font-size:18px;transition:transform .15s;}
  .acc-row.expanded .chevron{transform:rotate(180deg);}
  .acc-body{border-top:1.5px solid var(--line);padding:16px;background:var(--bg);}

  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 20px;}
  .ov-item{display:flex;flex-direction:column;gap:2px;}
  .ov-item-clickable{
    cursor:pointer;padding:8px 10px;margin:-8px -10px;border-radius:10px;
    transition:background .15s ease, transform .1s ease;
  }
  .ov-item-clickable:hover{background:var(--bg);}
  .ov-item-clickable:active{transform:scale(0.97);}
  .ov-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .ov-value{font-size:13.5px;font-weight:600;}

  .dmg-simple-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .dmg-simple-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;}
  .dmg-simple-main{font-size:13px;}
  .dmg-simple-list li[data-goto-vt]{cursor:pointer;}
  .dmg-simple-list li[data-goto-vt]:hover{border-color:var(--ink);}

  /* ---- Bilregister ---- */
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters-row input[type=text], .filters-row input[type=date], .filters-row select{
    font-family:'Inter',sans-serif;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-height:44px;
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}
  .filters-row select, .filters-row input[type=date]{min-width:150px;}
  .filters-row input:focus, .filters-row select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .count{font-size:13px;color:var(--muted);}

  .panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel h3{font-size:15px;margin-bottom:12px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select, .field textarea{font-family:'Inter',sans-serif;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px;}
  .field textarea{resize:vertical;min-height:90px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
  .panel-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);}
  .empty h3{color:var(--ink);margin-bottom:6px;font-size:16px;}

  .gcard{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--line);border-left:5px solid var(--line);overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
  .gcard.ok{border-left-color:var(--green);}
  .gcard.oppfolging{border-left-color:var(--amber);}
  .gcard.verksted{border-left-color:var(--blue);}
  .gcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.07);}
  .gcard-head{padding:16px;display:flex;gap:12px;align-items:flex-start;min-width:0;}
  .plate{flex-shrink:0;display:flex;height:34px;border-radius:5px;overflow:hidden;border:1.5px solid #1C2024;font-family:'Space Grotesk',sans-serif;}

<script>
// ---- Nettverksstatus ----
// Lagringen skjer nå sentralt i Airtable (se airtable-config.js og
// storage.airtable.js, lastet i <head> FØR denne filen). I motsetning til
// Firestore har ikke Airtables API innebygd offline-kø — mister enheten
// nettet midt i en innsending, kan den feile. Varsellinjen under gjør i det
// minste tydelig NÅR det er tilfelle, slik at man kan prøve igjen når nettet
// er tilbake i stedet for å anta at innsendingen gikk gjennom.
function updateOfflineBanner(){
  let bar = document.getElementById('offline-banner');
  if(!navigator.onLine){
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'offline-banner';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B45309;color:#fff;padding:12px 16px;font:600 13.5px system-ui,sans-serif;text-align:center;';
      bar.textContent = '📡 Ingen nettforbindelse. Det du registrerer nå lagres lokalt på enheten og sendes automatisk til den sentrale databasen så snart nettet er tilbake.';
      document.body.prepend(bar);
    }
  } else if(bar){
    bar.remove();
  }
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
document.addEventListener('DOMContentLoaded', updateOfflineBanner);
</script>
<script>

let currentVehicleId = null;
let pendingVehiclePhoto = null;
let editingDamageId = null;
let editingVTId = null;
let pendingPhotoData = null; // felles buffer for bildeopplasting (skade/bil)

let filterSearch = '';
let filterKategori = '';
let filterKontrollStatus = ''; // '' | 'kontrollert' | 'ikke'
let filterLoyve = ''; // '' | 'har' | 'mangler'

// lastes helt på nytt) siden dette kun er et vanlig JS-modulnivå-objekt.

}
const GRUPPE_IKON = {bil:'🚐', lastebil:'🚚', montering:'🔧', reserve:'🔄'};

// redigering av skade, verkstedtime eller bilinfo, eller rett og slett har fokus i et
// hvilket som helst tekstfelt/nedtrekksmeny akkurat nå.
function formInProgress(){
  if(screen === 'kontroll') return true;
  if(showAddVehicleForm) return true;
  if(showAddSkade || editingDamageId) return true;
  if(showAddVT || editingVTId) return true;
  if(editingVerkstedId) return true;
  if(bilkortOpenSections && bilkortOpenSections.has('info')) return true;
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return true;
  return false;
}

// Innstillinger: sammenleggbare seksjoner (alle lukket som standard, jf. "unngå lange

let bilkortOpenSections = new Set(); // delmengde av: 'info' | 'kontroll' | 'skade'

}

}

  else bilkortSkadeSubOpen.add(key);
  render();
}
let showAddAdminUser = false;

let kontroller = [];
let kontrollPrefillVehicleId = '';
let kontrollFormVehicleId = '';
let kontrollFormAnnet = false;
let kontrollFormHarSkader = false;
let kontrollFormKm = '';
let kontrollFormAnnetTekst = '';
let kontrollFormSkadeBeskrivelse = '';
let kontrollFormKommentar = '';
let kontrollFormSjaforNavn = '';
let kontrollFormVarsellamper = []; // huket-av varsellampe-nøkler (utenom 'annet', som spores separat i kontrollFormAnnet)
let pendingKontrollPhotos = []; // array av dataURL-er, flere skadebilder per kontroll

// ---- Midlertidig lagring av sjåførkontroll-skjemaet ----

// database er fortsatt utelukkende Airtable (se storage.airtable.js). Formålet

// Kladden slettes automatisk når kontrollen sendes inn, eller etter 24 timer.
const KONTROLL_DRAFT_KEY = 'bilpark-kontroll-draft-v1';

function saveKontrollDraft(){

    const draft = {

let themePreference = 'system'; // 'light' | 'dark' | 'system'
function resolveTheme(){
  if(themePreference === 'light' || themePreference === 'dark') return themePreference;
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  }catch(e){ /* ignore */ }
  return 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());

const APP_TIMEZONE = 'Europe/Oslo';
function todayISO(){
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone: APP_TIMEZONE, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  const y = parts.find(p => p.type === 'year').value;

// Personlig velkomsthilsen på Dashboard, basert på klokkeslett i Europe/Oslo.
// 05:00–11:59 morgen · 12:00–17:59 dag · 18:00–04:59 kveld.
function greetingInfo(){
  const hourStr = new Intl.DateTimeFormat('nb-NO', {timeZone: APP_TIMEZONE, hour:'2-digit', hourCycle:'h23'}).format(new Date());
  const hour = parseInt(hourStr, 10);
  const sub = 'Velkommen tilbake til bilparken';

function fmt(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return '—';
  return `${m[3]}/${m[2]}/${m[1]}`;
}
// Kompakt dato uten årstall (DD/MM) — brukt i statuschips der plass er knapp.
function fmtShort(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return '—';
  return `${m[3]}/${m[2]}`;
}
function fmtDateTime(iso, tid){
  const datePart = fmt(iso);
  if(datePart === '—') return '—';
  return tid ? `${datePart} kl. ${tid}` : datePart;
}

// ---- Låst dato-/klokkeslettformat (DD/MM/ÅÅÅÅ, 24t) uavhengig av nettleser-/OS-språk ----
// Native <input type="date"/"time"> viser MM/DD/ÅÅÅÅ og AM/PM når nettleseren/OS-en er
// satt til engelsk (en-US), siden det formatet styres av nettleseren selv og ikke av
// siden. Derfor brukes vanlige tekstfelt her, med tvungen DD/MM/ÅÅÅÅ- og TT:MM-maske,
// slik at formatet blir identisk uansett hvilken maskin/nettleser man bruker.
function maskDateValue(raw){
  const digits = raw.replace(/\D/g,'').slice(0,8); // DDMMÅÅÅÅ
  let out = digits.slice(0,2);
  if(digits.length > 2) out += '/' + digits.slice(2,4);
  if(digits.length > 4) out += '/' + digits.slice(4,8);
  return out;
}
function maskTimeValue(raw){
  const digits = raw.replace(/\D/g,'').slice(0,4); // TTMM
  let out = digits.slice(0,2);
  if(digits.length > 2) out += ':' + digits.slice(2,4);
  return out;
}
// ================= Kalender (date picker) for alle datofelt =================
// Egenbygget, tema-tilpasset kalender-popup i stedet for nettleserens innebygde
// <input type="date"> — sistnevnte viser dato i enhetens lokale format (kan bli
// MM/DD/ÅÅÅÅ på enkelte enheter) og kan ikke stiles til mørkemodus. Denne komponenten
// garanterer DD/MM/ÅÅÅÅ overalt og følger appens tema automatisk. Kobles generisk til
// ALLE felt med data-kind="date" via delegert lytting, så nye datofelt arver dette
// helt av seg selv uten videre arbeid. Manuell inntasting fungerer fortsatt ved siden
// av, som en fallback.
const UKEDAGER_KORT = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
const MANEDER_NAVN = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
let datepickerTargetId = null;

function parseDDMMYYYY(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str||'').trim());
  if(!m) return null;

  popup.querySelectorAll('[data-dp-year]').forEach(el => el.addEventListener('click', () => datepickerSetYear(Number(el.dataset.dpYear))));
  popup.querySelectorAll('[data-dp-day]').forEach(el => el.addEventListener('click', () => datepickerSelectDay(Number(el.dataset.dpY), Number(el.dataset.dpM), Number(el.dataset.dpDay))));

function daysUntil(iso){
  if(!iso) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return null;
  const [ty, tm, td] = todayISO().split('-').map(Number);
  const target = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const today = Date.UTC(ty, tm - 1, td);
  return Math.round((target - today) / 86400000);
}
function vtWithinWeek(iso){
  const d = daysUntil(iso);
  return d !== null && d >= 0 && d <= 7;
}
function daysSince(iso){
  const d = daysUntil(iso);
  return d === null ? null : -d;
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function vehicleKontroller(vid){
  return kontroller.filter(k => k.vehicleId === vid).sort((a,b) => (b.dato+((b.tidspunkt)||'')).localeCompare(a.dato+((a.tidspunkt)||'')));
}
// Siste kontroll for en bil (nyeste først, se vehicleKontroller over).
function lastKontrollForVehicle(vid){
  const list = vehicleKontroller(vid);
  return list.length ? list[0] : null;
}
// "Kontrollert i dag" er ikke et lagret flagg, men regnes ut live mot dagens dato i
// Europe/Oslo (todayISO()). Det gjør at statusen nullstilles helt automatisk ved
// midnatt norsk tid, uten noen egen tidsstyrt jobb eller reset-logikk.
function isKontrollertIdag(vid){
  const last = lastKontrollForVehicle(vid);
  return !!(last && last.dato === todayISO());
}
async function submitKontroll(ev){
  ev.preventDefault();
  const msgEl = document.getElementById('kt-msg');
  const vehicleId = document.getElementById('kt-vehicle').value;
  const km = document.getElementById('kt-km').value;
  const sjaforNavn = (document.getElementById('kt-sjafornavn').value || '').trim();
  if(!vehicleId || !km || !sjaforNavn){
    msgEl.textContent = 'Fyll ut sjåførnavn, velg bil, og fyll ut kilometerstand.';
    return;
  }
  const v = vehicles.find(x => x.id === vehicleId);
  if(Number(km) < Number(v.km || 0)){
    if(!confirm('Kilometerstanden du oppga (' + Number(km).toLocaleString('nb-NO') + ' km) er lavere enn det som er registrert fra før (' + Number(v.km||0).toLocaleString('nb-NO') + ' km). Registrere likevel?')) return;
  }

  const varsellamper = VARSELLAMPE_ORDER.filter(key => {
    const box = document.getElementById('kt-varsel-'+key);
    return box && box.checked;
  });
  const annetTekst = kontrollFormAnnet ? (document.getElementById('kt-annet-tekst').value || '').trim() : '';
  const harNyeSkader = kontrollFormHarSkader;
  const skadeBeskrivelse = harNyeSkader ? (document.getElementById('kt-skade-beskrivelse').value || '').trim() : '';
  const kommentar = (document.getElementById('kt-kommentar').value || '').trim();

  if(harNyeSkader && !skadeBeskrivelse){
    msgEl.textContent = 'Beskriv skaden du har oppdaget.';
    return;
  }

  const id = uid();
  const dato = todayISO();
  const tidspunkt = nowTimeOslo();
  const sjafor = sjaforNavn;

  // Logging av alt som sendes inn, slik at eventuelle lagringsproblemer (spesielt på
  // mobil) er enkle å diagnostisere via nettleserkonsollen (F12 / eksterne debug-verktøy).
  console.log('[submitKontroll] Sender inn kontroll', {
    id, vehicleId, dato, tidspunkt, sjafor, km, varsellamper, annetTekst,
    harNyeSkader, skadeBeskrivelse, kommentar, antallBilder: pendingKontrollPhotos.length,
    userAgent: navigator.userAgent, standalone: (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true
  });

  const submitBtn = document.getElementById('kt-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  msgEl.textContent = '';

  try{
    let linkedDamageId = null;
    if(harNyeSkader){
      linkedDamageId = uid();
      damages.push({
        id: linkedDamageId, vehicleId, dato, beskrivelse: skadeBeskrivelse,
        alvorlighet: 'middels', kommentar: 'Meldt via sjåførkontroll' + (kommentar ? ' · ' + kommentar : ''),
        status: 'registrert', registrertAv: sjafor, hasPhoto: pendingKontrollPhotos.length > 0,
        createdByControlId: id
      });
      await saveDamages();
      console.log('[submitKontroll] Skade lagret', linkedDamageId);
      if(pendingKontrollPhotos.length > 0) await savePhoto('damage:'+linkedDamageId, pendingKontrollPhotos[0]);
    }

    for(let i = 0; i < pendingKontrollPhotos.length; i++){
      await savePhoto('kontroll:'+id+':'+i, pendingKontrollPhotos[i]);
    }

    kontroller.push({
      id, vehicleId, dato, tidspunkt, sjafor, km,
      varsellamper, annetTekst, harNyeSkader, skadeBeskrivelse,
      skadeBilderCount: pendingKontrollPhotos.length, kommentar, linkedDamageId
    });
    await saveKontroller();
    console.log('[submitKontroll] Kontroll lagret i kontroller-listen', id);

    // Varsellamper er vedvarende: en huket boks oppretter kun en ny aktiv varsellys-
    // sak dersom det ikke allerede finnes en aktiv sak av samme type på bilen fra før.
    // Kun administrator kan lukke en aktiv sak (kvitterVarsellys) — å la være å huke av
    // en allerede aktiv lampe i et senere skjema fjerner den IKKE automatisk.
    // createdByControlId peker på kontrollen som først opprettet saken, til bruk ved
    // full tilbakeføring dersom akkurat den kontrollen slettes (se performKontrollDeletion).
    let nyeVarselsaker = false;
    varsellamper.forEach(key => {
      const alleredeAktiv = varsellys.some(w => w.vehicleId === vehicleId && w.type === key && w.status === 'aktiv');
      if(!alleredeAktiv){
        varsellys.push({
          id: uid(), vehicleId, type: key, annetTekst: key === 'annet' ? annetTekst : '',
          status: 'aktiv', registrertDato: dato, registrertAv: sjafor, kvittertDato: '', kvittertAv: '',
          createdByControlId: id
        });
        nyeVarselsaker = true;
      }
    });
    if(nyeVarselsaker) await saveVarsellys();

    v.km = km;
    await saveVehicles();
    console.log('[submitKontroll] Kilometerstand oppdatert på kjøretøy', vehicleId, km);

    pendingKontrollPhotos = [];
    kontrollFormVehicleId = ''; kontrollFormAnnet = false; kontrollFormHarSkader = false; kontrollPrefillVehicleId = '';
    kontrollFormKm = ''; kontrollFormAnnetTekst = ''; kontrollFormSkadeBeskrivelse = ''; kontrollFormKommentar = '';
    kontrollFormVarsellamper = []; kontrollDraftRestored = false;
    clearKontrollDraft();
    console.log('[submitKontroll] FERDIG — alt lagret uten feil for kontroll', id);
    alert('Kontroll registrert for ' + vehicleLabel(v) + '.');
    if(driverMode){
      // Sjåføren har ikke tilgang til Bilkort — bli værende på skjemaet, tomt og klart
      // for neste bil/sjåfør som skal registrere en kontroll på samme enhet.
      render();
    } else {
      goTo('bilkort', vehicleId);
    }
  }catch(err){
    // Skjer normalt kun ved svært spesielle forhold (f.eks. lagringsplassen på enheten
    // er full). Gir en tydelig, synlig feilmelding i skjemaet i stedet for at
    // innsendingen stille forsvinner uten at sjåføren vet det.
    console.error('[submitKontroll] LAGRING FEILET', err);
    if(submitBtn) submitBtn.disabled = false;
    msgEl.innerHTML = '⚠️ Kunne ikke lagre kontrollen på denne enheten (' + esc(err && err.message ? err.message : 'ukjent feil') + '). Sjekk at enheten har ledig lagringsplass, og prøv igjen. Ta skjermbilde av denne meldingen og kontakt administrator dersom problemet gjentar seg.';
  }
}
// Forhåndsutfyller «Annet»-feltet dersom bilen allerede har en aktiv «Annet»-varsellys,
// slik at sjåføren ser hva som ble skrevet forrige gang. Kalles når bil velges i skjemaet.
function syncKontrollAnnetFromActive(vehicleId){
  const entry = varsellys.find(w => w.vehicleId === vehicleId && w.type === 'annet' && w.status === 'aktiv');
  if(entry){ kontrollFormAnnet = true; kontrollFormAnnetTekst = entry.annetTekst || kontrollFormAnnetTekst; }

async function kvitterVarsellys(id){

  const v = vehicles.find(x => x.id === w.vehicleId);
  if(!confirm('Kvittere ut «' + varsellysLabel(w) + '» på ' + (v ? vehicleLabel(v) : 'kjøretøyet') + '? Den vil ikke lenger vises som aktiv, og fjernes fra sjåførskjemaet.')) return;

// ================= Sjåførkontroll historikk: sletting (kun administrator) =================
async function deleteKontrollPhotos(k){
  for(let i = 0; i < (k.skadeBilderCount || 0); i++){
    await deletePhoto('kontroll:'+k.id+':'+i);
  }
}

// Full tilbakeføring av én eller flere slettede kontroller: fjerner varsellamper som
// ikke lenger støttes av noen gjenværende kontroll på bilen, regner kilometerstand på
// nytt fra siste gjenværende kontroll, og rydder opp automatisk opprettede skader
// (kun dersom de fortsatt står urørt siden kontrollen opprettet dem).
async function performKontrollDeletion(toDelete){
  const affectedVehicleIds = [...new Set(toDelete.map(k => k.vehicleId))];
  const deletedIds = new Set(toDelete.map(k => k.id));

  kontroller = kontroller.filter(k => !deletedIds.has(k.id));
  await saveKontroller();

  for(const k of toDelete) await deleteKontrollPhotos(k);

  // Skader opprettet automatisk av kontrollen: slettes kun hvis de fortsatt har
  // uendret status/alvorlighetsgrad (dvs. ingen administrator har rukket å behandle
  // saken). Er den endret, beholdes skaden som en vanlig, uavhengig skaderegistrering.
  let damagesChanged = false;
  for(const k of toDelete){
    if(!k.linkedDamageId) continue;
    const d = damages.find(x => x.id === k.linkedDamageId);
    if(!d) continue;
    // Eldre skader (fra før createdByControlId fantes) har ikke referansen satt —
    // faller da tilbake til den opprinnelige koblingen via kontrollens linkedDamageId.
    const opprettetAvDenneKontrollen = d.createdByControlId !== undefined ? d.createdByControlId === k.id : true;
    if(!opprettetAvDenneKontrollen) continue;
    const uendretSidenOpprettelse = d.status === 'registrert' && d.alvorlighet === 'middels';
    if(uendretSidenOpprettelse){
      damages = damages.filter(x => x.id !== d.id);
      if(d.hasPhoto) await deletePhoto('damage:'+d.id);
      damagesChanged = true;
    }
  }
  if(damagesChanged) await saveDamages();

  // Varsellamper og kilometerstand rekalkuleres per berørt bil ut fra hvilke
  // kontroller som faktisk er igjen — ikke bare den ene som ble slettet.
  let varsellysChanged = false;
  for(const vehicleId of affectedVehicleIds){
    const remaining = vehicleKontroller(vehicleId); // nyeste først

    const fortsattStøttet = new Set();
    remaining.forEach(k => (k.varsellamper || []).forEach(type => fortsattStøttet.add(type)));
    const before = varsellys.length;
    varsellys = varsellys.filter(w => {
      if(w.vehicleId !== vehicleId || w.status !== 'aktiv') return true; // rør ikke andre biler eller allerede kvitterte
      // Bruker den eksplisitte referansen til å avgjøre om denne saken i det hele tatt
      // stammer fra en av de slettede kontrollene (eldre saker uten referanse-felt
      // vurderes uansett, for bakoverkompatibilitet med data fra før feltet fantes).
      const opprettetAvSlettet = w.createdByControlId ? deletedIds.has(w.createdByControlId) : true;
      if(!opprettetAvSlettet) return true;
      return fortsattStøttet.has(w.type); // fjern kun hvis ingen gjenværende kontroll lenger melder den
    });
    if(varsellys.length !== before) varsellysChanged = true;

    const v = vehicles.find(x => x.id === vehicleId);
    if(v && remaining.length > 0){
      v.km = remaining[0].km; // km fra siste gjenværende kontroll på bilen
    }
  }
  if(varsellysChanged) await saveVarsellys();
  await saveVehicles();
}

async function deleteKontroll(id){
  if(!isAdmin) return;
  const k = kontroller.find(x => x.id === id);
  if(!k) return;
  const harTilknyttetSkade = !!k.linkedDamageId && damages.some(d => d.id === k.linkedDamageId);
  const harTilknyttetVarsel = varsellys.some(w => w.createdByControlId === k.id && w.status === 'aktiv');
  const msg = (harTilknyttetSkade || harTilknyttetVarsel)
    ? 'Denne kontrollen har opprettet varsler og/eller skader. Dersom du fortsetter vil også tilknyttede registreringer bli slettet. Ønsker du å fortsette?'
    : 'Er du sikker på at du vil slette denne kontrollen?';
  if(!confirm(msg)) return;
  await performKontrollDeletion([k]);
  kthSelectedIds.delete(id);
  render();
}
async function deleteSelectedKontroller(){
  if(!isAdmin || kthSelectedIds.size === 0) return;
  const antall = kthSelectedIds.size;
  const valgte = kontroller.filter(k => kthSelectedIds.has(k.id));
  const harTilknyttetData = valgte.some(k =>
    (!!k.linkedDamageId && damages.some(d => d.id === k.linkedDamageId)) ||
    varsellys.some(w => w.createdByControlId === k.id && w.status === 'aktiv')
  );
  const msg = harTilknyttetData
    ? 'Én eller flere av de ' + antall + ' valgte kontrollene har opprettet varsler og/eller skader. Dersom du fortsetter vil også tilknyttede registreringer bli slettet. Ønsker du å fortsette?'
    : 'Er du sikker på at du vil slette ' + antall + ' valgte kontroll' + (antall === 1 ? '' : 'er') + '?';
  if(!confirm(msg)) return;
  const toDelete = kontroller.filter(k => kthSelectedIds.has(k.id));
  await performKontrollDeletion(toDelete);
  kthSelectedIds.clear();
  render();
}

// ================= Render dispatch =================
function render(){
  if(!loaded){ app.innerHTML = 'Laster inn...'; return; }
  if(driverMode){ renderDriverShell(); return; }
  if(!loggedInRole && screen !== 'login'){ screen = 'login'; }
  if(screen === 'login'){ renderLoginShell(); return; }
  let body = '';
  if(screen === 'dashboard') body = renderDashboard();
  else if(screen === 'register') body = renderRegister();
  else if(screen === 'bilkort') body = renderBilkort();
  else if(screen === 'skader') body = renderSkader();
  else if(screen === 'verksted') body = renderVerksted();
  else if(screen === 'innstillinger') body = renderInnstillinger();
  else if(screen === 'kontroll') body = renderKontroll();
  else if(screen === 'kontrollhistorikk') body = renderKontrollHistorikk();
  else if(screen === 'varsler') body = renderVarslerOversikt();

  const mainScreens = ['dashboard','register','skader','verksted','innstillinger','kontrollhistorikk'];
  const menuActive = screen === 'register' || screen === 'innstillinger';
  app.innerHTML = `
    <div class="shell-top">
      ${brandBlockHtml()}
      <div class="shell-top-right">
        <button class="btn small header-action-btn ${screen==='kontroll'?'active':''}" id="header-kontroll-btn"><span class="btn-label-full">✅ Registrer kontroll</span><span class="btn-label-short">✅ Kontroll</span></button>
        <button class="btn small header-action-btn ${screen==='verksted'?'active':''}" id="header-vt-btn"><span class="btn-label-full">🔧 Registrer verkstedtime</span><span class="btn-label-short">🔧 Verksted</span></button>
        <div class="menu-wrap">
          <button class="btn secondary small header-link ${menuActive ? 'active' : ''}" id="header-menu-btn" aria-haspopup="true" aria-expanded="${headerMenuOpen}">
            ☰ Meny
          </button>
        </div>
      </div>
    </div>
    ${mainScreens.includes(screen) ? `
    <div class="navtabs">
      <button class="navtab ${screen==='dashboard'?'active':''}" data-nav="dashboard">Dashboard</button>
      <button class="navtab ${screen==='verksted'?'active':''}" data-nav="verksted">Verkstedtimer</button>
      <button class="navtab ${screen==='skader'?'active':''}" data-nav="skader">Skader</button>
      <button class="navtab ${screen==='kontrollhistorikk'?'active':''}" data-nav="kontrollhistorikk">Sjåførkontroll historikk</button>
    </div>` : ''}
    ${body}
  `;

  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => goTo(el.dataset.nav)));
  document.getElementById('header-kontroll-btn').addEventListener('click', () => goToRegisterKontroll(''));
  document.getElementById('header-vt-btn').addEventListener('click', () => goToRegisterVT(''));
  document.getElementById('header-menu-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleHeaderMenu(); });

  renderDrawer();

  if(screen === 'dashboard') attachDashboardListeners();
  else if(screen === 'register') attachRegisterListeners();
  else if(screen === 'bilkort') attachBilkortListeners();
  else if(screen === 'skader') attachSkaderListeners();
  else if(screen === 'verksted') attachVerkstedListeners();
  else if(screen === 'innstillinger') attachInnstillingerListeners();
  else if(screen === 'kontroll') attachKontrollListeners();
  else if(screen === 'kontrollhistorikk') attachKontrollHistorikkListeners();
  else if(screen === 'varsler') attachVarslerOversiktListeners();
}

// ================= Mobilmeny (drawer) =================
// Bygd som ett samlet menypunkt for ALT av navigasjon (ikke bare Bilregister/
// Innstillinger som tidligere), siden appen hovedsakelig brukes på mobil og
// fanerekken øverst (.navtabs) er for trang til å være god nok alene der.
// Drawer-elementet ligger utenfor #app (se index.html), så selve glidningen
// (CSS-transition på .drawer/.drawer-overlay) ikke avbrytes av at render()
// bygger om resten av siden hver gang.
function drawerItemHtml(scr, icon, label){
  const active = screen === scr;
  return `
    <button class="drawer-item ${active ? 'active' : ''}" data-drawer-nav="${scr}">
      <span class="drawer-icon">${icon}</span><span>${label}</span>
      ${active ? '<span class="drawer-dot" aria-hidden="true"></span>' : ''}
    </button>`;
}
function renderDrawer(){
  const drawerEl = document.getElementById('app-drawer');
  if(!drawerEl) return;
  drawerEl.innerHTML = `
    <div class="drawer-header">
      <span class="drawer-title">Meny</span>
      <button class="drawer-close" id="drawer-close-btn" aria-label="Lukk meny">✕</button>
    </div>
    <div class="drawer-user">Innlogget: ${esc(loggedInRole || '')}</div>
    <div class="drawer-nav">
      ${drawerItemHtml('dashboard', '🏠', 'Dashboard')}
      ${drawerItemHtml('verksted', '🔧', 'Verkstedtimer')}
      ${drawerItemHtml('skader', '⚠️', 'Skader')}
      ${drawerItemHtml('kontrollhistorikk', '📋', 'Kontrollhistorikk')}
    </div>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label">Administrasjon</div>
    <div class="drawer-nav">
      ${drawerItemHtml('register', '🚐', 'Bilregister')}
      ${drawerItemHtml('innstillinger', '⚙️', 'Innstillinger')}
    </div>
    <div class="drawer-footer">
      <button class="drawer-item" id="drawer-logout-btn"><span class="drawer-icon">🚪</span><span>Logg ut</span></button>
    </div>
  `;
  drawerEl.classList.toggle('open', headerMenuOpen);
  const overlayEl = document.getElementById('drawer-overlay');
  if(overlayEl) overlayEl.classList.toggle('open', headerMenuOpen);
  document.body.style.overflow = headerMenuOpen ? 'hidden' : '';

  drawerEl.querySelectorAll('[data-drawer-nav]').forEach(el => el.addEventListener('click', () => {
    closeDrawer();
    goTo(el.dataset.drawerNav);
  }));
  document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
  document.getElementById('drawer-logout-btn').addEventListener('click', () => { closeDrawer(); logout(); });
}
function openDrawer(){
  headerMenuOpen = true;
  const drawerEl = document.getElementById('app-drawer');
  const overlayEl = document.getElementById('drawer-overlay');
  if(drawerEl) drawerEl.classList.add('open');
  if(overlayEl) overlayEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  const btn = document.getElementById('header-menu-btn');
  if(btn) btn.setAttribute('aria-expanded', 'true');
}
function closeDrawer(){
  headerMenuOpen = false;
  const drawerEl = document.getElementById('app-drawer');
  const overlayEl = document.getElementById('drawer-overlay');
  if(drawerEl) drawerEl.classList.remove('open');
  if(overlayEl) overlayEl.classList.remove('open');
  document.body.style.overflow = '';
  const btn = document.getElementById('header-menu-btn');
  if(btn) btn.setAttribute('aria-expanded', 'false');
}
function toggleHeaderMenu(){
  if(headerMenuOpen) closeDrawer(); else openDrawer();
}

// ================= scrDashboard =================
function vehicleReasons(v){
  const reasons = [];
  if(v.status === 'oppfolging') reasons.push('Trenger oppfølging');
  if(v.status === 'verksted') reasons.push('På verksted');
  return reasons;
}
function isFlagged(v){
  const openCount = damages.filter(d => d.vehicleId === v.id && skadeIsOpen(d)).length;
  return vehicleReasons(v).length > 0 || openCount > 0;
}

function renderDashboard(){
  const totalVehicles = vehicles.length;
  const vehiclesWithDamages = new Set(damages.map(d => d.vehicleId)).size;
  const openSkadesaker = damages.filter(skadeIsOpen).length;

  const today = todayISO();
  const upcomingVT = verkstedtimer.filter(t => t.dato >= today).sort((a,b) => (a.dato+((a.tidspunkt)||'')).localeCompare(b.dato+((b.tidspunkt)||'')));
  const nearestVT = upcomingVT[0] || null;
  const nearestWithin7 = nearestVT ? vtWithinWeek(nearestVT.dato) : false;

  const aktiveVarsler = allActiveVarsellys();
  const kontrollertIdagCount = vehicles.filter(v => isKontrollertIdag(v.id)).length;
  const manglerKontrollCount = totalVehicles - kontrollertIdagCount;
  const nyeSkaderIdag = damages.filter(d => d.dato === today).length;

  const groups = {};
  KATEGORI_ORDER.forEach(k => groups[k] = []);
  sortedVehicles(vehicles).forEach(v => { if(groups[v.kategori]) groups[v.kategori].push(v); });
  KATEGORI_ORDER.forEach(k => {
    // Dashboard fremhever biler som krever oppfølging øverst i hver gruppe — bygger
    // videre på den delte, kanoniske rekkefølgen fra sortedVehicles() over.
    groups[k].sort((a, b) => (isFlagged(b) ? 1 : 0) - (isFlagged(a) ? 1 : 0));
  });

  const g = greetingInfo();
  const displayNavn = loggedInRole || '';
  const loggedInUser = adminUsers.find(u => u.rolle === loggedInRole);
  const displayTittel = loggedInUser && loggedInUser.tittel ? loggedInUser.tittel : '';

  return `
    <div class="greeting-card ${g.klasse}">
      <div class="greeting-grid">
        <div class="greeting-left">
          <div class="greeting-title">${g.hilsen}, ${esc(displayNavn)} ${g.ikon}</div>
          ${displayTittel ? `<div class="greeting-role">${esc(displayTittel)}</div>` : ''}
          <div class="greeting-sub">${g.sub}</div>
          <div class="greeting-datetime">${fmtDateTime(todayISO(), nowTimeOslo())}</div>
          ${weatherData ? `<div class="greeting-weather">${weatherData.ikon} ${weatherData.temp}°C i Larvik · ${esc(weatherData.tekst)}</div>` : ''}
        </div>
        <div class="greeting-right">
          <span class="status-chip" data-stat-nav="kontrollert-idag">✅ ${kontrollertIdagCount} kontrollert i dag</span>
          <span class="status-chip" data-stat-nav="kommende-vt">🔧 ${nearestVT ? fmtShort(nearestVT.dato) + ' verksted' : 'Ingen verksted'}</span>
          <span class="status-chip" data-stat-nav="aktive-varsler">${aktiveVarsler.length > 0 ? `🚨 ${aktiveVarsler.length} aktive varsler` : '✅ Ingen aktive varsler'}</span>
        </div>
      </div>
    </div>
    <div class="dash-row-2">
      <div class="stat-grid">
        <div class="stat-card" data-stat-nav="alle-biler"><div class="stat-num">${totalVehicles}</div><div class="stat-label">Totalt antall biler</div></div>
        <div class="stat-card accent-red" data-stat-nav="skade-biler"><div class="stat-num">${vehiclesWithDamages}</div><div class="stat-label">Biler med registrerte skader</div></div>
        <div class="stat-card accent-blue" data-stat-nav="kommende-vt"><div class="stat-num">${upcomingVT.length}</div><div class="stat-label">Kommende verkstedtimer</div></div>
        <div class="stat-card accent-amber" data-stat-nav="apne-skader"><div class="stat-num">${openSkadesaker}</div><div class="stat-label">Åpne skadesaker</div></div>
      </div>
      <div class="panel" style="margin-bottom:0;">
        <h3 style="margin-bottom:14px;">Sjåførkontroll</h3>
        <div class="ov-grid">
          <div class="ov-item ov-item-clickable" data-stat-nav="kontrollert-idag"><span class="ov-label">Kontrollert i dag</span><span class="ov-value" style="font-size:20px;color:var(--green);">✅ ${kontrollertIdagCount}</span></div>
          <div class="ov-item ov-item-clickable" data-stat-nav="mangler-kontroll"><span class="ov-label">Mangler kontroll i dag</span><span class="ov-value" style="font-size:20px;color:${manglerKontrollCount>0?'var(--amber)':'var(--ink)'};">⚠️ ${manglerKontrollCount}</span></div>

        </div>
      </div>
    </div>
    ${totalVehicles === 0 ? `<div class="empty-note">Ingen kjøretøy registrert ennå. Gå til Bilregister for å legge til den første bilen.</div>` : `
    <div class="dash-group-grid">
      ${KATEGORI_ORDER.filter(k => groups[k].length > 0).map(k => {
        const open = !!dashGroupOpen[k];
        const gruppeVehicleIds = new Set(groups[k].map(v => v.id));
        const gruppeVarsler = aktiveVarsler.filter(w => gruppeVehicleIds.has(w.vehicleId)).length;

          <div class="group-card-head" data-toggle-group="${k}">

              <div class="group-card-sub">${groups[k].length} ${groups[k].length===1?'bil':'biler'}${gruppeVarsler>0 ? ` · 🚨 ${gruppeVarsler}` : ''}</div>
            </div>
            <span class="chevron ${open?'open':''}">⌄</span>
          </div>
          <div class="vehicle-group-body ${open?'open':''}">
            <div>
              <div class="acc-list" style="margin-top:12px;">
                ${groups[k].map(v => accordionRow(v)).join('')}

  `;

  const vAktiveVarsler = activeVarsellysForVehicle(v.id);

            ${vVT.map(t => `<li><span class="dmg-simple-main">${fmt(t.dato)} – ${esc(t.beskrivelse)}</span><span class="badge ${t.dato >= todayISO() ? 'soon' : 'unset'}">${t.dato >= todayISO() ? 'Kommende' : 'Gjennomført'}</span></li>`).join('')}

function attachDashboardListeners(){

    dashExpandedId = dashExpandedId === el.dataset.toggle ? null : el.dataset.toggle;
    render();
  }));
  document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    goTo('bilkort', el.dataset.edit);

  document.querySelectorAll('[data-kontroll]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    goToRegisterKontroll(el.dataset.kontroll);
  }));
  document.querySelectorAll('[data-vt]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    goToRegisterVT(el.dataset.vt);
  }));
  document.querySelectorAll('[data-stat-nav]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const today = todayISO();
    switch(el.dataset.statNav){
      case 'alle-biler': goToRegisterFiltered(''); break;
      case 'skade-biler': goToSkaderFiltered({}); break;

      case 'aktive-varsler': goTo('varsler'); break;
      case 'nye-skader-idag': goToSkaderFiltered({dato:today}); break;
    }
  }));
}

// Kanonisk, felles sortering for kjøretøy — speiler nøyaktig samme gruppering og
// rekkefølge som Dashboardet (Bil 1–11, deretter Lastebiler, deretter Monteringsbiler,
// sortert på bilnummer innad i hver gruppe — aldri alfabetisk, aldri på regnr).
// ALLE bil-dropdowns i appen henter rekkefølgen sin herfra via vehicleOptions() under,
// slik at Dashboard, Bilregister, Verkstedtimer, Skader og Sjåførkontroll alltid stemmer
// overens — endres denne ene funksjonen, oppdateres alle dropdowns automatisk.
function sortedVehicles(list){
  return (list || vehicles).slice().sort((a, b) => {
    const catA = KATEGORI_ORDER.indexOf(a.kategori);
    const catB = KATEGORI_ORDER.indexOf(b.kategori);
    if(catA !== catB) return catA - catB;
    return ruteNumber(a) - ruteNumber(b);
  });
}
function vehicleOptions(selectedId){
  const sorted = sortedVehicles(vehicles);
  return KATEGORI_ORDER.map(kat => {
    const gruppe = sorted.filter(v => v.kategori === kat);
    if(gruppe.length === 0) return '';
    const options = gruppe.map(v => `<option value="${v.id}" ${v.id===selectedId?'selected':''}>${esc(vehicleLabel(v))} — ${esc(v.merke)} ${esc(v.modell)}</option>`).join('');
    return `<optgroup label="${esc(KATEGORI_GROUP_LABEL[kat])}">${options}</optgroup>`;
  }).join('');
}

function renderKontrollHistorikk(){
  const q = kthSearch.trim().toLowerCase();
  const distinktSjafor = [...new Set(kontroller.map(k => k.sjafor).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'nb'));

  const filtered = kontroller.filter(k => {
    const v = vehicles.find(x => x.id === k.vehicleId);
    if(kthFilterBil && k.vehicleId !== kthFilterBil) return false;
    if(kthFilterDato && k.dato !== kthFilterDato) return false;
    if(kthFilterVarsellampe && !(k.varsellamper || []).includes(kthFilterVarsellampe)) return false;
    if(kthFilterSkade === 'ja' && !k.harNyeSkader) return false;
    if(kthFilterSkade === 'nei' && k.harNyeSkader) return false;
    if(kthFilterSjafor && k.sjafor !== kthFilterSjafor) return false;
    if(q){
      const matchRegnr = v && v.regnr && v.regnr.toLowerCase().includes(q);
      const matchBilnummer = v && v.bilnummer && v.bilnummer.toLowerCase().includes(q);
      if(!matchRegnr && !matchBilnummer) return false;
    }
    return true;
  }).sort((a,b) => (b.dato+((b.tidspunkt)||'')).localeCompare(a.dato+((a.tidspunkt)||'')));

  return `
    <h2 style="font-size:19px;margin-bottom:6px;">Sjåførkontroll – historikk</h2>

      </select>
      <select id="kth-f-skade">
        <option value="" ${kthFilterSkade===''?'selected':''}>Skade: alle</option>
        <option value="ja" ${kthFilterSkade==='ja'?'selected':''}>Skade registrert</option>
        <option value="nei" ${kthFilterSkade==='nei'?'selected':''}>Ingen skade</option>

    </div>

    ${isAdmin && kthSelectedIds.size > 0 ? `
    <div class="toolbar">
      <div class="count">${kthSelectedIds.size} valgt${kthSelectedIds.size === 1 ? '' : 'e'}</div>

function renderVarslerOversikt(){
  const alle = allActiveVarsellys();
  const byVehicle = new Map();
  alle.forEach(w => {
    if(!byVehicle.has(w.vehicleId)) byVehicle.set(w.vehicleId, []);
    byVehicle.get(w.vehicleId).push(w);
  });
  const beroerteKjoretoy = sortedVehicles(vehicles.filter(v => byVehicle.has(v.id)));
  // Varsellamper kan i sjeldne tilfeller peke på en bil som senere er slettet fra
  // registeret (bilsletting rydder ikke varsellys) — disse vises samlet til slutt
  // i stedet for å forsvinne stille fra oversikten.
  const kjentIder = new Set(vehicles.map(v => v.id));
  const foreldreloseVarsler = alle.filter(w => !kjentIder.has(w.vehicleId));

  return `
    <div class="backrow"><button class="backbtn" id="varsler-back">← Dashboard</button></div>
    <h2 style="font-size:19px;margin-bottom:6px;">Aktive varsellamper</h2>
    <div class="required-hint" style="margin-bottom:16px;">${alle.length} aktiv${alle.length===1?'':'e'} varsellampe${alle.length===1?'':'r'} totalt, fordelt på ${beroerteKjoretoy.length} kjøretøy.</div>
    ${alle.length === 0 ? `<div class="empty-note">🟢 Ingen aktive varsellamper.</div>` : KATEGORI_ORDER.filter(k => beroerteKjoretoy.some(v => v.kategori === k)).map(k => {

function attachBilkortListeners(){

  if(skadeBtn) skadeBtn.addEventListener('click', () => goToRegisterSkade(currentVehicleId));

  if(vtBtn) vtBtn.addEventListener('click', () => goToRegisterVT(currentVehicleId));
  document.querySelectorAll('[data-kvitter]').forEach(el => el.addEventListener('click', () => kvitterVarsellys(el.dataset.kvitter)));
  document.querySelectorAll('[data-goto-vt]').forEach(el => el.addEventListener('click', () => {
    vtFilterBil = el.dataset.gotoVt;
    goTo('verksted');
  }));

  const vp = document.getElementById('f-vehicle-photo');
  if(vp) vp.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    pendingVehiclePhoto = await resizeImage(file);
    let img = document.getElementById('vehicle-photo-preview');
    if(!img){
      img = document.createElement('img');
      img.id = 'vehicle-photo-preview';
      img.className = 'photo-preview';
      vp.parentElement.appendChild(img);
    }
    img.src = pendingVehiclePhoto; img.style.display = 'block';
  });
  if(v && v.hasPhoto){
    getPhoto('vehicle:'+v.id).then(url => {
      const img = document.getElementById('vehicle-photo-preview');
      if(img && url){ img.src = url; img.style.display = 'block'; }
    });
  }

  attachDamageCardListeners(vehicleDamages(currentVehicleId));
}

  if(f) f.addEventListener('submit', submitAddSkade);

    pendingPhotoData = await resizeImage(file);

    img.src = pendingPhotoData; img.style.display = 'block';

// ================= "Oppdater app" (hard refresh, tilsvarende Ctrl+F5) =================
// Rører KUN service worker-registreringen og PWA-app-shell-cachen (sw.js/CACHE_VERSION) —
// selve dataene (bilregister, skader, verkstedtimer, sjåførkontroller, varsellamper) ligger
// utelukkende i Airtable og påvirkes ikke i det hele tatt av dette. Nyttig fordi mobile
// nettlesere ikke har noen Ctrl+F5-snarvei, og installerte PWA-er kan sitte fast på en gammel,
// cachet versjon av index.html/storage.airtable.js selv etter at nye filer er lastet opp.
async function hardRefreshApp(){
  if(!confirm('Appen vil oppdatere og laste inn nyeste versjon. Fortsette?')) return;
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){ await reg.unregister(); }
      console.log('[hardRefreshApp] Service worker(e) avregistrert:', regs.length);
    }
    if('caches' in window){
      const keys = await caches.keys();
      for(const k of keys){ await caches.delete(k); }
      console.log('[hardRefreshApp] Cache(r) tømt:', keys);
    }
  }catch(e){
    console.error('[hardRefreshApp] Klarte ikke tømme service worker/cache fullstendig', e);
    // Fortsetter uansett — selve omlastingen under tvinger frem ferske filer fra nettverket.
  }
  // Cache-busting query-parameter tvinger nettleseren til å hente index.html (og alt annet)
  // helt på nytt fra nettverket, i stedet for en eventuell mellomlagret HTTP-cache-kopi —
  // location.reload() alene er ikke pålitelig nok til dette på tvers av mobile nettlesere.
  const url = new URL(window.location.href);
  url.searchParams.set('_refresh', Date.now().toString());
  window.location.replace(url.toString());
}

        <div class="chip-grid">
          ${VARSELLAMPE_ORDER.map(key => {
            const isActive = activeTypes.has(key);
            const isChecked = isActive || kontrollFormVarsellamper.includes(key) || (key==='annet' && kontrollFormAnnet);
            return `
            <label class="chip ${isChecked ? 'checked' : ''} ${isActive ? 'chip-active-lamp' : ''}" for="kt-varsel-${key}">
              <input type="checkbox" id="kt-varsel-${key}" ${isChecked ? 'checked':''} ${isActive ? 'disabled':''}>
              <span class="chip-icon">${VARSELLAMPE_ICON[key]}</span>
              <span class="chip-text">${VARSELLAMPE_LABEL[key]}${isActive ? ' <span style="font-weight:400;opacity:.75;">— 🚨 aktiv</span>' : ''}</span>
            </label>
          `;}).join('')}
        </div>
        ${kontrollFormAnnet ? `
        <div class="field" style="margin-top:10px;">
          <label>Beskriv «Annet»</label>
          <input id="kt-annet-tekst" type="text" placeholder="Beskriv varselet" value="${esc(kontrollFormAnnetTekst)}" ${activeTypes.has('annet') ? 'disabled' : ''}>
        </div>` : ''}
      </div>

      <div class="field" style="margin-bottom:18px;">
        <label>Har du oppdaget nye skader?</label>
        <div class="chip-yn">
          <label for="kt-skade-ja" class="${kontrollFormHarSkader ? 'checked' : ''}"><input type="radio" name="kt-skade" id="kt-skade-ja" ${kontrollFormHarSkader?'checked':''}> Ja</label>
          <label for="kt-skade-nei" class="${!kontrollFormHarSkader ? 'checked' : ''}"><input type="radio" name="kt-skade" id="kt-skade-nei" ${!kontrollFormHarSkader?'checked':''}> Nei</label>
        </div>
        ${kontrollFormHarSkader ? `
        <div class="field" style="margin-top:12px;">
          <label>Beskrivelse av skade</label>
          <textarea id="kt-skade-beskrivelse" placeholder="Hva har skjedd, og hvor på bilen?">${esc(kontrollFormSkadeBeskrivelse)}</textarea>
        </div>
        <div class="field" style="margin-top:10px;">
          <label>Bilder</label>
          <div class="photo-input-area">
            <input type="file" accept="image/*" multiple id="kt-skade-foto">
            <div class="required-hint">Du kan velge flere bilder samtidig.</div>
            ${pendingKontrollPhotos.length > 0 ? `<div class="kt-photo-grid">${pendingKontrollPhotos.map((p,i) => `
              <div class="kt-photo-thumb"><img src="${p}"><button type="button" data-remove-photo="${i}">×</button></div>
            `).join('')}</div>` : ''}
          </div>
        </div>` : ''}
      </div>

      <div class="field" style="margin-bottom:6px;">
        <label>Kommentar fra sjåfør</label>
        <textarea id="kt-kommentar" placeholder="Valgfritt">${esc(kontrollFormKommentar)}</textarea>
      </div>

      <div class="form-msg" id="kt-msg"></div>
      <div class="panel-actions"><button class="btn" id="kt-submit-btn" type="submit">Send inn kontroll</button></div>
    </form>
  `;
}
function attachKontrollListeners(){
  const backBtn = document.getElementById('kt-back');
  if(backBtn) backBtn.addEventListener('click', () => {
    if(kontrollPrefillVehicleId) goTo('bilkort', kontrollPrefillVehicleId);
    else goTo('dashboard');
  });
  document.getElementById('kontroll-form').addEventListener('submit', submitKontroll);

  document.getElementById('kt-vehicle').addEventListener('change', e => {
    kontrollFormKm = (document.getElementById('kt-km')||{}).value || kontrollFormKm;
    kontrollFormVehicleId = e.target.value;
    kontrollFormAnnet = false;
    kontrollFormAnnetTekst = '';
    if(kontrollFormVehicleId) syncKontrollAnnetFromActive(kontrollFormVehicleId);
    saveKontrollDraft();
    render();
  });
  const kmInput = document.getElementById('kt-km');
  if(kmInput) kmInput.addEventListener('input', e => { kontrollFormKm = e.target.value; saveKontrollDraft(); });
  const sjaforInput = document.getElementById('kt-sjafornavn');
  if(sjaforInput) sjaforInput.addEventListener('input', e => { kontrollFormSjaforNavn = e.target.value; saveKontrollDraft(); });
  const kommentarInput = document.getElementById('kt-kommentar');
  if(kommentarInput) kommentarInput.addEventListener('input', e => { kontrollFormKommentar = e.target.value; saveKontrollDraft(); });
  const annetTekstInput = document.getElementById('kt-annet-tekst');
  if(annetTekstInput) annetTekstInput.addEventListener('input', e => { kontrollFormAnnetTekst = e.target.value; saveKontrollDraft(); });
  const skadeBeskrivelseInput = document.getElementById('kt-skade-beskrivelse');
  if(skadeBeskrivelseInput) skadeBeskrivelseInput.addEventListener('input', e => { kontrollFormSkadeBeskrivelse = e.target.value; saveKontrollDraft(); });

  const annetBox = document.getElementById('kt-varsel-annet');
  if(annetBox) annetBox.addEventListener('change', () => {
    annetBox.closest('.chip').classList.toggle('checked', annetBox.checked);
    kontrollFormAnnet = annetBox.checked;
    saveKontrollDraft();
    render();
  });
  VARSELLAMPE_ORDER.filter(k => k !== 'annet').forEach(key => {
    const box = document.getElementById('kt-varsel-'+key);
    if(box) box.addEventListener('change', () => {
      box.closest('.chip').classList.toggle('checked', box.checked);
      kontrollFormVarsellamper = kontrollFormVarsellamper.filter(k => k !== key);
      if(box.checked) kontrollFormVarsellamper.push(key);
      saveKontrollDraft();
    });
  });

  const jaRadio = document.getElementById('kt-skade-ja');
  const neiRadio = document.getElementById('kt-skade-nei');
  if(jaRadio) jaRadio.addEventListener('change', () => { kontrollFormHarSkader = true; saveKontrollDraft(); render(); });
  if(neiRadio) neiRadio.addEventListener('change', () => { kontrollFormHarSkader = false; saveKontrollDraft(); render(); });

  const fotoInput = document.getElementById('kt-skade-foto');
  if(fotoInput) fotoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await resizeImage(file);
      pendingKontrollPhotos.push(dataUrl);
    }
    render();
  });
  document.querySelectorAll('[data-remove-photo]').forEach(btn => btn.addEventListener('click', (e) => {
    e.preventDefault();
    pendingKontrollPhotos.splice(Number(btn.dataset.removePhoto), 1);
    render();
  }));
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && headerMenuOpen) closeDrawer();
});
const drawerOverlayEl = document.getElementById('drawer-overlay');
if(drawerOverlayEl) drawerOverlayEl.addEventListener('click', closeDrawer);

detectDriverMode();
if(driverMode){ screen = 'kontroll'; kontrollDraftRestored = loadKontrollDraft(); }
// Sørger for at "Installer app" mens man står i sjåførmodus installerer en snarvei
// som alltid åpner rett i kontrollskjemaet — se manifest-sjafor.json. Uten dette
// ville en installert snarvei brukt admin-manifestets start_url (index.html uten
// parameter) og sendt sjåføren til innloggingssiden neste gang ikonet trykkes.
if(driverMode){
  const manifestLink = document.querySelector('link[rel="manifest"]');
  if(manifestLink) manifestLink.setAttribute('href', 'manifest-sjafor.json');
}
loadAll();
if(!driverMode) fetchWeather();

// ================= PWA: installasjon og offline-støtte =================
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('Kunne ikke registrere service worker', e));
  });
}
let deferredInstallPrompt = null;
const installBar = document.getElementById('pwa-install-bar');
const installBtn = document.getElementById('pwa-install-btn');
const installDismiss = document.getElementById('pwa-install-dismiss');
let pwaInstallBarDismissed = false; // erstatter sessionStorage — nullstilles ved sideoppdatering, som er greit for en "ikke vis igjen nå"-linje
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone() && !pwaInstallBarDismissed) {
    installBar.style.display = 'flex';
  }
});
if (installBtn) installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBar.style.display = 'none';
});
if (installDismiss) installDismiss.addEventListener('click', () => {
  installBar.style.display = 'none';
  pwaInstallBarDismissed = true;
});
window.addEventListener('appinstalled', () => {
  installBar.style.display = 'none';
  deferredInstallPrompt = null;
});
const iosHint = document.getElementById('pwa-ios-hint');
const iosDismiss = document.getElementById('pwa-ios-dismiss');
let pwaIosHintDismissed = false; // erstatter sessionStorage, se pwaInstallBarDismissed over
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
if (isIOS() && !isStandalone() && !pwaIosHintDismissed) {
  iosHint.style.display = 'flex';
}
if (iosDismiss) iosDismiss.addEventListener('click', () => {
  iosHint.style.display = 'none';
  pwaIosHintDismissed = true;
});
</script>

</body>
</html>
