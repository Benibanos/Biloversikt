<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilpark</title>

<meta name="theme-color" content="#1C2024">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilpark">

<!-- Airtable — sentral database. Se AIRTABLE_MIGRATION.md for full forklaring
     og oppsett, inkludert et viktig sikkerhetsforbehold om at API-tokenet i
     airtable-config.js er synlig for alle som besøker siden. -->
<script src="airtable-config.js"></script>
<script src="storage.airtable.js"></script>
<!-- SheetJS — brukes til Excel-eksport av Kostnadsoversikt (se exportKostnadExcel()). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#EEF0F0;
    --surface:#FFFFFF;
    --ink:#1C2024;
    --muted:#5B6470;
    --line:#DCE0E2;
    --red:#E30613;
    --red-soft:#FDE8E9;
    --amber:#B4720A;
    --amber-soft:#FBEEDC;
    --green:#1F8A57;
    --green-soft:#E7F4EC;
    --orange:#C2540A;
    --orange-soft:#FBE7DA;
    --blue:#003399;
    --blue-soft:#E7ECFA;
    --plate-blue:#003399;
    --chrome-bg:#1C2024;
    --chrome-text:#FFFFFF;
    --radius:14px;
  }
  /* Mørkemodus: mørkegrå (ikke helsvart) med lyse tekster og samme fargeprofil,
     satt via data-theme på <html> (styrt av tema-valget i Innstillinger). */
  :root[data-theme="dark"]{
    --bg:#15171B;
    --surface:#1E2126;
    --ink:#ECEDEE;
    --muted:#9AA1AB;
    --line:#33373E;
    --red:#FF6B6B;
    --red-soft:#3D1418;
    --amber:#F5B94D;
    --amber-soft:#3D2E0E;
    --green:#4ADE94;
    --green-soft:#0F2B1E;
    --orange:#FF9B52;
    --orange-soft:#3D200E;
    --blue:#7AA2FF;
    --blue-soft:#141C33;
    --chrome-bg:#ECEDEE;
    --chrome-text:#15171B;
  }
  *{box-sizing:border-box;}
  /* Felles, global regel — IKKE per komponent — som sørger for at absolutt alle
     <select>-nedtrekksmenyer i appen (bilvalg, verkstedvalg, statusvalg, kategori,
     filtre, Administratorbrukere, Verkstedregister osv.) følger valgt tema, inkludert
     selve popup-listen med valgene når man klikker ned menyen. Dette er den ene
     felles løsningen alle nåværende OG fremtidige select-elementer arver automatisk,
     uten at noen enkelt-dropdown trenger egen styling. */
  select, select option{background-color:var(--surface);color:var(--ink);}
  select option:checked, select option:hover{background-color:var(--bg);}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;padding-top:env(safe-area-inset-top, 0px);}
  #app{max-width:1080px;margin:0 auto;padding:24px 16px calc(80px + env(safe-area-inset-bottom, 0px));}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;}

  /* ---- App shell ---- */
  .shell-top{
    position:relative;overflow:hidden;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    padding:14px 18px;margin-bottom:16px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .shell-top::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,#0B8457 0%,#0B8457 45%,#FF7A00 100%);
  }
  .brand-block{display:flex;flex-direction:column;gap:2px;padding-top:2px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;display:flex;align-items:center;gap:9px;}
  .brand-sub{font-size:11.5px;color:var(--muted);font-weight:500;}
  .header-link.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .header-action-btn{
    background:var(--surface);color:var(--ink);border:1.5px solid var(--line);
    transition:background .15s ease, box-shadow .15s ease, border-color .15s ease, filter .15s ease;
  }
  button.header-action-btn:hover{background:var(--bg);filter:none;box-shadow:0 2px 8px rgba(0,0,0,.10);}
  .header-action-btn.active{
    background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);
    box-shadow:0 0 0 3px var(--amber-soft);
  }
  button.header-action-btn.active:hover{background:var(--chrome-bg);filter:brightness(1.12);box-shadow:0 0 0 3px var(--amber-soft), 0 2px 8px rgba(0,0,0,.18);}
  .btn-label-short{display:none;}
  .shell-top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .menu-wrap{position:relative;}

  /* ---- Prioritet 27 (Design 2.0) — Desktop sidebar ("Kontrollsenter") ---- */
  .app-shell{display:block;}
  .app-shell-desktop{display:flex;align-items:flex-start;gap:24px;}
  .app-shell-desktop .app-shell-main{flex:1;min-width:0;}
  /* Regel 1: sidebaren ER navigasjonen på desktop — ☰ Meny/drawer er fortsatt fullt
     funksjonell i DOM (ingen logikk fjernet), men skjules visuelt siden Analyse/
     Innstillinger/overstyring allerede ligger i sidebarens sekundærseksjon. */
  .app-shell-desktop .shell-top-right{display:none;}
  .desktop-sidebar{
    flex:0 0 232px;position:sticky;top:20px;
    display:flex;flex-direction:column;gap:4px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:18px 14px;
  }
  .desktop-sidebar-brand{padding:2px 8px 16px;}
  .desktop-sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .desktop-sidebar-secondary{display:flex;flex-direction:column;gap:2px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .desktop-sidebar-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px 12px;border-radius:10px;border:none;background:transparent;
    font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .desktop-sidebar-item:hover{background:var(--bg);}
  .desktop-sidebar-item.active{background:var(--chrome-bg);color:var(--chrome-text);}
  .desktop-sidebar-item.small{font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;}
  .desktop-sidebar-item.small.active{background:var(--chrome-bg);color:var(--chrome-text);}
  .desktop-sidebar-ikon{font-size:17px;line-height:1;flex-shrink:0;}
  @media (max-width:1199px){
    /* Regel: nettbrett (768–1199px) bruker Desktop-opplevelsen, men med smalere sidebar
       for å gi mer plass til selve innholdet på et mindre skjermformat. */
    .desktop-sidebar{flex-basis:76px;padding:14px 8px;}
    .desktop-sidebar-brand,.desktop-sidebar-item span:not(.desktop-sidebar-ikon){display:none;}
    .desktop-sidebar-item{justify-content:center;padding:12px 6px;}
  }
  /* Optimalisering 15 (Dashboard Cleanup v2): Bilparkhelse Status-raden og "Biler i drift
     nå" i toppfeltet — kun til stede når screen==='dashboard'. flex-wrap gjør at chipsene
     naturlig går fra én rad (desktop) til stablet (smale skjermer) uten egen mobil-markup. */
  .shell-top-status{
    display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;width:100%;
    padding-top:10px;margin-top:2px;border-top:1px solid var(--line);
    font-weight:700;font-size:13.5px;
  }
  .shell-top-status-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .shell-top-status-item{cursor:pointer;white-space:nowrap;}
  .shell-top-drift{font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  /* Prioritet 16 (Morgenvisning Compact, Del 1): to nøkkeltall side ved side per rad i
     stedet for fem separate bokser i et grid — halverer den vertikale plassen "Dagens
     situasjon" tok fra før. */
  .morgen-compact-grid{display:flex;flex-direction:column;gap:8px;}
  .morgen-compact-row{
    display:flex;align-items:center;gap:10px;
    border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;
    font-weight:700;font-size:14px;
  }
  .morgen-compact-item{cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex:1;min-width:0;}
  .morgen-compact-sep{color:var(--line);font-weight:400;}
  .morgen-compact-row-alert{border-color:var(--red);background:var(--red-soft);color:var(--red);}
  .datepicker-popup{
    position:absolute;width:min(300px,92vw);background:var(--surface);border:1.5px solid var(--line);
    border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;z-index:300;
  }
  .dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-nav{background:none;border:1.5px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:16px;color:var(--ink);cursor:pointer;}
  .dp-nav:hover{background:var(--bg);}
  .dp-month-year{background:none;border:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;padding:6px 10px;border-radius:8px;}
  .dp-month-year:hover{background:var(--bg);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .dp-weekdays div{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{
    aspect-ratio:1;border:none;background:none;border-radius:8px;font-size:13px;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:38px;font-family:'Inter',sans-serif;
  }
  .dp-day:hover{background:var(--bg);}
  .dp-day.muted{color:var(--muted);opacity:.45;}
  .dp-day.today{border:1.5px solid var(--chrome-bg);font-weight:700;}
  .dp-day.selected{background:var(--chrome-bg);color:var(--chrome-text);font-weight:700;}
  .dp-today-btn{width:100%;margin-top:10px;padding:9px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
  .dp-today-btn:hover{background:var(--bg);}
  .dp-year-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:230px;overflow-y:auto;}
  .dp-year-opt{padding:9px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .dp-year-opt:hover{background:var(--bg);}
  .dp-year-opt.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .timepicker-popup{
    position:absolute;width:140px;max-height:280px;overflow-y:auto;background:var(--surface);
    border:1.5px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);
    padding:6px;z-index:300;
  }
  .tp-list{display:flex;flex-direction:column;gap:2px;}
  .tp-row{
    padding:10px 12px;min-height:40px;border:none;background:none;border-radius:8px;
    font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .tp-row:hover{background:var(--bg);}
  .tp-row.selected{background:var(--chrome-bg);color:var(--chrome-text);font-weight:700;}
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;height:100dvh;width:min(340px,88vw);
    background:var(--surface);z-index:201;box-shadow:-10px 0 34px rgba(0,0,0,.22);
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;border-bottom:1.5px solid var(--line);flex-shrink:0;
  }
  .drawer-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--ink);}
  .drawer-close{
    background:none;border:1.5px solid var(--line);border-radius:10px;
    width:42px;height:42px;min-width:42px;font-size:18px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .drawer-close:hover{background:var(--bg);}
  .drawer-user{
    padding:12px 18px;font-size:12px;color:var(--muted);font-weight:600;
    border-bottom:1.5px solid var(--line);flex-shrink:0;
  }
  .drawer-section-label{
    padding:16px 18px 6px;font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;
  }
  .drawer-nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;}
  .drawer-item{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:none;border:none;border-radius:12px;padding:14px 13px;min-height:52px;
    font-size:15px;font-weight:600;color:var(--ink);font-family:'Inter',sans-serif;cursor:pointer;
  }
  .drawer-item:hover{background:var(--bg);}
  .drawer-item .drawer-icon{font-size:19px;width:24px;text-align:center;flex-shrink:0;}
  .drawer-item.active{background:var(--amber-soft);font-weight:700;}
  .drawer-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;margin-left:auto;}
  .drawer-toggle-ikon{margin-left:auto;font-size:13px;color:var(--muted);flex-shrink:0;}
  .drawer-item.sub{padding-left:30px;font-size:14px;min-height:48px;}
  .drawer-item.sub .drawer-icon{font-size:17px;}
  .drawer-divider{height:1.5px;background:var(--line);margin:10px 14px;flex-shrink:0;}
  .drawer-footer{padding:10px 10px 16px;margin-top:auto;border-top:1.5px solid var(--line);flex-shrink:0;}
  @media (max-width:640px){
    .drawer{width:100%;box-shadow:none;}
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-sheet{
    background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 34px rgba(0,0,0,.22);
    transform:translateY(100%);transition:transform .22s ease;
  }
  .modal-overlay.open .modal-sheet{transform:translateY(0);}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-bottom:14px;}
  .modal-btn-big{
    width:100%;min-height:56px;border-radius:12px;font-size:14.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:12px 14px;margin-bottom:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  }
  .modal-btn-big .modal-btn-sub{font-size:11.5px;font-weight:600;color:var(--muted);}
  .modal-btn-big.primary{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .modal-btn-big.danger{background:var(--red-soft);color:var(--red);border-color:var(--red);}
  .modal-btn-big:disabled{opacity:.45;cursor:not-allowed;}
  @media (min-width:641px){
    .modal-overlay{align-items:center;}
    .modal-sheet{border-radius:16px;}
    /* Prioritet 17 (Del 5): Bilparkhelse Status-raden midtstilles på desktop — på mobil
       (under) forblir den venstrejustert, siden den der leses som en vertikal stabel. */
    .shell-top-status{justify-content:center;}
  }

  .navtabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .navtab{background:none;border:1.5px solid var(--line);color:var(--muted);padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  .navtab.active{background:var(--chrome-bg);color:var(--chrome-text);border-color:var(--chrome-bg);}
  .navtab:not(.active):hover{border-color:var(--ink);color:var(--ink);}
  .navtab:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{background:var(--chrome-bg);color:var(--chrome-text);border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn:hover{filter:brightness(0.85);}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.danger-outline{background:var(--surface);color:var(--red);border:1.5px solid var(--red-soft);font-weight:600;}
  .btn.danger-outline:hover{background:var(--red-soft);}
  .btn.danger{background:var(--red);color:#fff;border:1.5px solid var(--red);font-weight:700;}
  .btn.danger:hover{opacity:.9;}
  .danger-zone{
    margin-top:40px;padding:18px;border:1.5px dashed var(--red);border-radius:var(--radius);
    background:var(--red-soft);
  }
  .danger-zone-title{font-size:13px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .backbtn{background:none;border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink);font-weight:600;min-height:44px;display:inline-flex;align-items:center;}
  .backbtn:hover{border-color:var(--ink);}

  /* ---- Dashboard ---- */
  .greeting-card{
    background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:20px;
  }
  .greeting-card.morgen{border-left-color:var(--amber);}
  .greeting-card.dag{border-left-color:var(--ink);}
  .greeting-card.kveld{border-left-color:var(--blue);}
  .greeting-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .greeting-sub{color:var(--muted);font-size:13.5px;margin-top:4px;}
  .greeting-role{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;opacity:.7;}
  .greeting-datetime{font-size:12.5px;color:var(--muted);margin-top:10px;}
  .greeting-weather{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .greeting-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;}
  .greeting-right{
    display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:flex-start;
    padding-left:20px;border-left:1.5px solid var(--line);
  }
  .status-chip{
    display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:100px;
    background:var(--bg);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--ink);white-space:nowrap;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  }
  .status-chip:hover{border-color:var(--ink);}
  .status-chip:active{transform:scale(0.95);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;
    cursor:pointer;transition:box-shadow .15s ease, transform .1s ease, border-color .15s ease;
    max-width:100%;box-sizing:border-box;overflow:hidden;
  }
  .stat-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--muted);}
  .stat-card:active{transform:scale(0.97);}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .stat-label{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:8px;}
  .stat-card.accent-red .stat-num{color:var(--red);}
  .stat-card.accent-amber .stat-num{color:var(--amber);}
  .stat-card.accent-blue .stat-num{color:var(--blue);}

  .section-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .group-count{background:var(--line);color:var(--muted);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .dash-row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:26px;}
  .dash-row-2 .stat-grid{margin-bottom:0;}
  .dash-group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  /* Prioritet 27 (Design 2.0) — Planlegging: 4 kolonner på desktop, 1 kolonne på mobil
     (mobil-override nedenfor sammen med .dash-group-grid sin egen). */
  .planlegging-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start;}
  /* Prioritet 27 (Design 2.0) — Regel 2/3: mobilens ikonbaserte, handlingsdrevne
     hjemskjerm. 2 kolonner (nådd lett med én hånd, stående skjerm), store trykkflater
     (min 100px høyde), minimalt med tekst. */
  .mobil-hjem-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
  .mobil-hjem-btn{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:112px;padding:16px 10px;border-radius:18px;border:1.5px solid var(--line);
    background:var(--surface);cursor:pointer;font-family:inherit;
  }
  .mobil-hjem-btn:active{background:var(--bg);}
  .mobil-hjem-ikon{font-size:34px;line-height:1;}
  .mobil-hjem-label{font-size:13.5px;font-weight:700;color:var(--ink);text-align:center;}
  .mobil-hjem-badge{
    position:absolute;top:10px;right:10px;background:var(--red);color:#fff;
    font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;
    border-radius:100px;display:flex;align-items:center;justify-content:center;
  }
  .dash-group-card{padding:0;overflow:hidden;}
  .group-card-head{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:16px 18px;min-height:44px;cursor:pointer;
  }
  .group-card-title{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:700;}
  .group-card-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .group-card-head .chevron{transition:transform .2s ease;flex-shrink:0;}
  .group-card-head .chevron.open{transform:rotate(180deg);}
  /* Myk åpne/lukke-animasjon uten JS-målt høyde: raden animerer mellom 0fr og 1fr,
     og det indre laget skjuler overflyt mens den er lukket. Arver temaet automatisk
     siden ingen farger er hardkodet her. */
  .vehicle-group-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .vehicle-group-body.open{grid-template-rows:1fr;}
  .vehicle-group-body > div{overflow:hidden;padding:0 18px;}
  .vehicle-group-body.open > div{padding-bottom:16px;}
  .flag-name{font-weight:600;font-size:13.5px;}
  .flag-reason{font-size:12px;color:var(--muted);}
  .empty-note{color:var(--muted);font-size:13px;padding:16px 0;}

  .acc-list{display:flex;flex-direction:column;gap:10px;}
  .acc-row{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);border-left:5px solid var(--line);overflow:hidden;transition:box-shadow .15s;}
  .acc-row.ok{border-left-color:var(--green);}
  .acc-row.oppfolging{border-left-color:var(--amber);}
  .acc-row.verksted{border-left-color:var(--blue);}
  .acc-row.varsel{border-left-color:var(--red);}
  .acc-row:hover{box-shadow:0 3px 14px rgba(0,0,0,.06);}
  .acc-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap;max-width:100%;box-sizing:border-box;}
  .acc-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .acc-head-right{display:flex;align-items:center;gap:10px;flex-shrink:1;flex-wrap:wrap;justify-content:flex-end;min-width:0;max-width:100%;}
  .acc-row .chevron{color:var(--muted);font-size:18px;transition:transform .15s;}
  .acc-row.expanded .chevron{transform:rotate(180deg);}
  .acc-body{border-top:1.5px solid var(--line);padding:16px;background:var(--bg);}

  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 20px;}
  .ov-item{display:flex;flex-direction:column;gap:2px;}
  .sjafor-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .dekk-status-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px;}
  .ov-item-clickable{
    cursor:pointer;padding:8px 10px;margin:-8px -10px;border-radius:10px;
    transition:background .15s ease, transform .1s ease;
  }
  .ov-item-clickable:hover{background:var(--bg);}
  .ov-item-clickable:active{transform:scale(0.97);}
  .ov-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .ov-value{font-size:13.5px;font-weight:600;}

  .dmg-simple-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .dmg-simple-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;}
  .dmg-simple-main{font-size:13px;}
  .dmg-simple-list li[data-goto-vt]{cursor:pointer;}
  .dmg-simple-list li[data-goto-vt]:hover{border-color:var(--ink);}

  /* ---- Bilregister ---- */
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters-row input[type=text], .filters-row input[type=date], .filters-row select{
    font-family:'Inter',sans-serif;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-height:44px;
  }
  .filters-row input[type=text]{flex:1;min-width:180px;}
  .filters-row select, .filters-row input[type=date]{min-width:150px;}
  .filters-row input:focus, .filters-row select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .count{font-size:13px;color:var(--muted);}

  .panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;max-width:100%;box-sizing:border-box;}
  .panel h3{font-size:15px;margin-bottom:12px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select, .field textarea{font-family:'Inter',sans-serif;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px;}
  .field textarea{resize:vertical;min-height:90px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
  .panel-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);}
  .empty h3{color:var(--ink);margin-bottom:6px;font-size:16px;}

  .gcard{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--line);border-left:5px solid var(--line);overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
  .gcard.ok{border-left-color:var(--green);}
  .gcard.oppfolging{border-left-color:var(--amber);}
  .gcard.verksted{border-left-color:var(--blue);}
  .gcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.07);}
  .gcard-head{padding:16px;display:flex;gap:12px;align-items:flex-start;min-width:0;}
  .plate{flex-shrink:0;display:flex;height:34px;border-radius:5px;overflow:hidden;border:1.5px solid #1C2024;font-family:'Space Grotesk',sans-serif;}
  .plate .cc{background:var(--plate-blue);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;width:16px;}
  .plate .num{background:#fff;color:#111;font-weight:700;font-size:15px;letter-spacing:.06em;display:flex;align-items:center;padding:0 8px;white-space:nowrap;}
  .gcard-titles{min-width:0;flex:1;}
  .gcard-titles .model{font-weight:700;font-size:15px;overflow-wrap:break-word;}
  .gcard-titles .model-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .gcard-badges{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 16px;}
  .badge{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.soon, .badge.oppfolging, .badge.middels{background:var(--amber-soft);color:var(--amber);}
  .badge.overdue, .badge.hoy{background:var(--red-soft);color:var(--red);}
  .badge.verksted, .badge.registrert{background:var(--blue-soft);color:var(--blue);}
  .badge.unset{background:var(--line);color:var(--muted);}
  .badge.utbedret, .badge.lav{background:var(--green-soft);color:var(--green);}
  .badge.oppf-idag{background:var(--orange-soft);color:var(--orange);}

  /* ---- Bilkort ---- */
  .bilkort-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .bilkort-title{display:flex;gap:12px;align-items:center;min-width:0;flex-wrap:wrap;}
  .bilkort-title .model{font-size:19px;font-weight:700;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
  .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px;}

  .dmg-list{display:flex;flex-direction:column;gap:8px;}
  .dmg-item{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;}
  .dmg-item:hover{border-color:var(--ink);}
  .dmg-item.utbedret{opacity:.65;}
  .dmg-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .dmg-text .main{font-weight:700;font-size:13.5px;}
  .dmg-item.utbedret .main{text-decoration:line-through;}
  .dmg-text .desc{font-size:13px;color:var(--ink);margin-top:2px;}
  .dmg-meta{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .dmg-badges{display:flex;gap:6px;flex-shrink:0;}
  .dmg-editbox{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line);}

  /* ---- Verkstedtimer ---- */
  .vt-section{margin-bottom:26px;}
  .vt-section:last-child{margin-bottom:0;}
  .vt-list{display:flex;flex-direction:column;gap:8px;}
  .vt-card{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--line);border-radius:10px;overflow:hidden;}
  .vt-card.ok{border-left-color:var(--green);}
  .vt-card.soon{border-left-color:var(--amber);}
  .vt-card.unset{border-left-color:var(--line);}
  .vt-card.next-vt{border-left-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1.5px var(--blue) inset;}
  .vt-next-badge{font-size:11px;font-weight:700;color:var(--blue);display:block;margin-bottom:2px;}
  .vt-top{padding:12px 14px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;flex-wrap:wrap;align-items:flex-start;}
  .vt-vehicle{font-weight:700;font-size:13.5px;}
  .vt-desc{font-size:13px;margin-top:2px;}
  .vt-when{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .vt-date{font-weight:700;font-size:13.5px;}
  .vt-time{font-size:12px;color:var(--muted);}


  /* ---- Bilder / skjemaer ---- */
  .photo-input-area{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;background:var(--surface);}
  .photo-input-area input[type=file]{font-size:13px;}
  .photo-preview{max-width:100%;max-height:220px;border-radius:9px;margin-top:12px;display:block;margin-left:auto;margin-right:auto;}
  .required-hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .form-msg{font-size:13px;color:var(--red);margin-top:6px;}

  /* ---- Sjåførkontroll ---- */
  .kt-vehicle-card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:18px;
  }
  .kt-vehicle-card .model{font-weight:700;font-size:15px;}
  .kt-vehicle-card .model-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .kt-km-input{font-size:22px !important;font-weight:700;padding:14px 12px !important;text-align:center;}
  .chip-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .chip{
    display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;min-height:56px;
    border:1.5px solid var(--line);background:var(--surface);cursor:pointer;user-select:none;
    font-size:14.5px;font-weight:600;transition:border-color .1s, background .1s;
  }
  .chip input{width:22px;height:22px;flex-shrink:0;accent-color:var(--ink);}
  .chip-icon{font-size:19px;line-height:1;flex-shrink:0;width:24px;text-align:center;}
  .chip-text{flex:1;}
  .chip:has(input:checked){border-color:var(--ink);background:var(--amber-soft);}
  .chip.checked{border-color:var(--ink);background:var(--amber-soft);}
  .chip.chip-active-lamp{border-color:var(--green);background:var(--green-soft);cursor:not-allowed;opacity:1;}
  .chip.chip-active-lamp .chip-text{color:var(--green);font-weight:600;}
  button.chip{font-family:inherit;text-align:left;width:100%;}
  button.chip:disabled{cursor:not-allowed;}
  .vl-status-badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;
    font-size:11.5px;font-weight:700;border:1.5px solid transparent;margin-left:8px;
    text-transform:none;letter-spacing:normal;vertical-align:middle;
  }
  .vl-status-badge.red{background:var(--red-soft);color:var(--red);border-color:var(--red);}
  .vl-status-badge.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
  .vl-status-badge.green{background:var(--green-soft);color:var(--green);border-color:var(--green);}
  .active-lamp-list{
    display:flex;flex-direction:column;gap:8px;margin-bottom:14px;padding:12px 14px;
    border:1.5px solid var(--red);background:var(--red-soft);border-radius:12px;
  }
  .active-lamp-list-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .active-lamp-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);}
  .chip-yn{display:flex;gap:10px;}
  .chip-yn label{
    flex:1;text-align:center;padding:16px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;user-select:none;
  }
  .chip-yn input{display:none;}
  .chip-yn label:has(input:checked){border-color:var(--chrome-bg);background:var(--chrome-bg);color:var(--chrome-text);}
  .chip-yn label.checked{border-color:var(--chrome-bg);background:var(--chrome-bg);color:var(--chrome-text);}
  .kt-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px;}
  .kt-photo-thumb{position:relative;}
  .kt-photo-thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1.5px solid var(--line);}
  .kt-photo-thumb button{
    position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:100px;
    background:var(--red);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;padding:0;
  }
  .kt-history-card{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;}
  .kt-history-card.avvik{border-left-color:var(--amber);}
  .kt-history-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13.5px;}
  .kt-history-lines{margin-top:6px;font-size:12.5px;color:var(--ink);display:flex;flex-direction:column;gap:2px;}
  .kt-history-meta{font-size:11.5px;color:var(--muted);margin-top:6px;}

  .vl-card{
    background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--red);border-radius:10px;
    padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .vl-card.kvittert{border-left-color:var(--green);opacity:.75;}
  .vl-card-main{font-size:13.5px;}
  .vl-card-main .title{font-weight:700;}
  .vl-card-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .vl-indicator{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .dash-chip-col{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:0;max-width:100%;}
  .dash-chip{
    font-size:clamp(10px, 2.6vw, 11.5px);font-weight:700;padding:4px 9px;border-radius:100px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border:1.5px solid transparent;
    max-width:100%;box-sizing:border-box;
  }
  .dash-chip.ok{background:var(--green-soft);color:var(--green);border-color:var(--green);}
  .dash-chip.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
  .dash-chip.alert{background:var(--red-soft);color:var(--red);border-color:var(--red);}
  .dash-chip.today{background:var(--orange-soft);color:var(--orange);border-color:var(--orange);}
  .dash-chip.reserve{background:var(--line);color:var(--muted);border-color:var(--line);}
  .vl-indicator.red{color:var(--red);}
  .vl-indicator.green{color:var(--green);}
  .vl-indicator.amber{color:var(--amber);}

  /* ---- Innstillinger ---- */
  .settings-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .settings-row{background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .settings-add{display:flex;gap:8px;}
  .settings-add input{flex:1;}
  .theme-options{display:flex;flex-direction:column;gap:8px;}
  .theme-option{
    display:flex;align-items:center;gap:10px;padding:14px;min-height:44px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
    cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink);
  }
  .theme-option input{width:20px;height:20px;flex-shrink:0;accent-color:var(--chrome-bg);}
  .theme-option.checked{border-color:var(--chrome-bg);border-width:2px;}

  @media (max-width:640px){
    /* Full mobilnavigasjon skjer nå via sidemenyen (drawer) — fanerekken tar for
       mye plass og blir trang på smale skjermer, så den skjules på mobil. */
    .navtabs{display:none;}

    /* Header-knappene "Registrer kontroll"/"Registrer verkstedtime" får kortere
       tekst på smal skjerm, slik at begge fortsatt har plass ved siden av "☰ Meny". */
    .btn-label-full{display:none;}
    .btn-label-short{display:inline;}

    /* Skjemaer og info-rader: alltid én kolonne på mobil */
    .form-grid, .row2, .row3, .row4, .ov-grid, .dekk-status-grid{grid-template-columns:1fr;}

    /* Dashboard: Bilparkstatus/Sjåførkontroll og de tre bilgruppekortene stables
       under hverandre i stedet for sideveis scrolling */
    .dash-row-2, .dash-group-grid, .planlegging-grid{grid-template-columns:1fr;}

    /* Velkomstkort: to kolonner blir én, med en tynn linje over i stedet for til
       venstre når statuslinjene havner under hilsenen i stedet for ved siden av */
    .greeting-grid{grid-template-columns:1fr;}
    .greeting-right{border-left:none;border-top:1.5px solid var(--line);padding-left:0;padding-top:14px;margin-top:14px;}

    /* Filtre: full bredde og stablet i stedet for trange felt ved siden av hverandre */
    .filters-row{flex-direction:column;align-items:stretch;}
    .filters-row input, .filters-row select{width:100%;min-width:0;}

    /* Varsellampe-avhukingsbokser: to kolonner på mobil for å redusere scrolling.
       Kun tekst/ikon/avstand er komprimert her — selve avhukingsboksen (.chip input)
       og trykkflaten (min-height) er UENDRET, fortsatt godt over 44px. */
    .chip-grid{grid-template-columns:1fr 1fr;gap:6px;}
    .chip{padding:9px 8px;min-height:46px;gap:6px;font-size:12.5px;}
    .chip-icon{font-size:15px;width:18px;}

<script>
// ---- Nettverksstatus ----
// Lagringen skjer nå sentralt i Airtable (se airtable-config.js og
// storage.airtable.js, lastet i <head> FØR denne filen). I motsetning til
// Firestore har ikke Airtables API innebygd offline-kø — mister enheten
// nettet midt i en innsending, kan den feile. Varsellinjen under gjør i det
// minste tydelig NÅR det er tilfelle, slik at man kan prøve igjen når nettet
// er tilbake i stedet for å anta at innsendingen gikk gjennom.
function updateOfflineBanner(){
  let bar = document.getElementById('offline-banner');
  if(!navigator.onLine){
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'offline-banner';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B45309;color:#fff;padding:12px 16px;font:600 13.5px system-ui,sans-serif;text-align:center;';
      bar.textContent = '📡 Ingen nettforbindelse. Det du registrerer nå lagres lokalt på enheten og sendes automatisk til den sentrale databasen så snart nettet er tilbake.';
      document.body.prepend(bar);
    }
  } else if(bar){
    bar.remove();
  }
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
document.addEventListener('DOMContentLoaded', updateOfflineBanner);
</script>

// 'ok' = lenger frem/oppdatert, 'mangler' = ingen oppfølgingsdato satt.
function sakOppfolgingStatus(s){
  if(!sakErApen(s)) return null;
  if(!s.followUpDate) return 'mangler';
  const d = daysUntil(s.followUpDate);
  if(d === null) return 'mangler';
  if(d < 0) return 'forfalt';
  if(d === 0) return 'idag';
  if(d <= 3) return 'snart';
  return 'ok';
}

// bekreftelse — se Fase 5-spesifikasjonen ("ingen aktive saker skal kunne bli glemt").
function sakKreverHandling(s){
  if(!sakErApen(s)) return false;
  if(s.status === 'ny' || s.status === 'vurderes' || s.status === 'utfort-venter-bekreftelse' || s.status === 'delvis-utfort') return true;
  if(!s.nextAction || !s.followUpDate) return true;

// ---- Fase 7 (Bilstatus 2.0): én sentral, prioritert statusmotor som ALLE sider bruker
// (Dashboard, Biloversikt, Kjøretøyprofil) — kun én hovedstatus vises per bil.
// Prioritet: Ute av drift > Kritisk > Verksted bestilt > Under oppfølging > Reservebil
// (ikke i bruk) > Ikke kontrollert > Operativ.
function vehicleHovedstatus(vehicleId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(v && v.uteAvDrift) return 'ute-av-drift';
  const apneSaker = vehicleAktiveSaker(vehicleId);
  if(apneSaker.some(s => s.priority === 'kritisk')) return 'kritisk';
  if(apneSaker.some(s => s.status === 'verksted-bestilt' || s.status === 'utfort-venter-bekreftelse')) return 'verksted';
  if(apneSaker.length > 0) return 'oppfolging';
  if(!isKontrollertIdag(vehicleId)){

    if(vehicleErReserveUnntatt(vehicleId)) return 'reserve';

  }

}
const HOVEDSTATUS_ORDER = ['ute-av-drift', 'kritisk', 'verksted', 'oppfolging', 'reserve', 'ikke-kontrollert', 'operativ'];

// Gjenbruker eksisterende .badge-fargeklasser (rød/oransje/gul/grå/grønn) slik at

const HOVEDSTATUS_BADGE_KLASSE = {'ute-av-drift':'overdue', kritisk:'overdue', verksted:'oppf-idag', oppfolging:'soon', reserve:'unset', 'ikke-kontrollert':'unset', operativ:'ok'};

// ---- Optimalisering 5 (Operativ Morgenvisning): "Dagens status" per bil ----
// Enklere, morgen-fokusert status enn vehicleHovedstatus() — svarer kun på "er denne
// bilen klar for drift akkurat nå", uavhengig av lavere-prioriterte forhold som
// "under oppfølging". Prioritet: kritisk sak > mangler kontroll > verksted i dag > klar.
function vehicleDagensStatus(vehicleId){
  if(vehicleAktiveSaker(vehicleId).some(s => s.priority === 'kritisk')) return 'kritisk';
  if(!isKontrollertIdag(vehicleId)){

  }
  if(verkstedtimer.some(t => t.vehicleId === vehicleId && t.dato === todayISO())) return 'verksted-idag';
  return 'klar';
}

const DAGENS_STATUS_LABEL = {klar:'Klar for drift', 'mangler-kontroll':'Mangler kontroll', 'verksted-idag':'Verksted i dag', kritisk:'Kritisk sak', reserve:'Reservebil'};
const DAGENS_STATUS_CHIP_KLASSE = {klar:'ok', 'mangler-kontroll':'warn', 'verksted-idag':'today', kritisk:'alert', reserve:'reserve'};
// Fase 2/3: automatisk bilstatus utledet fra Aktive Saker (uavhengig av det manuelt
// satte v.status-feltet som styrer "På verksted"/"Trenger oppfølging" andre steder).
// RØD = minst én åpen sak med prioritet Kritisk, ORANSJE = minst én sak med status
// "Verksted bestilt" (eller "Utført - venter bekreftelse"), GUL = minst én åpen sak,
// GRØNN = ingen. Kritisk prioritet overstyrer alltid verkstedstatus.
function vehicleSakStatus(vehicleId){
  const apneSaker = aktiveSaker.filter(s => s.vehicleId === vehicleId && sakErApen(s));
  if(apneSaker.length === 0) return 'gronn';
  if(apneSaker.some(s => s.priority === 'kritisk')) return 'rod';
  if(apneSaker.some(s => s.status === 'verksted-bestilt' || s.status === 'utfort-venter-bekreftelse')) return 'oransje';
  return 'gul';
}
const SAK_BILSTATUS_IKON = {gronn:'🟢', gul:'🟡', oransje:'🟠', rod:'🔴'};
// Fase 3: verksteddato passert på en "Verksted bestilt"-sak flytter den automatisk til
// "Utført - venter bekreftelse", uten at administrator må gjøre det manuelt. Kjøres ved
// boot og hver gang Aktive Saker/Dashboard rendres (billig, idempotent operasjon).
function oppdaterVerkstedStatuser(){
  const today = todayISO();
  let endret = false;
  aktiveSaker.forEach(s => {
    if(s.status === 'verksted-bestilt' && s.linkedVtId){
      const vt = verkstedtimer.find(t => t.id === s.linkedVtId);
      if(vt && vt.dato < today){
        s.status = 'utfort-venter-bekreftelse';
        s.updatedAt = new Date().toISOString();
        endret = true;
      }
    }
  });
  return endret;
}

function nesteSakId(){

// ---- Fase 2: automatisk opprettelse av Aktive Saker med duplikatkontroll ----
// Kalles fra skaderegistrering og Aktiv Biløkt/Min Bil sine hurtigregistreringer (ett
// avvik/hendelse om gangen — se avgrensningen i "Prioritet 12" under: disse skal ALDRI
// slås sammen til en flerpunkts sak, i motsetning til registrerKontrollAvvikSomSak).
// Synkron og lagrer IKKE selv — kalleren kjører saveAktiveSaker() selv.
// Duplikatkontroll: matcher på vehicleId + caseType + sourceId blant ÅPNE saker — nå via
// finnAktivSakMedAvvik(), som også finner avviket dersom det ligger som ett element inne
// i en flerpunkts kontroll-sak (Prioritet 12), ikke bare i sakens egne toppnivåfelt. Finnes
// en match fra før økes rapporttelleren og observasjonen legges i historikken i stedet for
// å opprette en ny sak (se "Bil 7 mandag/tirsdag/onsdag"-eksempelet). For skader er sourceId
// alltid unik (damage-id), så hver skade får naturlig sin egen sak uten spesialtilfelle.
function registrerAvvikSomSak({vehicleId, caseType, sourceId, tittel, beskrivelse, prioritet, reportedBy, reportedAt, kommentar, controlId}){
  const now = new Date().toISOString();
  const historikkOppforsel = {dato: reportedAt, tidspunkt: nowTimeOslo(), av: reportedBy || 'Ukjent', kommentar: kommentar || ''};
  const eksisterende = finnAktivSakMedAvvik(vehicleId, caseType, sourceId);
  if(eksisterende){
    const {sak, avvikItem} = eksisterende;
    if(avvikItem){
      avvikItem.reportCount = (avvikItem.reportCount || 1) + 1;
      avvikItem.lastReportedAt = now;
    } else {
      sak.reportCount = (sak.reportCount || 1) + 1;
      sak.lastReportedAt = now;
    }
    sak.updatedAt = now;
    if(!Array.isArray(sak.historikk)) sak.historikk = [];
    sak.historikk.push(historikkOppforsel);
    return sak;
  }
  const v = vehicles.find(x => x.id === vehicleId);
  const sak = {
    id: uid(), caseId: nesteSakId(), vehicleId, registrationNumber: v ? v.regnr : '',
    caseType, title: tittel, description: beskrivelse, status: 'ny', priority: prioritet,
    sourceType: 'auto', sourceId,
    reportedBy: reportedBy || 'Ukjent', reportedAt,
    assignedTo: '', nextAction: '', followUpDate: null,
    resolvedAt: null, resolvedBy: null, resolutionNote: '',
    reportCount: 1, lastReportedAt: now,
    historikk: [historikkOppforsel],
    // Optimalisering 3 — Kontrollsletting: peker på kontrollen som først opprettet
    // saken (kun satt ved førstegangsopprettelse, akkurat som på damages/varsellys),
    // brukes til å avgjøre hva "full cleanup" av en slettet kontroll skal fjerne.
    createdByControlId: controlId || null,
    createdAt: now, updatedAt: now
  };
  aktiveSaker.push(sak);
  return sak;
}
// ==================== Prioritet 12 — Sammenslåtte Kontrollavvik ====================
// Én sjåførkontroll som rapporterer flere varsellamper/kontrollavvik samtidig skal gi ÉN
// aktiv sak for bilen, med hvert avvik som et eget element i sak.avvik — ikke én sak per
// avvik. Avgrensning (bekreftet eksplisitt): kun varsellampe+kontrollavvik FRA SAMME
// kontrollinnsending slås sammen. Skader, manuelle saker, historiske saker, og hendelser
// fra Aktiv Biløkt/Min Bil (som fortsatt bruker registrerAvvikSomSak ett avvik om gangen,
// se over) skal ALDRI slås sammen — dette er sikret ved at kun submitKontroll sitt EGET,
// ene kall til registrerKontrollAvvikSomSak() nedenfor kan opprette en flerpunkts sak; alle
// andre innganger (skade, Min Bil) fortsetter uendret på registrerAvvikSomSak().

// Menneskelesbar etikett for én avvik-type, uavhengig av om den ligger i en flerpunkts
// sak sitt avvik[]-element eller må utledes fra en gammel enkeltavvik-sak sine toppnivåfelt
// (se sakAvvikListe). Samme oppslag som sakProblemLabel() alltid har brukt.
function avvikTypeLabel(caseType, sourceId, annetTekst){
  if(caseType === 'varsellampe'){
    if(sourceId === 'annet') return (annetTekst || '').trim() || VARSELLAMPE_LABEL.annet;
    return VARSELLAMPE_LABEL[sourceId] || 'Varsellampe';
  }
  if(caseType === 'kontrollavvik') return KONTROLLAVVIK_LABEL[sourceId] || 'Kontrollavvik';
  return null;
}
// Full avvik-liste for en sak, uansett om den er en NY flerpunkts kontroll-sak (har
// sak.avvik) eller en ELDRE/enkeltavvik-sak (skade, manuell, Min Bil, eller data fra før
// Prioritet 12) — disse har ikke feltet, så ETT element syntetiseres fra sakens egne
// toppnivåfelt ved lesing. All visningskode (Steg 1, sakskort, gruppeoverskrifter) skal
// alltid gå via denne funksjonen i stedet for å lese sak.avvik direkte, slik at gammel og
// ny datamodell fungerer identisk uten noen bulk-migrering av eksisterende Airtable-data.
function sakAvvikListe(s){
  if(Array.isArray(s.avvik) && s.avvik.length > 0) return s.avvik;
  return [{
    id: s.id, caseType: s.caseType, sourceId: s.sourceId, label: sakProblemLabel(s),
    status: (s.status === 'lukket' || s.status === 'utfort') ? 'utfort' : 'aktiv',
    prioritet: s.priority, createdAt: s.createdAt, resolvedAt: s.resolvedAt,
    linkedVtId: s.linkedVtId || null, reportCount: s.reportCount, lastReportedAt: s.lastReportedAt
  }];
}
function sakAvvikAktive(s){ return sakAvvikListe(s).filter(a => a.status === 'aktiv'); }
function sakAvvikUtforte(s){ return sakAvvikListe(s).filter(a => a.status !== 'aktiv'); }
// Finner en ÅPEN sak på bilen som allerede har dette spesifikke avviket AKTIVT — enten
// som ett element i en flerpunkts sak sitt avvik[], eller (eldre data/skade/manuell) i
// sakens egne toppnivåfelt. Brukt av BÅDE registrerAvvikSomSak (Min Bil/skade) OG
// registrerKontrollAvvikSomSak (kontrollskjema) for å unngå duplikatsporing av det samme
// avviket to steder, uansett hvilken vei det kommer inn.
function finnAktivSakMedAvvik(vehicleId, caseType, sourceId){
  const sak = aktiveSaker.find(s => s.vehicleId === vehicleId && sakErApen(s) &&
    sakAvvikListe(s).some(a => a.caseType === caseType && a.sourceId === sourceId && a.status === 'aktiv'));
  if(!sak) return null;
  const avvikItem = Array.isArray(sak.avvik) && sak.avvik.length > 0
    ? sak.avvik.find(a => a.caseType === caseType && a.sourceId === sourceId && a.status === 'aktiv')
    : null; // null = eldre enkeltavvik-sak, bump skjer på toppnivåfeltene i stedet
  return {sak, avvikItem};
}
// Batch-opprettelse fra ÉN sjåførkontroll: avvikListe er alle NYE varsellamper/
// kontrollavvik fra DENNE innsendingen (ikke skade). Avvik som allerede er aktive et
// annet sted (uansett kilde) bumpes der de bor i stedet for å dupliseres. Genuint nye
// avvik fra DENNE kontrollen samles i ÉN sak — kun én ny sak opprettes per kontroll,
// uansett hvor mange nye avvik som rapporteres samtidig. En SENERE, separat kontroll
// (eller Min Bil) starter alltid sin egen nye sak for nye avvik — den henter ALDRI inn i
// en allerede eksisterende sak fra en tidligere kontroll (kun eksakte duplikater av et
// allerede aktivt avvik bumpes, se over).
function registrerKontrollAvvikSomSak(vehicleId, avvikListe, opts){
  const {reportedBy, reportedAt, controlId, kommentar} = opts;
  const now = new Date().toISOString();
  let nySak = null;
  avvikListe.forEach(({caseType, sourceId, label, prioritet}) => {
    // Historikk-kommentaren inneholder alltid selve avvik-etiketten (f.eks. "Motorlampe")
    // først, slik at hver observasjonslinje er identifiserbar selv når saken har flere
    // avvik — samme mønster som før Prioritet 12, kun bygget fra avvik-elementets egen
    // label i stedet for en hardkodet per-kall streng.
    const historikkOppforsel = {dato: reportedAt, tidspunkt: nowTimeOslo(), av: reportedBy || 'Ukjent', kommentar: label + (kommentar ? ' · ' + kommentar : '')};
    const eksisterende = finnAktivSakMedAvvik(vehicleId, caseType, sourceId);
    if(eksisterende){
      const {sak, avvikItem} = eksisterende;
      if(avvikItem){ avvikItem.reportCount = (avvikItem.reportCount||1)+1; avvikItem.lastReportedAt = now; }
      else { sak.reportCount = (sak.reportCount||1)+1; sak.lastReportedAt = now; }
      sak.updatedAt = now;
      if(!Array.isArray(sak.historikk)) sak.historikk = [];
      sak.historikk.push(historikkOppforsel);
      return;
    }
    if(!nySak){
      const v = vehicles.find(x => x.id === vehicleId);
      nySak = {
        id: uid(), caseId: nesteSakId(), vehicleId, registrationNumber: v ? v.regnr : '',
        caseType, title: label, description: 'Automatisk generert fra kontrollregistrering.',
        status: 'ny', priority: prioritet, sourceType: 'auto', sourceId,
        reportedBy: reportedBy || 'Ukjent', reportedAt,
        assignedTo: '', nextAction: '', followUpDate: null,
        resolvedAt: null, resolvedBy: null, resolutionNote: '',
        reportCount: 1, lastReportedAt: now,
        historikk: [historikkOppforsel],
        avvik: [{id: uid(), caseType, sourceId, label, status: 'aktiv', prioritet, createdAt: now, resolvedAt: null, linkedVtId: null, reportCount: 1, lastReportedAt: now}],
        createdByControlId: controlId || null,
        createdAt: now, updatedAt: now
      };
      aktiveSaker.push(nySak);
    } else {
      nySak.avvik.push({id: uid(), caseType, sourceId, label, status: 'aktiv', prioritet, createdAt: now, resolvedAt: null, linkedVtId: null, reportCount: 1, lastReportedAt: now});
      if(SAK_PRIORITET_RANK[prioritet] > SAK_PRIORITET_RANK[nySak.priority]) nySak.priority = prioritet;
      nySak.updatedAt = now;
      if(!Array.isArray(nySak.historikk)) nySak.historikk = [];
      nySak.historikk.push(historikkOppforsel);
    }
  });
  return nySak;
}
// Merker ett enkelt avvik i en sak som utført UTEN verksted (f.eks. "ikke reelt"/løst på
// annen måte) — dekker sjekklistens "eksplisitt lukket eller avvist". Flerpunkts saker:
// oppdaterer avvik-elementet og rekalkulerer sakens status (se sakOppdaterStatusEtterAvvik).
// Eldre enkeltavvik-saker: ingen avvik[] å endre på — bruk den vanlige wizard-lukkingen
// (Steg 4) for disse i stedet, som før.
function markerAvvikUtfort(sakId, avvikId){
  const sak = aktiveSaker.find(s => s.id === sakId);
  if(!sak || !Array.isArray(sak.avvik)) return;
  const item = sak.avvik.find(a => a.id === avvikId);
  if(!item || item.status !== 'aktiv') return;
  item.status = 'utfort';
  item.resolvedAt = todayISO();
  sak.updatedAt = new Date().toISOString();
  sakOppdaterStatusEtterAvvik(sak);
}
// Rekalkulerer en flerpunkts sak sin overordnede status etter at ett eller flere avvik er
// merket utført (fra verksted-fullføring ELLER markerAvvikUtfort direkte). Kjerneregelen
// fra "Prioritet 12": saken skal ALDRI hoppe tilbake til "Vurderes" bare fordi noen avvik
// er ferdige — den er jo allerede vurdert og under behandling. I stedet: står ett eller
// flere avvik fortsatt aktive → status blir "Delvis utført" (med mindre saken er tidligere
// i sin egen livssyklus enn det — se under). Står ALLE avvik som utført → status kan gå
// videre til "Utført" (samme sti som den vanlige wizard-lukkingen alltid har brukt).
// Berører kun saker med sak.avvik (flerpunkts) — enkeltavvik-saker er uendret, styres
// fortsatt utelukkende av submitSakWizardFullfor som før.
function sakOppdaterStatusEtterAvvik(sak){
  if(!Array.isArray(sak.avvik) || sak.avvik.length === 0) return;
  const aktive = sak.avvik.filter(a => a.status === 'aktiv');
  if(aktive.length === 0){
    if(sak.status !== 'lukket') sak.status = 'utfort';
  } else if(sak.status === 'verksted-bestilt' || sak.status === 'utfort-venter-bekreftelse' || sak.status === 'utfort' || sak.status === 'delvis-utfort'){
    sak.status = 'delvis-utfort';
  }
  // 'ny'/'vurderes'/'tiltak-planlagt' med gjenværende aktive avvik: ingen endring — saken
  // er ikke kommet så langt i behandlingen ennå at "delvis utført" gir mening der.
}
// Kan saken lukkes? Kun når ALLE avvik er utført (eller den er en eldre enkeltavvik-sak,
// hvor "alle avvik utført" alltid betyr ja siden det bare er ett).
function sakAlleAvvikFerdig(sak){
  return sakAvvikAktive(sak).length === 0;
}
// En sak regnes som "viderebehandlet" når den har beveget seg forbi utgangspunktet
// den ble opprettet i — status endret, rapportert på nytt, fått oppfølging satt av
// administrator, fått bestilt verksted, fått en kommentar, ELLER (Prioritet 12) fått ett
// enkelt avvik markert utført/rapportert på nytt uten at HELE saken nødvendigvis har
// beveget seg forbi "Ny". Brukes til sikkerhetsregelen ved kontrollsletting: slike saker
// skal ALDRI fjernes automatisk uten eksplisitt bekreftelse (Optimalisering 13).
function sakHarBlittViderebehandlet(sak){
  if(sak.status !== 'ny') return true;
  if((sak.reportCount || 1) > 1) return true;
  if(sak.nextAction || sak.followUpDate) return true;
  if(sak.linkedVtId) return true;
  // Optimalisering 13: en frittstående kommentar (submitSakWizardKommentar) endrer
  // ingen av feltene over — kun historikk. Sammenlignes mot sakAvvikListe(sak).length,
  // ikke en fast 1, fordi en fersk flerpunkts kontroll-sak (Prioritet 12) alltid starter
  // med nøyaktig én historikkoppføring PER avvik den samler — det alene er ikke et tegn
  // på viderebehandling, kun ekstra oppføringer UTOVER det er.
  if(Array.isArray(sak.historikk) && sak.historikk.length > sakAvvikListe(sak).length) return true;
  // Optimalisering 13 / Prioritet 12: ett enkelt avvik i en flerpunkts sak kan ha blitt
  // markert utført (markerAvvikUtfort, uten verksted) eller rapportert på nytt, uten at
  // saken som helhet har forlatt "Ny" — fanges opp her slik at Full Cleanup aldri fjerner
  // en sak der reelt arbeid er gjort på ett av avvikene, selv om resten av saken ser urørt
  // ut på toppnivå.
  if(sakAvvikListe(sak).some(a => a.status !== 'aktiv' || (a.reportCount || 1) > 1)) return true;
  return false;
}

// er kun DENNE enhetens lokale posisjon i sjåførflyten, husket i localStorage slik at en
// gjenåpnet PWA havner rett tilbake på riktig skjerm.

const DRIVER_SESSION_KEY = 'bilpark_driver_session_v1';
function saveDriverLocalSession(){
  try{ window.localStorage.setItem(DRIVER_SESSION_KEY, JSON.stringify({vehicleId: driverActiveVehicleId, navn: driverNavn})); }
  catch(e){ /* ikke kritisk, f.eks. privat nettlesermodus */ }
}
function loadDriverLocalSession(){
  try{
    const raw = window.localStorage.getItem(DRIVER_SESSION_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    driverActiveVehicleId = s.vehicleId || '';
    driverNavn = s.navn || '';
  }catch(e){ /* ignorer */ }
}
function clearDriverLocalSession(){
  try{ window.localStorage.removeItem(DRIVER_SESSION_KEY); }catch(e){ /* ignorer */ }
  driverActiveVehicleId = '';
}
// Aktiv sjåfør på en bil — regnes alltid live mot operativt dagskille (04:00), akkurat
// som isKontrollertIdag(). En biløkt fra en tidligere operativ dag regnes som avsluttet
// selv om feltene på kjøretøyet ikke er ryddet opp ennå (se ryddOppBiloktDagskille).
function vehicleAktivSjafor(vehicleId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v || !v.aktivSjafor || !v.aktivSjaforSiden) return null;
  if(isoDateForOperationalDay(new Date(v.aktivSjaforSiden)) !== todayISO()) return null;
  return v.aktivSjafor;
}
// Starter en biløkt for `navn` på `vehicleId`. Én sjåfør kan kun ha én aktiv biløkt —
// en ev. annen aktiv biløkt samme sjåfør har på en annen bil avsluttes automatisk.
async function startBilokt(vehicleId, navn){
  const navnTrim = (navn || '').trim();
  vehicles.forEach(v => {
    if(v.id !== vehicleId && navnTrim && v.aktivSjafor && v.aktivSjafor.trim().toLowerCase() === navnTrim.toLowerCase()){
      v.aktivSjafor = ''; v.aktivSjaforSiden = '';
    }
  });
  const v = vehicles.find(x => x.id === vehicleId);
  if(v){ v.aktivSjafor = navnTrim; v.aktivSjaforSiden = new Date().toISOString(); }
  await saveVehicles();
  driverActiveVehicleId = vehicleId;
  driverNavn = navnTrim;
  saveDriverLocalSession();
}
// "Sjekk ut bil": avslutter biløkten. Kontrollstatus skal IKKE påvirkes — den står
// fortsatt som kontrollert resten av den operative dagen (isKontrollertIdag er uendret).
async function avsluttBilokt(vehicleId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(v){ v.aktivSjafor = ''; v.aktivSjaforSiden = ''; await saveVehicles(); }
  clearDriverLocalSession();
  driverScreen = 'velg-bil';
  driverVelgBilId = '';
}
// Rydder opp biløkter fra en tidligere operativ dag (dagskille kl. 04:00). Skriving til
// Airtable her er kun for å holde dataene ryddige — selve statusen er uansett alltid
// korrekt live via vehicleAktivSjafor() selv før denne har rukket å kjøre.
async function ryddOppBiloktDagskille(){
  const idag = todayISO();
  let endret = false;
  vehicles.forEach(v => {
    if(v.aktivSjafor && v.aktivSjaforSiden && isoDateForOperationalDay(new Date(v.aktivSjaforSiden)) !== idag){
      v.aktivSjafor = ''; v.aktivSjaforSiden = '';
      endret = true;
    }
  });
  if(endret) await saveVehicles();
  if(driverActiveVehicleId && !vehicleAktivSjafor(driverActiveVehicleId)){
    clearDriverLocalSession();
    driverScreen = 'velg-bil';
  }
}

// Kun ett kall per øktoppstart — ikke ved hvert render(). Feiler kallet (f.eks.
// ingen nettforbindelse i sjåførmodus/offline), skjules værlinjen bare stille i
// stedet for å bryte resten av Dashboardet.
let weatherData = null; // {temp, ikon, tekst} | null
const WEATHER_CODE_MAP = {
  0:['☀️','Klarvær'], 1:['🌤️','Lettskyet'], 2:['⛅','Delvis skyet'], 3:['☁️','Overskyet'],
  45:['🌫️','Tåke'], 48:['🌫️','Tåke'],
  51:['🌦️','Yr'], 53:['🌦️','Yr'], 55:['🌧️','Yr'],
  61:['🌧️','Regn'], 63:['🌧️','Regn'], 65:['🌧️','Kraftig regn'],
  71:['🌨️','Snø'], 73:['🌨️','Snø'], 75:['❄️','Kraftig snø'],
  80:['🌦️','Regnbyger'], 81:['🌦️','Regnbyger'], 82:['⛈️','Kraftige byger'],
  95:['⛈️','Tordenvær'], 96:['⛈️','Tordenvær'], 99:['⛈️','Tordenvær'],
};
async function fetchWeather(){
  try{
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.05&longitude=10.03&current=temperature_2m,weather_code&timezone=Europe%2FOslo');
    if(!res.ok) throw new Error('Vær-API svarte ' + res.status);
    const data = await res.json();
    const code = data && data.current ? data.current.weather_code : null;
    const temp = data && data.current ? Math.round(data.current.temperature_2m) : null;
    const [ikon, tekst] = WEATHER_CODE_MAP[code] || ['🌡️','Vær'];
    weatherData = (temp !== null) ? {temp, ikon, tekst} : null;
  }catch(e){
    weatherData = null; // f.eks. offline i sjåførmodus — vis bare ikke værlinjen
  }
  render();
}

// ---- Lys-/mørkemodus ----
// 'system' (standard) følger enhetens innstilling live; 'light'/'dark' er et eksplisitt
// valg som huskes til neste innlogging (lagres per enhet, ikke delt mellom brukere).
let themePreference = 'system'; // 'light' | 'dark' | 'system'
function resolveTheme(){
  if(themePreference === 'light' || themePreference === 'dark') return themePreference;
  try{
    if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  }catch(e){ /* ignore */ }
  return 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolveTheme());
}
async function saveThemePreference(v){
  themePreference = v;
  applyTheme();
  try{ await window.storage.set('theme-preference', v, false); }catch(e){ console.error(e); }
}
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if(themePreference === 'system') applyTheme();
    });
  }
}catch(e){ /* eldre nettlesere uten addEventListener på matchMedia — ignorer */ }
applyTheme(); // sett et fornuftig tema med det samme, før lagret valg er hentet fra loadAll()

// VIKTIG: dette er en tilgangssperre i grensesnittet, ikke ekte sikkerhet.
// Airtable har ikke noe innebygd autentiseringssystem (i motsetning til
// Firebase) — brukernavn/passord sjekkes derfor her i appen selv, mot rader i
// Airtable-tabellen "Users". Se airtable-config.js for hvorfor Airtable-

// denne innloggingen — den beskytter altså kun mot at sjåfører eller
// uvedkommende vandrer inn i administrasjonsdelen ved et uhell.
// Sesjonen holdes kun i minnet (ingen sessionStorage) — å laste siden på nytt

const REMEMBER_LOGIN_KEY = 'bilpark-remember-login';
function saveRememberedLogin(rolle){
  try{ window.localStorage.setItem(REMEMBER_LOGIN_KEY, JSON.stringify({rolle, savedAt: Date.now()})); }
  catch(e){ /* ikke kritisk om dette feiler */ }
}
function clearRememberedLogin(){
  try{ window.localStorage.removeItem(REMEMBER_LOGIN_KEY); }catch(e){ /* ignorer */ }
}
function readRememberedLogin(){
  try{
    const raw = window.localStorage.getItem(REMEMBER_LOGIN_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !data.rolle || !data.savedAt || (Date.now() - data.savedAt) > 90*24*60*60*1000){ clearRememberedLogin(); return null; }
    return data.rolle;
  }catch(e){ return null; }
}
async function loginSubmit(ev){
  ev.preventDefault();
  const brukernavn = (document.getElementById('login-brukernavn').value || '').trim();
  const passord = document.getElementById('login-passord').value || '';
  const huskMeg = document.getElementById('login-husk-meg').checked;
  const match = adminUsers.find(u => u.brukernavn && u.brukernavn.toLowerCase() === brukernavn.toLowerCase() && u.passord === passord);
  if(!match){
    loginFormError = 'Feil brukernavn eller passord.';
    render();
    return;
  }
  loggedInRole = match.rolle;
  isAdmin = true;
  loginFormError = '';
  if(huskMeg) saveRememberedLogin(match.rolle); else clearRememberedLogin();
  if(!dbStatusReport) runDatabaseCheck().catch(e => console.error('[runDatabaseCheck] Bakgrunnssjekk feilet', e));
  goTo('dashboard');
}
function logout(){
  loggedInRole = null;
  isAdmin = false;
  headerMenuOpen = false;
  screen = 'login';
  screenHistory = [];
  clearRememberedLogin();
  render();
}

  if(!loggedInRole){

      driverScreen = 'min-bil';
    } else {
      clearDriverLocalSession();
      driverScreen = 'velg-bil';
    }
  } else {
    // Administrasjonssiden holder ofte appen åpnest lengst (Dashboard) — kjør samme
    // opprydding her også, slik at biløkter fra en tidligere operativ dag ikke blir
    // stående i Airtable selv om ingen sjåfør åpner appen før driftskoordinator gjør det.
    ryddOppBiloktDagskille().catch(e => console.error('[ryddOppBiloktDagskille] Feilet', e));
  }
  loaded = true;
  window.subscribeLiveSync(async (key) => {
    // Kalles jevnlig (se POLL_INTERVAL_MS i storage.airtable.js — Airtable
    // har ingen sanntids-push slik Firestore hadde) for hvert av de sentrale
    // datasettene. Laster kun det ene datasettet på nytt i bakgrunnen — men
    // tegner IKKE siden på nytt dersom brukeren har et skjema åpent akkurat nå
    // (sjåførkontroll, skade, verkstedtime, bilinfo — se formInProgress()),

    // dataen brukes uansett automatisk neste gang siden tegnes på nytt av en
    // annen grunn (f.eks. når skjemaet sendes inn eller brukeren bytter side).
    await reloadOne(key);
    if(formInProgress()) return;
    render();
  });
  render();
  if(isAdmin){
    // Stille bakgrunnssjekk av Airtable-strukturen ved oppstart — varsler kun
    // (se banneret på Dashboard), oppretter ALDRI noe automatisk uten at en
    // administrator selv trykker «🔄 Synkroniser Airtable» i Innstillinger.
    runDatabaseCheck().catch(e => console.error('[runDatabaseCheck] Bakgrunnssjekk feilet', e));
  }
}

// ================= Utils =================
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const APP_TIMEZONE = 'Europe/Oslo';
// Operativt dagskille kl. 04:00 (se "Aktiv Biløkt / Min Bil") — hos oss kan arbeidsdager
// vare til 02:00–03:00, så et rent kalenderdøgn ved midnatt ville feilaktig krevd ny
// kontroll midt i et vaktskifte. Klokkeslett 00:00–03:59 Europe/Oslo regnes derfor som
// FORRIGE operative dag i hele appen — ikke bare for biløkter, men overalt "i dag"
// allerede brukes (kontrollstatus, Dashboard, Morgenvisning, rapporter osv.), siden
// isKontrollertIdag() og alt annet "i dag"-relatert allerede regnes live ut fra denne
// ene todayISO()-funksjonen. Ingen egen, parallell "operativ dag"-logikk innføres.
const OPERATIONAL_DAY_START_HOUR = 4;
function isoDateForOperationalDay(date){
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone: APP_TIMEZONE, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23'}).formatToParts(date);
  const y = Number(parts.find(p => p.type === 'year').value);
  const m = Number(parts.find(p => p.type === 'month').value);
  const d = Number(parts.find(p => p.type === 'day').value);
  const h = Number(parts.find(p => p.type === 'hour').value);
  const dt = new Date(Date.UTC(y, m - 1, d));
  if(h < OPERATIONAL_DAY_START_HOUR) dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.toISOString().slice(0, 10);
}
function todayISO(){
  return isoDateForOperationalDay(new Date());
}
function nowTimeOslo(){
  return new Intl.DateTimeFormat('nb-NO', {timeZone: APP_TIMEZONE, hour:'2-digit', minute:'2-digit', hour12:false}).format(new Date());
}
// Personlig velkomsthilsen på Dashboard, basert på klokkeslett i Europe/Oslo.
// 05:00–11:59 morgen · 12:00–17:59 dag · 18:00–04:59 kveld.
function greetingInfo(){
  const hourStr = new Intl.DateTimeFormat('nb-NO', {timeZone: APP_TIMEZONE, hour:'2-digit', hourCycle:'h23'}).format(new Date());
  const hour = parseInt(hourStr, 10);
  const sub = 'Velkommen tilbake til bilparken';
  if(hour >= 5 && hour < 12){
    return {hilsen:'God morgen', ikon:'☀️', sub, klasse:'morgen'};
  } else if(hour >= 12 && hour < 18){
    return {hilsen:'God dag', ikon:'👋', sub, klasse:'dag'};
  } else {
    return {hilsen:'God kveld', ikon:'🌙', sub, klasse:'kveld'};
  }
}
function fmt(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return '—';
  return `${m[3]}/${m[2]}/${m[1]}`;
}
// Formaterer et kronebeløp med tusenskille, f.eks. 4850 -> "4 850 kr".
function fmtKr(n){
  if(n === undefined || n === null || n === '') return '';
  return Number(n).toLocaleString('nb-NO') + ' kr';
}
// Kompakt dato uten årstall (DD/MM) — brukt i statuschips der plass er knapp.
function fmtShort(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return '—';
  return `${m[3]}/${m[2]}`;
}
function fmtDateTime(iso, tid){
  const datePart = fmt(iso);
  if(datePart === '—') return '—';
  return tid ? `${datePart} kl. ${tid}` : datePart;
}

// ---- Låst dato-/klokkeslettformat (DD/MM/ÅÅÅÅ, 24t) uavhengig av nettleser-/OS-språk ----
// Native <input type="date"/"time"> viser MM/DD/ÅÅÅÅ og AM/PM når nettleseren/OS-en er
// satt til engelsk (en-US), siden det formatet styres av nettleseren selv og ikke av
// siden. Derfor brukes vanlige tekstfelt her, med tvungen DD/MM/ÅÅÅÅ- og TT:MM-maske,
// slik at formatet blir identisk uansett hvilken maskin/nettleser man bruker.
function maskDateValue(raw){
  const digits = raw.replace(/\D/g,'').slice(0,8); // DDMMÅÅÅÅ
  let out = digits.slice(0,2);
  if(digits.length > 2) out += '/' + digits.slice(2,4);
  if(digits.length > 4) out += '/' + digits.slice(4,8);
  return out;
}
function maskTimeValue(raw){
  const digits = raw.replace(/\D/g,'').slice(0,4); // TTMM
  let out = digits.slice(0,2);
  if(digits.length > 2) out += ':' + digits.slice(2,4);
  return out;
}
// ================= Kalender (date picker) for alle datofelt =================
// Egenbygget, tema-tilpasset kalender-popup i stedet for nettleserens innebygde
// <input type="date"> — sistnevnte viser dato i enhetens lokale format (kan bli
// MM/DD/ÅÅÅÅ på enkelte enheter) og kan ikke stiles til mørkemodus. Denne komponenten
// garanterer DD/MM/ÅÅÅÅ overalt og følger appens tema automatisk. Kobles generisk til
// ALLE felt med data-kind="date" via delegert lytting, så nye datofelt arver dette
// helt av seg selv uten videre arbeid. Manuell inntasting fungerer fortsatt ved siden
// av, som en fallback.
const UKEDAGER_KORT = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
const MANEDER_NAVN = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
let datepickerTargetId = null;
let datepickerViewYear = null;
let datepickerViewMonth = null; // 0–11
let datepickerYearMenuOpen = false;

function parseDDMMYYYY(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str||'').trim());
  if(!m) return null;
  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return {y, m: mo - 1, d};
}
function openDatepicker(inputEl){
  if(!inputEl || inputEl.dataset.kind !== 'date') return;
  const parsed = parseDDMMYYYY(inputEl.value);
  const now = new Date();
  datepickerTargetId = inputEl.id;
  datepickerViewYear = parsed ? parsed.y : now.getFullYear();
  datepickerViewMonth = parsed ? parsed.m : now.getMonth();
  datepickerYearMenuOpen = false;
  renderDatepickerPopup();
}
function closeDatepicker(){
  datepickerTargetId = null;
  datepickerYearMenuOpen = false;
  const el = document.getElementById('shared-datepicker');
  if(el) el.remove();
  document.removeEventListener('mousedown', datepickerOutsideClickHandler, true);
  document.removeEventListener('keydown', datepickerKeydownHandler, true);
}
function datepickerOutsideClickHandler(e){
  const popup = document.getElementById('shared-datepicker');
  const input = datepickerTargetId ? document.getElementById(datepickerTargetId) : null;
  if(popup && !popup.contains(e.target) && e.target !== input) closeDatepicker();
}
function datepickerKeydownHandler(e){
  if(!datepickerTargetId) return;
  if(e.key === 'Escape'){ closeDatepicker(); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); datepickerShiftMonth(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); datepickerShiftMonth(1); }
}
function datepickerShiftMonth(delta){
  datepickerViewMonth += delta;
  if(datepickerViewMonth < 0){ datepickerViewMonth = 11; datepickerViewYear--; }
  else if(datepickerViewMonth > 11){ datepickerViewMonth = 0; datepickerViewYear++; }
  renderDatepickerPopup();
}
function datepickerSetYear(y){
  datepickerViewYear = y;
  datepickerYearMenuOpen = false;
  renderDatepickerPopup();
}
function datepickerSelectDay(y, m, d){
  const input = document.getElementById(datepickerTargetId);
  if(input){
    const dd = String(d).padStart(2,'0'), mm = String(m+1).padStart(2,'0');
    input.value = `${dd}/${mm}/${y}`;
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.dispatchEvent(new Event('change', {bubbles:true}));
  }
  closeDatepicker();
}
function renderDatepickerPopup(){
  const input = document.getElementById(datepickerTargetId);
  if(!input){ closeDatepicker(); return; }
  let popup = document.getElementById('shared-datepicker');
  if(!popup){
    popup = document.createElement('div');
    popup.id = 'shared-datepicker';
    popup.className = 'datepicker-popup';
    document.body.appendChild(popup);
    document.addEventListener('mousedown', datepickerOutsideClickHandler, true);
    document.addEventListener('keydown', datepickerKeydownHandler, true);
  }

  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
  const selected = parseDDMMYYYY(input.value);
  const y = datepickerViewYear, m = datepickerViewMonth;
  let startWeekday = new Date(y, m, 1).getDay();
  startWeekday = (startWeekday + 6) % 7; // mandag = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();

  const cells = [];
  for(let i = 0; i < startWeekday; i++){
    cells.push({d: daysInPrevMonth - startWeekday + 1 + i, muted:true, y: m===0?y-1:y, m: m===0?11:m-1});
  }
  for(let d = 1; d <= daysInMonth; d++) cells.push({d, muted:false, y, m});
  let nextD = 1;
  while(cells.length < 42){ cells.push({d: nextD++, muted:true, y: m===11?y+1:y, m: m===11?0:m+1}); }

  const yearOptions = [];
  for(let yy = todayY - 6; yy <= todayY + 6; yy++) yearOptions.push(yy);

  popup.innerHTML = `
    <div class="dp-header">
      <button type="button" class="dp-nav" data-dp-action="prev-month" aria-label="Forrige måned">‹</button>
      <button type="button" class="dp-month-year" data-dp-action="toggle-year">${MANEDER_NAVN[m]} ${y}</button>
      <button type="button" class="dp-nav" data-dp-action="next-month" aria-label="Neste måned">›</button>
    </div>
    ${datepickerYearMenuOpen ? `
    <div class="dp-year-menu">
      ${yearOptions.map(yy => `<button type="button" class="dp-year-opt ${yy===y?'active':''}" data-dp-year="${yy}">${yy}</button>`).join('')}
    </div>` : `
    <div class="dp-weekdays">${UKEDAGER_KORT.map(w => `<div>${w}</div>`).join('')}</div>
    <div class="dp-grid">
      ${cells.map(c => {
        const isToday = !c.muted && c.y===todayY && c.m===todayM && c.d===todayD;
        const isSelected = selected && c.y===selected.y && c.m===selected.m && c.d===selected.d;
        return `<button type="button" class="dp-day ${c.muted?'muted':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-dp-day="${c.d}" data-dp-y="${c.y}" data-dp-m="${c.m}">${c.d}</button>`;
      }).join('')}
    </div>

function daysUntil(iso){
  if(!iso) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return null;
  const [ty, tm, td] = todayISO().split('-').map(Number);
  const target = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const today = Date.UTC(ty, tm - 1, td);
  return Math.round((target - today) / 86400000);
}

  const d = daysUntil(iso);
  return d !== null && d >= 0 && d <= 7;
}
function daysSince(iso){
  const d = daysUntil(iso);
