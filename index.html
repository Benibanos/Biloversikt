// ================= scrBilkort =================
const DEKK_RETNING_LABEL = {'sommer-vinter':'Sommer → Vinter', 'vinter-sommer':'Vinter → Sommer'};
const HISTORIKK_TYPE_ORDER = ['kontroll', 'skade', 'varsellampe', 'sak', 'verksted', 'dekk', 'kostnad', 'statusendring'];
const HISTORIKK_TYPE_LABEL = {kontroll:'Kontroller', skade:'Skader', varsellampe:'Varsellamper', sak:'Aktive saker', verksted:'Verksted', dekk:'Dekk', kostnad:'Kostnader', statusendring:'Statusendringer'};
const HISTORIKK_TYPE_IKON = {kontroll:'✅', skade:'⚠️', varsellampe:'🚨', sak:'🗂️', verksted:'🔧', dekk:'🛞', kostnad:'💰', statusendring:'⛔'};
// Fase 7 — Komplett kjøretøyhistorikk: samlet, kronologisk tidslinje for én bil,
// bygget fra ALLE eksisterende datakilder (ingen egen historikk-lagring/duplisering).
// Nyeste hendelse først. Hendelser knyttet til samme sak bærer saksnummeret
// (caseId), slik at forløpet (varsellampe → sak → verksted → lukket) er synlig.
function vehicleHistorikkTidslinje(vehicleId, filterType){
  const v = vehicles.find(x => x.id === vehicleId);
  const hendelser = [];
  kontroller.filter(k => k.vehicleId === vehicleId).forEach(k => {
    hendelser.push({dato: k.dato, tid: k.tidspunkt || '', type: 'kontroll', tekst: 'Kontroll registrert' + (k.km ? ' · ' + Number(k.km).toLocaleString('nb-NO') + ' km' : ''), av: k.sjafor || ''});
  });
  damages.filter(d => d.vehicleId === vehicleId).forEach(d => {
    hendelser.push({dato: d.dato, tid: '', type: 'skade', tekst: 'Skade registrert: ' + (d.beskrivelse || ''), av: d.registrertAv || ''});
    if(d.estimertKostnad) hendelser.push({dato: d.dato, tid: '', type: 'kostnad', tekst: 'Estimert skadekostnad registrert: ' + fmtKr(d.estimertKostnad), av: ''});
  });
  varsellys.filter(w => w.vehicleId === vehicleId).forEach(w => {
    hendelser.push({dato: w.registrertDato, tid: '', type: 'varsellampe', tekst: 'Varsellampe registrert: ' + varsellysLabel(w), av: w.registrertAv || ''});
    if(w.kvittertDato) hendelser.push({dato: w.kvittertDato, tid: '', type: 'varsellampe', tekst: 'Varsellampe kvittert: ' + varsellysLabel(w), av: w.kvittertAv || ''});
  });
  aktiveSaker.filter(s => s.vehicleId === vehicleId).forEach(s => {
    hendelser.push({dato: (s.createdAt || s.reportedAt || '').slice(0, 10), tid: '', type: 'sak', tekst: 'Sak opprettet: ' + s.title, av: s.reportedBy || '', caseId: s.caseId});
    if(s.status === 'verksted-bestilt' || s.linkedVtId){
      const vt = s.linkedVtId ? verkstedtimer.find(t => t.id === s.linkedVtId) : null;
      if(vt) hendelser.push({dato: vt.dato, tid: vt.tidspunkt || '', type: 'sak', tekst: 'Verksted bestilt: ' + s.title, av: '', caseId: s.caseId});
    }
    if(s.completedAt && s.verkstedResultat) hendelser.push({dato: s.completedAt, tid: '', type: 'sak', tekst: 'Verksted fullført: ' + (SAK_RESULTAT_LABEL[s.verkstedResultat] || s.verkstedResultat) + ' — ' + s.title, av: s.resolvedBy || '', caseId: s.caseId});
    if(s.resolvedAt) hendelser.push({dato: (s.resolvedAt || '').slice(0, 10), tid: '', type: 'sak', tekst: 'Sak lukket: ' + s.title, av: s.resolvedBy || '', caseId: s.caseId});
  });
  verkstedtimer.filter(t => t.vehicleId === vehicleId).forEach(t => {
    hendelser.push({dato: t.dato, tid: t.tidspunkt || '', type: 'verksted', tekst: 'Verkstedtime: ' + (t.beskrivelse || '') + (t.verksted ? ' hos ' + t.verksted : ''), av: '', caseId: t.caseId});
    if(t.pris) hendelser.push({dato: t.dato, tid: '', type: 'kostnad', tekst: 'Verkstedkostnad registrert: ' + fmtKr(t.pris), av: ''});
  });
  dekkhistorikk.filter(d => d.vehicleId === vehicleId).forEach(d => {
    hendelser.push({dato: d.dato, tid: '', type: 'dekk', tekst: 'Dekkskifte: ' + (DEKK_RETNING_LABEL[d.retning] || d.retning), av: ''});
  });
  dekkkostnader.filter(dk => dk.vehicleId === vehicleId).forEach(dk => {
    hendelser.push({dato: dk.dato, tid: '', type: 'dekk', tekst: 'Nye dekk registrert' + (dk.kommentar ? ': ' + dk.kommentar : ''), av: ''});
    if(dk.kostnad) hendelser.push({dato: dk.dato, tid: '', type: 'kostnad', tekst: 'Dekkkostnad registrert: ' + fmtKr(dk.kostnad), av: ''});
  });
  if(v && Array.isArray(v.statusHistorikk)){
    v.statusHistorikk.forEach(h => {
      let tekst;
      if(h.handling === 'ute-av-drift') tekst = 'Markert ute av drift' + (h.arsak ? ': ' + h.arsak : '') + (h.kommentar ? ' · ' + h.kommentar : '');
      else if(h.handling === 'kontroll-slettet') tekst = 'Kontroll slettet av administrator' + (h.arsak ? ' · Årsak: ' + h.arsak : '') + (h.kommentar ? ' · ' + h.kommentar : '');
      else tekst = 'Satt tilbake i drift' + (h.kommentar ? ': ' + h.kommentar : '');
      hendelser.push({dato: h.dato, tid: '', type: 'statusendring', tekst, av: h.av || ''});
    });
  }
  let filtered = hendelser.filter(h => h.dato);
  if(filterType) filtered = filtered.filter(h => h.type === filterType);
  return filtered.sort((a, b) => (b.dato + (b.tid || '')).localeCompare(a.dato + (a.tid || '')));
}
// Prioritet 27 (Design 2.0) — Historikk-hub: flåtebred variant av tidslinjen over.
// Gjenbruker vehicleHistorikkTidslinje() direkte per bil (samme datakilder, samme
// hendelsesformer) i stedet for å bygge en parallell datainnhentingslogikk — eneste nye
// er sammenslåingen på tvers av biler og at hver hendelse merkes med vehicleId.
function flateHistorikkTidslinje(filterType, filterVehicleId){
  const vehicleListe = filterVehicleId ? vehicles.filter(x => x.id === filterVehicleId) : vehicles;
  let alle = [];
  vehicleListe.forEach(v => {
    vehicleHistorikkTidslinje(v.id).forEach(h => alle.push(Object.assign({}, h, {vehicleId: v.id})));
  });
  if(filterType) alle = alle.filter(h => h.type === filterType);
  return alle.sort((a, b) => (b.dato + (b.tid || '')).localeCompare(a.dato + (a.tid || '')));
}

          ${count !== null ? `<span class="group-count">${count}</span>` : ''}

function attachBilkortListeners(){
  const v = vehicles.find(x => x.id === currentVehicleId);
  document.getElementById('back-to-register').addEventListener('click', () => goBack('register'));
  document.getElementById('del-vehicle').addEventListener('click', () => deleteVehicle(currentVehicleId));
  document.querySelectorAll('[data-toggle-bilkort]').forEach(el => el.addEventListener('click', () => toggleBilkortSection(el.dataset.toggleBilkort)));
  document.querySelectorAll('[data-toggle-bilkort-skade]').forEach(el => el.addEventListener('click', () => toggleBilkortSkadeSub(el.dataset.toggleBilkortSkade)));
  document.querySelectorAll('[data-toggle-bilkort-historikk]').forEach(el => el.addEventListener('click', () => toggleBilkortHistorikkSub(el.dataset.toggleBilkortHistorikk)));

  // Fase 7 — Hurtighandlinger på Kjøretøyprofil (gjenbruker eksisterende skjemaer)
  const hhKontrollBtn = document.getElementById('hh-kontroll-btn');
  if(hhKontrollBtn) hhKontrollBtn.addEventListener('click', () => goToRegisterKontroll(currentVehicleId));
  const hhSkadeBtn = document.getElementById('hh-skade-btn');
  if(hhSkadeBtn) hhSkadeBtn.addEventListener('click', () => goToRegisterSkade(currentVehicleId));
  const hhVtBtn = document.getElementById('hh-vt-btn');
  if(hhVtBtn) hhVtBtn.addEventListener('click', () => goToRegisterVT(currentVehicleId));
  const hhSakerBtn = document.getElementById('hh-saker-btn');
  if(hhSakerBtn) hhSakerBtn.addEventListener('click', () => goToAktiveSakerForVehicle(currentVehicleId));

  // Fase 7 — Ute av drift
  const uadMarkerBtn = document.getElementById('uad-marker-btn');
  if(uadMarkerBtn) uadMarkerBtn.addEventListener('click', () => { showUteAvDriftForm = !showUteAvDriftForm; render(); });
  const uadMarkerLagreBtn = document.getElementById('uad-marker-lagre-btn');
  if(uadMarkerLagreBtn) uadMarkerLagreBtn.addEventListener('click', () => markerUteAvDrift(currentVehicleId));
  const uadTilbakeBtn = document.getElementById('uad-tilbake-btn');
  if(uadTilbakeBtn) uadTilbakeBtn.addEventListener('click', () => { showUteAvDriftForm = !showUteAvDriftForm; render(); });
  const uadTilbakeLagreBtn = document.getElementById('uad-tilbake-lagre-btn');
  if(uadTilbakeLagreBtn) uadTilbakeLagreBtn.addEventListener('click', () => settTilbakeIDrift(currentVehicleId));

  // Fase 7 — Historikkfilter og sakskobling (aktive saker-seksjon + tidslinje)
  const historikkFilterSelect = document.getElementById('bilkort-historikk-filter');
  if(historikkFilterSelect) historikkFilterSelect.addEventListener('change', (e) => { bilkortHistorikkFilter = e.target.value; render(); });
  document.querySelectorAll('[data-goto-sak]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); goToSakDetalj(el.dataset.gotoSak); }));

  const saveBtn = document.getElementById('save-vehicle');
  if(saveBtn) saveBtn.addEventListener('click', () => saveVehicleForm(currentVehicleId));
  const skadeBtn = document.getElementById('ny-skade-btn');
  if(skadeBtn) skadeBtn.addEventListener('click', () => goToRegisterSkade(currentVehicleId));
  const vtBtn = document.getElementById('ny-vt-btn');
  if(vtBtn) vtBtn.addEventListener('click', () => goToRegisterVT(currentVehicleId));
  document.querySelectorAll('[data-kvitter]').forEach(el => el.addEventListener('click', () => kvitterVarsellys(el.dataset.kvitter)));
  document.querySelectorAll('[data-goto-vt]').forEach(el => el.addEventListener('click', () => {
    vtFilterBil = el.dataset.gotoVt;
    goTo('verksted');
  }));

  const vp = document.getElementById('f-vehicle-photo');
  if(vp) vp.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    pendingVehiclePhoto = await resizeImage(file);
    let img = document.getElementById('vehicle-photo-preview');
    if(!img){
      img = document.createElement('img');
      img.id = 'vehicle-photo-preview';
      img.className = 'photo-preview';
      vp.parentElement.appendChild(img);
    }
    img.src = pendingVehiclePhoto; img.style.display = 'block';
  });
  if(v && v.hasPhoto){
    getPhoto('vehicle:'+v.id).then(url => {
      const img = document.getElementById('vehicle-photo-preview');
      if(img && url){ img.src = url; img.style.display = 'block'; }
    });
  }

  attachDamageCardListeners(vehicleDamages(currentVehicleId));

  const saveDekkBtn = document.getElementById('save-dekk-btn');
  if(saveDekkBtn) saveDekkBtn.addEventListener('click', () => saveDekkInfo(currentVehicleId));
  const dekkskifteBtn = document.getElementById('ny-dekkskifte-btn');
  if(dekkskifteBtn) dekkskifteBtn.addEventListener('click', () => { showAddDekkskifte = !showAddDekkskifte; render(); });
  const dekkskifteForm = document.getElementById('add-dekkskifte-form');
  if(dekkskifteForm) dekkskifteForm.addEventListener('submit', submitDekkskifte);
  const saveServiceIntervallBtn = document.getElementById('save-service-intervall-btn');
  if(saveServiceIntervallBtn) saveServiceIntervallBtn.addEventListener('click', () => saveServiceIntervall(currentVehicleId));
  const serviceBtn = document.getElementById('ny-service-btn');
  if(serviceBtn) serviceBtn.addEventListener('click', () => { showAddService = !showAddService; render(); });
  const serviceForm = document.getElementById('add-service-form');
  if(serviceForm) serviceForm.addEventListener('submit', submitService);
}

function skadeGroupedSection(itemsFiltered, openSet, toggleAttr, quickCountsFra){
  const byVehicle = new Map();
  itemsFiltered.forEach(d => {
    if(!byVehicle.has(d.vehicleId)) byVehicle.set(d.vehicleId, []);
    byVehicle.get(d.vehicleId).push(d);
  });
  const beroerteKjoretoy = sortedVehicles(vehicles.filter(v => byVehicle.has(v.id)));
  const kjentIder = new Set(vehicles.map(v => v.id));
  const foreldrelose = itemsFiltered.filter(d => !kjentIder.has(d.vehicleId));
  if(beroerteKjoretoy.length === 0 && foreldrelose.length === 0) return null;

  const grupper = KATEGORI_ORDER.filter(k => beroerteKjoretoy.some(v => v.kategori === k)).map(k => {
    const gruppeKjoretoy = beroerteKjoretoy.filter(v => v.kategori === k);
    return `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">${GRUPPE_IKON[k]} ${KATEGORI_GROUP_LABEL[k]}</div>
      <div class="acc-list">
        ${gruppeKjoretoy.map(v => {
          const dList = byVehicle.get(v.id).sort((a,b) => (b.dato||'').localeCompare(a.dato||''));
          const open = openSet.has(v.id);
          const quickCounts = quickCountsFra ? `<span class="required-hint" style="margin-right:8px;">🚨 ${quickCountsFra(v).aktive} · ✅ ${quickCountsFra(v).fikset}</span>` : '';
          return `
          <div class="acc-row ${open ? 'expanded' : ''}">
            <div class="acc-head" data-${toggleAttr}="${v.id}">
              <div class="acc-head-left"><div class="flag-name">📍 ${esc(v.bilnummer || '')} – ${esc(v.regnr)}</div></div>
              <div class="acc-head-right">${quickCounts}<span class="group-count">${dList.length} skade${dList.length===1?'':'r'}</span><span class="chevron">⌄</span></div>
            </div>
            ${open ? `<div class="acc-body"><div class="dmg-list">${dList.map(d => damageCard(d, false)).join('')}</div></div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const foreldreloseHtml = foreldrelose.length > 0 ? `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">❓ Slettet kjøretøy</div>
      <div class="dmg-list">${foreldrelose.map(d => damageCard(d, true)).join('')}</div>
    </div>` : '';
  return grupper + foreldreloseHtml;
}

// ================= scrAktiveSaker (Fase 1 — grunnmur) =================
// ================= Saksbehandling Wizard — rendering =================
// Tilnærmet, feltfri kilde-heuristikk (se strategisk foranalyse): dagens datamodell
// kan ikke 100% presist skille Aktiv Biløkt fra admin sin manuelle skaderegistrering
// (begge ender som sourceType:'auto', createdByControlId:null) — dette er bevisst
// akseptert fremfor å innføre et nytt Airtable-felt kun for visningsformål.
function sakKildeLabel(s){
  if(s.sourceType === 'manuell') return 'Registrert manuelt i Aktive Saker';
  if(s.createdByControlId) return 'Sjåførkontroll';
  if(s.caseType === 'skade') return 'Skaderegistrering';
  if(s.caseType === 'varsellampe') return 'Varsellampe';
  if(s.caseType === 'kontrollavvik') return 'Kontrollavvik';
  return SAK_TYPE_LABEL[s.caseType] || 'Ukjent';
}
// Optimalisering 9 (Steg 1-sjekkliste): "vis eksakt problem" i stedet for den generiske
// automatteksten ("Varsellampe registrert"/"Kontrollavvik registrert"). Bruker samme
// sourceId/kilde-nøkkel som allerede lagres på saken (VARSELLAMPE_LABEL/
// KONTROLLAVVIK_LABEL, samme oppslag som Min Bil/kontrollskjemaet bruker) — ingen nytt
// felt, kun en visningsberegning. Faller tilbake til sakens egen tittel for sakstyper
// uten en slik nøkkel (skade, service, manuelt opprettede saker) — disse er allerede
// spesifikke siden de er brukerskrevet fritekst.
function sakProblemLabel(s){
  if(s.caseType === 'varsellampe' && s.sourceId && s.sourceId !== 'annet' && VARSELLAMPE_LABEL[s.sourceId]){
    return VARSELLAMPE_LABEL[s.sourceId];
  }
  if(s.caseType === 'varsellampe' && s.sourceId === 'annet'){
    // Fritekst for "Annet" ligger i første historikkoppføring sin kommentar (se
    // registrerAvvikSomSak/submitKontroll) — henter ut kun selve teksten, ikke en ev.
    // tilleggskommentar som ble limt på med " · ".
    const forste = Array.isArray(s.historikk) && s.historikk.length > 0 ? s.historikk[0].kommentar || '' : '';
    const fritekst = forste.split(' · ')[0].trim();
    return fritekst || VARSELLAMPE_LABEL.annet;
  }
  if(s.caseType === 'kontrollavvik' && s.sourceId && KONTROLLAVVIK_LABEL[s.sourceId]){
    return KONTROLLAVVIK_LABEL[s.sourceId];
  }
  return s.title;
}
// Kun kortnavn (uten "REGISTRERT"/ikon) egnet til STORE BOKSTAVER i en komprimert
// overskrift — brukes kun når problemLabel kommer fra en kjent, kort konstant
// (varsellampe/kontrollavvik). Frittekst-titler (skade m.fl.) beholder normal
// tekstform i overskriften, siden hele setninger i store bokstaver er tyngre å lese.
function sakProblemLabelErKortform(s){
  return (s.caseType === 'varsellampe' && s.sourceId && s.sourceId !== 'annet' && !!VARSELLAMPE_LABEL[s.sourceId])
    || (s.caseType === 'kontrollavvik' && s.sourceId && !!KONTROLLAVVIK_LABEL[s.sourceId]);
}
// Optimalisering 9: "kort beskrivelse" — erstatter automatikkens generiske
// boilerplate-tekst ("Automatisk generert fra kontrollregistrering.") med én kort,
// spesifikk linje. Brukerskrevne beskrivelser (manuelle saker/skader) vises uendret —
// de er allerede spesifikke, ikke boilerplate.
function sakKortBeskrivelse(s){
  if(s.sourceType === 'auto'){
    return `${sakProblemLabel(s)} — ${sakKildeLabel(s)}.`;
  }
  return s.description || '';
}
// Optimalisering 9 (bevart for eldre, ikke-sammenslåtte varsellampe-saker fra før
// Prioritet 12): andre aktive varsellamper på SAMME bil, funnet via den separate
// varsellys-tabellen i stedet for sak.avvik — brukes nå kun som fallback i
// sakKortOverskrift() for eldre data uten avvik[] (se der).
function sakAndreAktiveVarsler(s){
  if(s.caseType !== 'varsellampe') return [];
  const v = sakVehicle(s);
  if(!v) return [];
  return activeVarsellysForVehicle(v.id);
}
function varsellysKortLabel(w){
  return w.type === 'annet' ? (w.annetTekst || 'Annet') : (VARSELLAMPE_LABEL[w.type] || w.type);
}
// Aktive Saker UX Cleanup / Prioritet 12: overskrift for det KOLLAPSEDE sakskortet (ikke
// Steg 1, som har sin egen — se sakWizardSteg1Html). Generalisert til å bruke
// sakAvvikListe() slik at den fungerer likt for BÅDE nye flerpunkts kontroll-saker
// (varsellampe+kontrollavvik blandet) OG eldre enkeltavvik-saker: kun ett aktivt avvik →
// vis det alene, nøyaktig 2 → "A + B", 3 eller flere → "N avvik registrert". Utførte avvik
// telles ikke med — en sak der alt gjenstående er utført viser det som står igjen.
function sakKortOverskrift(s){
  const aktive = sakAvvikAktive(s);
  if(aktive.length >= 2){
    if(aktive.length === 2) return aktive.map(a => a.label).join(' + ');
    return `${aktive.length} avvik registrert`;
  }
  // 0 eller 1 aktivt avvik i DENNE saken — for eldre varsellampe-saker (før Prioritet 12,
  // ingen avvik[]) der søsken-saker for samme kontroll-hendelse fortsatt kan ligge som
  // egne saker, bevares den tidligere kryss-sak-visningen (Optimalisering 11).
  if(s.caseType === 'varsellampe' && (!Array.isArray(s.avvik) || s.avvik.length === 0)){
    const andre = sakAndreAktiveVarsler(s);
    if(andre.length === 2) return andre.map(varsellysKortLabel).join(' + ');
    if(andre.length >= 3) return `${andre.length} varsellamper registrert`;
  }
  if(aktive.length === 1) return aktive[0].label;
  const alle = sakAvvikListe(s);
  return alle.length > 0 ? alle[0].label : sakProblemLabel(s);
}
const SAK_WIZARD_STEG_TITTEL = {1:'Saksinformasjon', 2:'Vurder sak', 3:'Fortsett saken', 4:'Fullfør saken'};
// Wizard UX Cleanup (punkt 5-7): fremdriftsindikatoren er nå en ren, ikke-klikkbar
// prikkerad (✅ for fullførte steg, • for resten) — ingen sidetall, ingen tekst, ingen
// store "1 2 3 4"-stegknapper. ✅-emojien er allerede grønn i seg selv (punkt 6), ingen
// egen fargelogikk nødvendig. Flyttet fra toppen til bunnen av wizard-boksen (se
// sakWizardHtml) — hvert steg har uansett egne, formålsrettede "← Tilbake"/"Neste →"-
// knapper i sin egen handlingsrad, så step-hopping via prikkene er bevisst fjernet.
function sakWizardProgressHtml(sakId, step){
  const dots = [1,2,3,4].map(n => n <= step ? '✅' : '•').join(' ');
  return `<div style="text-align:center;font-size:15px;letter-spacing:3px;color:var(--muted);margin-top:12px;" aria-label="Steg ${step} av 4 — ${SAK_WIZARD_STEG_TITTEL[step]}">${dots}</div>`;
}
// Steg 1 — Saksinformasjon: ren visning, ingen felt lagres her (unntak: "Marker utført"

// PROBLEM-spesifikk overskrift (ikke generisk "Varsellampe registrert") → status/

function sakWizardSteg1Html(s){

    ${andreVarsler.length > 1 ? `

    <button type="button" class="btn secondary small" id="swz-mer-toggle-${s.id}" style="justify-content:flex-start;margin-bottom:${sakWizardSteg1MerOpen ? '8px' : '12px'};">${sakWizardSteg1MerOpen ? '▲' : '▼'} Mer informasjon</button>

        ${s.updatedAt ? `<div class="ov-item"><span class="ov-label">Sist oppdatert</span><span class="ov-value">${fmt(s.updatedAt.slice(0,10))}</span></div>` : ''}

// Prioritet 12: én rad i avvik-sjekklisten på Steg 1. Aktive avvik får en direkte "Marker

function sakGroupedSection(itemsFiltered, openSet, toggleAttr){
  const byVehicle = new Map();
  itemsFiltered.forEach(s => {
    if(!byVehicle.has(s.vehicleId)) byVehicle.set(s.vehicleId, []);
    byVehicle.get(s.vehicleId).push(s);
  });
  const beroerteKjoretoy = sortedVehicles(vehicles.filter(v => byVehicle.has(v.id)));
  const kjentIder = new Set(vehicles.map(v => v.id));
  const foreldrelose = itemsFiltered.filter(s => !kjentIder.has(s.vehicleId));
  if(beroerteKjoretoy.length === 0 && foreldrelose.length === 0) return null;

  const grupper = KATEGORI_ORDER.filter(k => beroerteKjoretoy.some(v => v.kategori === k)).map(k => {
    const gruppeKjoretoy = beroerteKjoretoy.filter(v => v.kategori === k);
    return `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">${GRUPPE_IKON[k]} ${KATEGORI_GROUP_LABEL[k]}</div>
      <div class="acc-list">
        ${gruppeKjoretoy.map(v => {
          const sList = byVehicle.get(v.id).sort((a,b) => (b.reportedAt||'').localeCompare(a.reportedAt||''));
          const open = openSet.has(v.id);
          // Prioritet 12: avvik-telling ved siden av sakstallet, men KUN når det faktisk
          // finnes flere avvik enn saker på bilen (ellers er det bare en ren duplisering
          // av samme tall — f.eks. tre helt separate enkeltavvik-saker).
          const avvikTotalt = sList.reduce((sum, s) => sum + sakAvvikListe(s).length, 0);
          const avvikAktive = sList.reduce((sum, s) => sum + sakAvvikAktive(s).length, 0);
          const avvikTekst = avvikTotalt > sList.length
            ? ` · ${avvikAktive < avvikTotalt ? avvikAktive + ' aktive avvik' : avvikTotalt + ' avvik'}`
            : '';
          return `
          <div class="acc-row ${open ? 'expanded' : ''}">
            <div class="acc-head" data-${toggleAttr}="${v.id}">
              <div class="acc-head-left"><div class="flag-name">${SAK_BILSTATUS_IKON[vehicleSakStatus(v.id)]} 📍 ${esc(v.bilnummer || '')} – ${esc(v.regnr)}</div></div>
              <div class="acc-head-right"><span class="group-count">${sList.length} sak${sList.length===1?'':'er'}${avvikTekst}</span><span class="chevron">⌄</span></div>
            </div>
            ${open ? `<div class="acc-body"><div class="dmg-list">${sList.map(s => sakCard(s, false)).join('')}</div></div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const foreldreloseHtml = foreldrelose.length > 0 ? `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">❓ Slettet kjøretøy</div>
      <div class="dmg-list">${foreldrelose.map(s => sakCard(s, true)).join('')}</div>
    </div>` : '';
  return grupper + foreldreloseHtml;
}

      <input id="hist-til" type="text" inputmode="numeric" data-kind="date" placeholder="Til (DD/MM/ÅÅÅÅ)" maxlength="10" value="${historikkHubFilterDatoTil ? fmt(historikkHubFilterDatoTil) : ''}">

function attachHistorikkListeners(){
  document.getElementById('hist-back').addEventListener('click', () => goBack('dashboard'));

  if(fraEl) fraEl.addEventListener('change', () => { historikkHubFilterDatoFra = readDateInput('hist-fra'); render(); });
  const tilEl = document.getElementById('hist-til');
  if(tilEl) tilEl.addEventListener('change', () => { historikkHubFilterDatoTil = readDateInput('hist-til'); render(); });
  document.querySelectorAll('[data-goto-bilkort]').forEach(el => el.addEventListener('click', () => goTo('bilkort', el.dataset.gotoBilkort)));
}

// 5-post-taket — full liste over alt som nærmer seg: service, dekk (alders-signal, se
// CLAUDE.md — ingen egen "planlagt dekkskift-dato" finnes i appen), verkstedtimer og
// oppfølginger. Samme underliggende funksjoner som Dashboard/Kjøretøyprofil allerede
// bruker (vehicleServiceStatus/dekkAlderStatus/sakOppfolgingStatus) — ingen ny
// forretningslogikk, kun aggregering uten cap.
function flatePlanleggingData(periodeDager){
  const d = new Date(); d.setDate(d.getDate() + periodeDager);
  const grense = d.toISOString().slice(0, 10);
  const service = vehicles.map(v => ({v, status: vehicleServiceStatus(v)})).filter(x => x.status.status === 'snart' || x.status.status === 'forfalt')
    .sort((a,b) => (a.status.gjenstaende||0) - (b.status.gjenstaende||0));
  const dekk = vehicles.map(v => {
    const sesong = v.dekk === 'vinter' ? 'vinter' : 'sommer';
    const dot = sesong === 'vinter' ? v.vinterdekkDot : v.sommerdekkDot;
    const st = dekkAlderStatus(dot);
    return {v, status: st};
  }).filter(x => x.status && (x.status.status === 'aldring' || x.status.status === 'gammel'))
    .sort((a,b) => (a.status.status === 'gammel' ? 0 : 1) - (b.status.status === 'gammel' ? 0 : 1));
  const verksted = verkstedtimer.filter(t => t.dato >= todayISO() && t.dato <= grense)
    .sort((a,b) => (a.dato+((a.tidspunkt)||'')).localeCompare(b.dato+((b.tidspunkt)||'')));
  const oppfolging = aktiveSaker.filter(s => sakOppfolgingStatus(s) === 'snart' && s.followUpDate <= grense)
    .sort((a,b) => (a.followUpDate||'').localeCompare(b.followUpDate||''));
  // Regel 6 (Prioritet 27 — Design 2.0): EU-kontroll er nå en av Planleggings fem
  // hjemkategorier. Gjenbruker vehicleEuKontrollStatus() uendret.
  const euKontroll = vehicles.map(v => ({v, status: vehicleEuKontrollStatus(v)})).filter(x => x.status.status === 'snart' || x.status.status === 'forfalt')
    .sort((a,b) => (a.status.gjenstaende||0) - (b.status.gjenstaende||0));
  return {service, dekk, verksted, oppfolging, euKontroll};
}
function renderPlanlegging(){
  const data = flatePlanleggingData(planleggingPeriodeDager);
  const totalt = data.service.length + data.dekk.length + data.verksted.length + data.oppfolging.length + data.euKontroll.length;
  const kolonneHtml = (tittel, ikon, liste, radHtml) => `
    <div class="panel" style="margin-bottom:16px;">
      <div class="ov-label" style="margin-bottom:10px;">${ikon} ${tittel} (${liste.length})</div>
      ${liste.length === 0 ? `<div class="empty-note">Ingen kommende.</div>` : `<ul class="dmg-simple-list">${liste.map(radHtml).join('')}</ul>`}
    </div>`;
  return `
    <div class="backrow"><button class="backbtn" id="plan-back">← Tilbake</button></div>
    <h2 style="font-size:19px;margin-bottom:6px;">📅 Planlegging</h2>
    <div class="required-hint" style="margin-bottom:16px;">Alt som krever oppmerksomhet de neste dagene/ukene — ${totalt} totalt.</div>

    <div class="filters-row" style="margin-bottom:16px;">
      <select id="plan-periode">
        <option value="7" ${planleggingPeriodeDager===7?'selected':''}>Neste 7 dager</option>
        <option value="30" ${planleggingPeriodeDager===30?'selected':''}>Neste 30 dager</option>
        <option value="90" ${planleggingPeriodeDager===90?'selected':''}>Neste 90 dager</option>
      </select>
    </div>

    <div class="planlegging-grid">
      ${kolonneHtml('Service', '🔧', data.service, x => `<li style="cursor:pointer;" data-goto-bilkort="${x.v.id}"><span class="dmg-simple-main">${esc(vehicleLabel(x.v))} · ${x.status.ikon} ${x.status.tekst}</span></li>`)}
      ${kolonneHtml('Dekk', '🛞', data.dekk, x => `<li style="cursor:pointer;" data-goto-bilkort="${x.v.id}"><span class="dmg-simple-main">${esc(vehicleLabel(x.v))} · ${x.status.ikon} ${x.status.tekst}</span></li>`)}
      ${kolonneHtml('Verksted', '🔧', data.verksted, t => { const tv = vtVehicle(t); return `<li style="cursor:pointer;" ${t.sakId ? `data-goto-sak="${t.sakId}"` : `data-goto-vt="${t.id}"`}><span class="dmg-simple-main">${tv ? esc(vehicleLabel(tv)) : 'Slettet kjøretøy'} · ${fmt(t.dato)}${t.tidspunkt ? ' kl. '+t.tidspunkt : ''}</span></li>`; })}
      ${kolonneHtml('Oppfølging', '📋', data.oppfolging, s => { const sv = sakVehicle(s); return `<li style="cursor:pointer;" data-goto-sak="${s.id}"><span class="dmg-simple-main">${sv ? esc(vehicleLabel(sv)) : 'Slettet kjøretøy'} · ${esc(sakKortOverskrift(s))} · ${fmt(s.followUpDate)}</span></li>`; })}
      ${kolonneHtml('EU-kontroll', '🚦', data.euKontroll, x => `<li style="cursor:pointer;" data-goto-bilkort="${x.v.id}"><span class="dmg-simple-main">${esc(vehicleLabel(x.v))} · ${x.status.ikon} ${x.status.tekst}</span></li>`)}
    </div>
  `;
}
function attachPlanleggingListeners(){
  document.getElementById('plan-back').addEventListener('click', () => goBack('dashboard'));
  document.getElementById('plan-periode').addEventListener('change', e => { planleggingPeriodeDager = Number(e.target.value); render(); });
  document.querySelectorAll('[data-goto-bilkort]').forEach(el => el.addEventListener('click', () => goTo('bilkort', el.dataset.gotoBilkort)));
  document.querySelectorAll('[data-goto-sak]').forEach(el => el.addEventListener('click', () => goToSakDetalj(el.dataset.gotoSak)));
  document.querySelectorAll('[data-goto-vt]').forEach(el => el.addEventListener('click', () => {
    const vt = verkstedtimer.find(t => t.id === el.dataset.gotoVt);
    if(!vt) return;
    vtFilterBil = vt.vehicleId; vtFilterVerksted = ''; vtFilterType = ''; vtFilterPeriode = ''; vtFilterSakStatus = '';
    showVtFilterMeny = false;
    vtOversiktOpenVehicles = new Set([vt.vehicleId]);
    goTo('verksted');
  }));
}

function renderAktiveSaker(){
  if(oppdaterVerkstedStatuser()) saveAktiveSaker();
  const visning = aktiveSaker.filter(s => {
    if(sakFilterBil && s.vehicleId !== sakFilterBil) return false;
    if(sakFilterType && s.caseType !== sakFilterType) return false;
    if(sakFilterStatus && s.status !== sakFilterStatus) return false;
    if(sakFilterPrioritet && s.priority !== sakFilterPrioritet) return false;
    if(sakFilterKunApne && !sakErApen(s)) return false;
    if(sakFilterKreverHandling && !sakKreverHandling(s)) return false;
    if(sakFilterOppfolging){
      const op = sakOppfolgingStatus(s);
      if(sakFilterOppfolging === 'idag' && op !== 'idag') return false;
      if(sakFilterOppfolging === 'forfalt' && op !== 'forfalt') return false;
      if(sakFilterOppfolging === 'ingen-dato' && op !== 'mangler') return false;
      if(sakFilterOppfolging === '7dager'){
        if(!s.followUpDate) return false;
        const d = daysUntil(s.followUpDate);
        if(d === null || d < 0 || d > 7) return false;
      }
    }
    return true;
  });
  const antallAktiveFiltre = [sakFilterBil, sakFilterType, sakFilterStatus, sakFilterPrioritet, sakFilterOppfolging].filter(Boolean).length + (sakFilterKunApne?1:0) + (sakFilterKreverHandling?1:0);
  const oversiktBody = sakGroupedSection(visning, sakOversiktOpenVehicles, 'toggle-sako-vehicle');

  return `
    <div class="backrow">
      <button class="backbtn" id="sak-back">← Tilbake</button>
      <button class="btn small" id="add-sak-btn" style="margin-left:auto;">${showAddSak ? 'Avbryt' : '+ Ny sak'}</button>
    </div>
    <h2 style="font-size:19px;margin-bottom:16px;">🗂️ Aktive Saker</h2>

    <div class="toolbar">
      <div class="count">${visning.length} / ${aktiveSaker.length} aktive saker</div>
      <button class="btn secondary small" id="sak-filter-toggle-btn">🔽 Filtrer${antallAktiveFiltre > 0 ? ` (${antallAktiveFiltre})` : ''}</button>
    </div>

    ${showSakFilterMeny ? `
    <div class="panel" style="margin-bottom:16px;">
      <div class="row2">
        <div class="field"><label>🚐 Bil</label>
          <select id="sak-f-bil">
            <option value="">Alle biler</option>
            ${vehicleOptions(sakFilterBil)}
          </select>
        </div>
        <div class="field"><label>📁 Sakstype</label>
          <select id="sak-f-type">
            <option value="">Alle sakstyper</option>
            ${SAK_TYPE_ORDER.map(t => `<option value="${t}" ${sakFilterType===t?'selected':''}>${SAK_TYPE_IKON[t]} ${SAK_TYPE_LABEL[t]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>📋 Status</label>
          <select id="sak-f-status">
            <option value="">Alle statuser</option>
            ${SAK_STATUS_ORDER.map(st => `<option value="${st}" ${sakFilterStatus===st?'selected':''}>${SAK_STATUS_LABEL[st]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>🎯 Prioritet</label>
          <select id="sak-f-prioritet">
            <option value="">Alle prioriteter</option>
            ${SAK_PRIORITET_ORDER.map(p => `<option value="${p}" ${sakFilterPrioritet===p?'selected':''}>${SAK_PRIORITET_IKON[p]} ${SAK_PRIORITET_LABEL[p]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>📅 Oppfølging</label>
        <select id="sak-f-oppfolging">
          <option value="">Alle</option>
          <option value="idag" ${sakFilterOppfolging==='idag'?'selected':''}>🟠 Oppfølging i dag</option>
          <option value="forfalt" ${sakFilterOppfolging==='forfalt'?'selected':''}>🔴 Forfalt</option>
          <option value="7dager" ${sakFilterOppfolging==='7dager'?'selected':''}>Neste 7 dager</option>
          <option value="ingen-dato" ${sakFilterOppfolging==='ingen-dato'?'selected':''}>⚪ Ingen oppfølgingsdato</option>
        </select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13.5px;font-weight:600;cursor:pointer;">
        <input type="checkbox" id="sak-f-krever-handling" style="width:20px;height:20px;flex-shrink:0;" ${sakFilterKreverHandling?'checked':''}>
        Krever handling
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:0;font-size:13.5px;font-weight:600;cursor:pointer;">
        <input type="checkbox" id="sak-f-kun-apne" style="width:20px;height:20px;flex-shrink:0;" ${sakFilterKunApne?'checked':''}>
        Kun åpne saker
      </label>
    </div>` : ''}

    ${showAddSak ? `
    <form class="panel" id="add-sak-form">
      <h3>Ny sak</h3>
      <div class="row2">
        <div class="field"><label>Bil</label>
          <select id="sak-vehicle" required>
            <option value="">Velg bil...</option>
            ${vehicleOptions(sakPrefillVehicleId)}
          </select>
        </div>
        <div class="field"><label>Sakstype</label>
          <select id="sak-type" required>
            ${SAK_TYPE_ORDER.map(t => `<option value="${t}">${SAK_TYPE_IKON[t]} ${SAK_TYPE_LABEL[t]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:10px;"><label>Tittel</label><input id="sak-tittel" type="text" placeholder="F.eks. Motorlampe lyser" required></div>
      <div class="field" style="margin-bottom:10px;"><label>Beskrivelse</label><textarea id="sak-beskrivelse" placeholder="Valgfritt"></textarea></div>
      <div class="row2">
        <div class="field"><label>Prioritet</label>
          <select id="sak-prioritet">
            ${SAK_PRIORITET_ORDER.map(p => `<option value="${p}" ${p==='normal'?'selected':''}>${SAK_PRIORITET_IKON[p]} ${SAK_PRIORITET_LABEL[p]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Oppfølgingsdato</label><input id="sak-oppfolgingsdato" type="text" inputmode="numeric" data-kind="date" placeholder="DD/MM/ÅÅÅÅ" maxlength="10"></div>
      </div>
      <div class="field" style="margin-bottom:6px;"><label>Neste handling</label><input id="sak-neste-handling" type="text" placeholder="Valgfritt"></div>
      <div class="form-msg" id="sak-msg"></div>
      <div class="panel-actions"><button class="btn" type="submit">Lagre</button></div>
    </form>` : ''}

    ${oversiktBody === null ? `<div class="empty-note">Ingen saker${antallAktiveFiltre > 0 ? ' med gjeldende filter' : ' registrert ennå'}.</div>` : oversiktBody}
  `;
}
function attachAktiveSakerListeners(){
  document.getElementById('sak-back').addEventListener('click', () => goBack());
  document.getElementById('sak-filter-toggle-btn').addEventListener('click', () => {
    showSakFilterMeny = !showSakFilterMeny;
    render();
  });
  const fBil = document.getElementById('sak-f-bil');
  if(fBil) fBil.addEventListener('change', e => { sakFilterBil = e.target.value; render(); });
  const fType = document.getElementById('sak-f-type');
  if(fType) fType.addEventListener('change', e => { sakFilterType = e.target.value; render(); });
  const fStatus = document.getElementById('sak-f-status');
  if(fStatus) fStatus.addEventListener('change', e => { sakFilterStatus = e.target.value; render(); });
  const fPrioritet = document.getElementById('sak-f-prioritet');
  if(fPrioritet) fPrioritet.addEventListener('change', e => { sakFilterPrioritet = e.target.value; render(); });
  const fOppfolging = document.getElementById('sak-f-oppfolging');
  if(fOppfolging) fOppfolging.addEventListener('change', e => { sakFilterOppfolging = e.target.value; render(); });
  const fKreverHandling = document.getElementById('sak-f-krever-handling');
  if(fKreverHandling) fKreverHandling.addEventListener('change', e => { sakFilterKreverHandling = e.target.checked; render(); });
  const fKunApne = document.getElementById('sak-f-kun-apne');
  if(fKunApne) fKunApne.addEventListener('change', e => { sakFilterKunApne = e.target.checked; render(); });
  document.getElementById('add-sak-btn').addEventListener('click', () => {
    showAddSak = !showAddSak;
    if(!showAddSak) sakPrefillVehicleId = '';
    render();
  });
  const f = document.getElementById('add-sak-form');
  if(f) f.addEventListener('submit', submitAddSak);
  document.querySelectorAll('[data-toggle-sako-vehicle]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.toggleSakoVehicle;
    if(sakOversiktOpenVehicles.has(id)) sakOversiktOpenVehicles.delete(id); else sakOversiktOpenVehicles.add(id);
    render();
  }));
  document.querySelectorAll('[data-toggle-edit-sak]').forEach(el => el.addEventListener('click', () => toggleEditSak(el.dataset.toggleEditSak)));

  // ---- Saksbehandling Wizard ----
  document.querySelectorAll('[data-goto-wizard-steg]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const [sakId, steg] = el.dataset.gotoWizardSteg.split(':');
    sakWizardStep = Number(steg);
    sakWizardVtOpen = false; sakWizardOppfolgingOpen = false; sakWizardKommentarOpen = false;
    render();
  }));
  // Prioritet 12 — Steg 1: "Marker utført" på ett enkelt avvik i en flerpunkts sak, uten
  // å måtte gå via verksted. Generisk querySelectorAll (ikke per-sak-loopen under) siden
  // det kan finnes flere slike knapper — én per aktivt avvik — i samme sak samtidig.
  document.querySelectorAll('[data-marker-avvik-utfort]').forEach(el => el.addEventListener('click', async (e) => {
    e.stopPropagation();
    const [sakId, avvikId] = el.dataset.markerAvvikUtfort.split(':');
    markerAvvikUtfort(sakId, avvikId);
    await saveAktiveSaker();
    render();
  }));
  aktiveSaker.forEach(s => {
    const delBtn = document.getElementById('swz-delete-'+s.id);
    if(delBtn) delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteSak(s.id); });
    const reapneBtn = document.getElementById('swz-reapne-'+s.id);
    if(reapneBtn) reapneBtn.addEventListener('click', (e) => { e.stopPropagation(); reapneSak(s.id); });

    // Steg 1 — "Mer informasjon" (metadata skjult som standard, se Optimalisering 9)
    const merToggleBtn = document.getElementById('swz-mer-toggle-'+s.id);
    if(merToggleBtn) merToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sakWizardSteg1MerOpen = !sakWizardSteg1MerOpen;
      render();
    });

    // Steg 2 — Vurder sak
    const vurderingLagreBtn = document.getElementById('swz-vurdering-lagre-'+s.id);
    if(vurderingLagreBtn) vurderingLagreBtn.addEventListener('click', (e) => { e.stopPropagation(); submitSakWizardVurdering(s.id); });

    // Steg 3 — Fortsett saken (tre hurtighandlinger)
    const vtBtn = document.getElementById('swz-vt-btn-'+s.id);
    if(vtBtn) vtBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sakWizardVtOpen = !sakWizardVtOpen;
      sakWizardOppfolgingOpen = false; sakWizardKommentarOpen = false;
      vtPrefillSakId = s.id;
      render();
    });
    const oppfBtn = document.getElementById('swz-oppf-btn-'+s.id);
    if(oppfBtn) oppfBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sakWizardOppfolgingOpen = !sakWizardOppfolgingOpen;
      sakWizardVtOpen = false; sakWizardKommentarOpen = false;
      render();
    });
    const oppfLagreBtn = document.getElementById('swz-oppf-lagre-'+s.id);
    if(oppfLagreBtn) oppfLagreBtn.addEventListener('click', (e) => { e.stopPropagation(); submitSakWizardOppfolging(s.id); });
    const kommentarBtn = document.getElementById('swz-kommentar-btn-'+s.id);
    if(kommentarBtn) kommentarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sakWizardKommentarOpen = !sakWizardKommentarOpen;
      sakWizardVtOpen = false; sakWizardOppfolgingOpen = false;
      render();
    });
    const kommentarLagreBtn = document.getElementById('swz-kommentar-lagre-'+s.id);
    if(kommentarLagreBtn) kommentarLagreBtn.addEventListener('click', (e) => { e.stopPropagation(); submitSakWizardKommentar(s.id); });

    // Steg 4 — Fullfør saken
    const kreverAvsettingSelect = document.getElementById('swz-krever-avsetting-'+s.id);
    if(kreverAvsettingSelect) kreverAvsettingSelect.addEventListener('change', (e) => {
      e.stopPropagation();
      s.requiresProvision = kreverAvsettingSelect.value === 'ja';
      render();
    });
    const lagreUtenLukkBtn = document.getElementById('swz-lagre-uten-lukk-'+s.id);
    if(lagreUtenLukkBtn) lagreUtenLukkBtn.addEventListener('click', (e) => { e.stopPropagation(); submitSakWizardFullfor(s.id, false); });
    const lukkBtn = document.getElementById('swz-lukk-'+s.id);
    if(lukkBtn) lukkBtn.addEventListener('click', (e) => { e.stopPropagation(); submitSakWizardFullfor(s.id, true); });
  });
  // Inline verkstedtime-skjemaet i Steg 3 gjenbruker det eksisterende add-vt-form/
  // submitAddVT() helt uendret (se sakWizardVtFormHtml).
  const inlineVtForm = document.getElementById('add-vt-form');
  if(inlineVtForm) inlineVtForm.addEventListener('submit', submitAddVT);
  document.querySelectorAll('[data-goto-vt]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const vt = verkstedtimer.find(t => t.id === el.dataset.gotoVt);
    if(!vt) return;
    vtFilterBil = vt.vehicleId; vtFilterVerksted = ''; vtFilterType = ''; vtFilterPeriode = ''; vtFilterSakStatus = '';
    showVtFilterMeny = false;
    vtOversiktOpenVehicles = new Set([vt.vehicleId]);
    goTo('verksted');
  }));
}


function verkstedSelectOptions(selected){
  return verksteder
    .slice()
    .sort((a,b) => a.navn.localeCompare(b.navn, 'nb'))
    .map(w => `<option value="${esc(w.navn)}" ${w.navn===selected?'selected':''}>${esc(w.navn)}</option>`)
    .join('');
}

function verkstedGroupedSection(itemsFiltered, openSet, toggleAttr, nextId){
  const byVehicle = new Map();
  itemsFiltered.forEach(t => {
    if(!byVehicle.has(t.vehicleId)) byVehicle.set(t.vehicleId, []);
    byVehicle.get(t.vehicleId).push(t);
  });
  const beroerteKjoretoy = sortedVehicles(vehicles.filter(v => byVehicle.has(v.id)));
  const kjentIder = new Set(vehicles.map(v => v.id));
  const foreldrelose = itemsFiltered.filter(t => !kjentIder.has(t.vehicleId));
  if(beroerteKjoretoy.length === 0 && foreldrelose.length === 0) return null;

  const today = todayISO();
  const grupper = KATEGORI_ORDER.filter(k => beroerteKjoretoy.some(v => v.kategori === k)).map(k => {
    const gruppeKjoretoy = beroerteKjoretoy.filter(v => v.kategori === k);
    return `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">${GRUPPE_IKON[k]} ${KATEGORI_GROUP_LABEL[k]}</div>
      <div class="acc-list">
        ${gruppeKjoretoy.map(v => {
          const tList = byVehicle.get(v.id).sort((a,b) => (a.dato+((a.tidspunkt)||'')).localeCompare(b.dato+((b.tidspunkt)||'')));
          const open = openSet.has(v.id);
          return `
          <div class="acc-row ${open ? 'expanded' : ''}">
            <div class="acc-head" data-${toggleAttr}="${v.id}">
              <div class="acc-head-left">
                <div class="flag-name">📍 ${esc(v.bilnummer || '')} – ${esc(v.regnr)}</div>
                <div class="flag-reason">${tList.length} verkstedregistrering${tList.length===1?'':'er'}</div>
              </div>
              <div class="acc-head-right"><span class="chevron">⌄</span></div>
            </div>
            ${open ? `<div class="acc-body"><div class="vt-list">${tList.map(t => vtCard(t, t.dato >= today, t.id === nextId)).join('')}</div></div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  const foreldreloseHtml = foreldrelose.length > 0 ? `
    <div style="margin-bottom:22px;">
      <div class="group-card-title" style="margin-bottom:10px;">❓ Slettet kjøretøy</div>
      <div class="vt-list">${foreldrelose.map(t => vtCard(t, t.dato >= today, t.id === nextId)).join('')}</div>
    </div>` : '';

  return `
    <div class="acc-row ${vtGrupperApen ? 'expanded' : ''}" style="margin-bottom:16px;">
      <div class="acc-head" data-toggle-vt-grupper>

      </div>
      ${vtGrupperApen ? `<div class="acc-body">${grupper}${foreldreloseHtml}</div>` : ''}
    </div>
  `;
}
function filterByPeriode(list, periode){
  const today = todayISO();
  if(periode === '7dager') return list.filter(t => t.dato >= isoDaysAgo(6) && t.dato <= today);
  if(periode === '30dager') return list.filter(t => t.dato >= isoDaysAgo(29) && t.dato <= today);
  if(periode === 'maned') return list.filter(t => t.dato && t.dato.startsWith(today.slice(0,7)));
  if(periode === 'ar') return list.filter(t => t.dato && t.dato.startsWith(today.slice(0,4)));
  return list;
}
function getFilteredVerkstedtimer(){
  const filtered = verkstedtimer.filter(t => {
    if(vtFilterBil && t.vehicleId !== vtFilterBil) return false;
    if(vtFilterVerksted && t.verksted !== vtFilterVerksted) return false;
    if(vtFilterSakStatus){
      const linkedSak = t.sakId ? aktiveSaker.find(s => s.id === t.sakId) : null;
      if(vtFilterSakStatus === 'apen' && (!linkedSak || !sakErApen(linkedSak))) return false;
      if(vtFilterSakStatus === 'lukket' && (!linkedSak || sakErApen(linkedSak))) return false;
    }
    return true;
  });
  const today = todayISO();
  let visning = filtered;
  if(vtFilterType === 'kommende') visning = filtered.filter(t => t.dato >= today);
  else if(vtFilterType === 'tidligere') visning = filtered.filter(t => t.dato < today);
  return filterByPeriode(visning, vtFilterPeriode);
}

// ================= scrKostnadsoversikt (Fase 4) =================
// Eneste side som håndterer kostnader og avsetting. Samler data fra tre kilder
// til én enhetlig liste av "kostnadsposter":
//  1) Aktive Saker med estimatedCost/actualCost — hovedkilden fremover, siden
//     Fase 2 auto-oppretter en sak for hver skade/varsellampe/kontrollavvik.
//  2) Verkstedtimer UTEN tilknyttet sak (sakId tom) — historiske/frittstående
//     verkstedregistreringer som aldri har gått via en sak.
//  3) Dekkkostnader (har ingen sak-konsept ennå) og "foreldreløse" skader uten
//     en tilhørende sak (kun aktuelt for data fra før Fase 2/3).
// Dette unngår dobbelttelling samtidig som ingenting historisk blir usynlig.
function getKostnadsposter(){
  const poster = [];
  aktiveSaker.forEach(s => {
    const kilde = s.caseType === 'skade' ? 'skade' : (s.caseType === 'dekk' ? 'dekk' : (s.caseType === 'annet' ? 'annet' : 'verksted'));
    poster.push({
      id: 'sak:'+s.id, sakId: s.id, vehicleId: s.vehicleId, dato: s.reportedAt,
      kilde, caseType: s.caseType, tittel: s.title,
      estimert: (s.estimatedCost !== undefined && s.estimatedCost !== null) ? Number(s.estimatedCost) : null,
      faktisk: (s.actualCost !== undefined && s.actualCost !== null) ? Number(s.actualCost) : null,
      sakStatus: sakErApen(s) ? 'apen' : 'lukket',
      requiresProvision: !!s.requiresProvision,
      provisionAmount: s.provisionAmount !== undefined && s.provisionAmount !== null ? Number(s.provisionAmount) : null,
      provisionMonth: s.provisionMonth || null
    });
  });
  verkstedtimer.filter(t => !t.sakId).forEach(t => {
    poster.push({
      id: 'vt:'+t.id, sakId: null, vehicleId: t.vehicleId, dato: t.dato,
      kilde: 'verksted', caseType: null, tittel: t.beskrivelse || t.verksted || 'Verkstedtime',
      estimert: null, faktisk: (t.pris !== undefined && t.pris !== null && t.pris !== '') ? Number(t.pris) : null,
      sakStatus: null, requiresProvision: false, provisionAmount: null, provisionMonth: null
    });
  });
  dekkkostnader.forEach(dk => {
    poster.push({
      id: 'dekk:'+dk.id, sakId: null, vehicleId: dk.vehicleId, dato: dk.dato,
      kilde: 'dekk', caseType: null, tittel: dk.kommentar || 'Dekk',
      estimert: null, faktisk: (dk.kostnad !== undefined && dk.kostnad !== null) ? Number(dk.kostnad) : null,
      sakStatus: null, requiresProvision: false, provisionAmount: null, provisionMonth: null
    });
  });
  const sakSkadeIder = new Set(aktiveSaker.filter(s => s.caseType === 'skade').map(s => s.sourceId));
  damages.filter(d => d.estimertKostnad && !sakSkadeIder.has(d.id)).forEach(d => {
    poster.push({
      id: 'skade:'+d.id, sakId: null, vehicleId: d.vehicleId, dato: d.dato,
      kilde: 'skade', caseType: null, tittel: d.beskrivelse || 'Skade',
      estimert: null, faktisk: Number(d.estimertKostnad),
      sakStatus: d.status === 'utbedret' ? 'lukket' : 'apen', requiresProvision: false, provisionAmount: null, provisionMonth: null
    });
  });
  return poster;
}
function bestKostnad(post){
  if(post.faktisk !== null && post.faktisk !== undefined) return post.faktisk;
  if(post.estimert !== null && post.estimert !== undefined) return post.estimert;
  return 0;
}
function filteredKostnadsposter(){
  return getKostnadsposter().filter(p => {
    if(kostFilterBil && p.vehicleId !== kostFilterBil) return false;
    if(kostFilterGruppe){
      const v = vehicles.find(x => x.id === p.vehicleId);
      if(!v || v.kategori !== kostFilterGruppe) return false;
    }
    if(kostFilterType && p.caseType !== kostFilterType) return false;
    if(kostFilterKilde && p.kilde !== kostFilterKilde) return false;
    if(kostFilterSakStatus && p.sakStatus !== kostFilterSakStatus) return false;
    if(kostFilterKunAvsettinger && !p.requiresProvision) return false;
    if((kostFilterManed || kostFilterAr) && p.dato){
      const [ar, maned] = p.dato.split('-');
      if(kostFilterAr && ar !== kostFilterAr) return false;
      if(kostFilterManed && maned !== kostFilterManed) return false;
    } else if(kostFilterManed || kostFilterAr){
      return false;
    }
    return true;
  });
}
function exportKostnadExcel(){
  const poster = filteredKostnadsposter().slice().sort((a,b) => (a.dato||'').localeCompare(b.dato||''));
  const header = ['Bil','Sakstype','Status','Estimert kostnad','Faktisk kostnad','Avsetting','Måned','Dato'];
  const rows = poster.map(p => {
    const v = vehicles.find(x => x.id === p.vehicleId);
    return [
      v ? esc(vehicleLabel(v)) : 'Slettet kjøretøy',
      p.caseType ? (SAK_TYPE_LABEL[p.caseType] || p.caseType) : (KOST_KILDE_LABEL[p.kilde] || p.kilde),
      p.sakStatus ? (p.sakStatus === 'apen' ? 'Åpen' : 'Lukket') : '',
      p.estimert !== null ? Number(p.estimert) : '',
      p.faktisk !== null ? Number(p.faktisk) : '',
      p.requiresProvision ? fmtKr(p.provisionAmount) : '',
      p.provisionMonth || '',
      fmt(p.dato)
    ];
  });
  const totalSum = poster.reduce((s,p) => s + bestKostnad(p), 0);
  const summaryRow = new Array(8).fill('');
  summaryRow[2] = 'Totale kostnader:';
  summaryRow[4] = totalSum;
  const aoa = [header, ...rows, new Array(8).fill(''), summaryRow];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kostnadsoversikt');
  XLSX.writeFile(wb, 'Kostnadsoversikt_Eksport.xlsx');
}
const KOST_KILDE_LABEL = {verksted:'Verksted', skade:'Skade', dekk:'Dekk', annet:'Annet'};

}

// ================= scrRapporter (Fase 8 — Rapportering og Ledelsesoversikt) =================
// Viktig prinsipp: rapportene er rene VISNINGER av eksisterende data (Aktive Saker,
// Kontroller, Verksted, Skader, Kostnader, Bilstatus) — ingen egne rapporttabeller,
// ingen parallelle datastrukturer, og det operative Dashboardet er urørt.
const RAPPORT_ORDER = ['kontroll', 'bilpark', 'verksted', 'avvik', 'bilhelse', 'kostnad'];
const RAPPORT_LABEL = {kontroll:'Kontrollrapport', bilpark:'Bilparkrapport', verksted:'Verkstedrapport', avvik:'Avviksrapport', bilhelse:'Bilhelserapport', kostnad:'Kostnadsrapport', maned:'Månedsrapport'};
const RAPPORT_IKON = {kontroll:'📋', bilpark:'🚗', verksted:'🔧', avvik:'🚨', bilhelse:'📈', kostnad:'💰', maned:'🗓️'};
const RAPPORT_PERIODE_LABEL = {'':'Alle', 'denne-maned':'Denne måneden', 'forrige-maned':'Forrige måned', 'dette-aret':'Dette året'};

function goToRapport(type){
  rapportType = type;
  showRapportFilterMeny = false;
  goTo('rapporter');
}
// Periodefilteret regnes ut relativt til i dag, i stedet for en måned/år-nedtrekksmeny
// per rapport — enklere å bruke på mobil og dekker "Periode"-kravet på alle rapportene.
function rapportPeriodeRange(periode){
  const today = todayISO();
  const [ty, tm] = today.split('-').map(Number);
  if(periode === 'denne-maned') return {fra: `${ty}-${String(tm).padStart(2,'0')}-01`, til: today};
  if(periode === 'forrige-maned'){
    let fy = ty, fm = tm - 1;
    if(fm < 1){ fm = 12; fy -= 1; }
    const sisteDag = new Date(Date.UTC(fy, fm, 0)).getUTCDate();
    return {fra: `${fy}-${String(fm).padStart(2,'0')}-01`, til: `${fy}-${String(fm).padStart(2,'0')}-${String(sisteDag).padStart(2,'0')}`};
  }
  if(periode === 'dette-aret') return {fra: `${ty}-01-01`, til: today};
  return null;
}
function datoInnenfor(dato, range){
  if(!range) return true;
  if(!dato) return false;
  return dato >= range.fra && dato <= range.til;
}
function rapportVehicleMatch(vehicleId){
  if(rapportFilterBil && vehicleId !== rapportFilterBil) return false;
  if(rapportFilterGruppe){
    const v = vehicles.find(x => x.id === vehicleId);
    if(!v || v.kategori !== rapportFilterGruppe) return false;
  }
  return true;
}
function rapportRelevanteBiler(){ return vehicles.filter(v => rapportVehicleMatch(v.id)); }

function rapportKontrollData(){
  const range = rapportPeriodeRange(rapportFilterPeriode);
  const relevanteBiler = rapportRelevanteBiler();
  const filtered = kontroller.filter(k => rapportVehicleMatch(k.vehicleId) && datoInnenfor(k.dato, range));
  const bilerKontrollert = new Set(filtered.map(k => k.vehicleId));
  const kontrollgrad = relevanteBiler.length > 0 ? Math.round((bilerKontrollert.size / relevanteBiler.length) * 100) : 0;
  const perBil = relevanteBiler.map(v => ({v, antall: filtered.filter(k => k.vehicleId === v.id).length})).sort((a,b) => b.antall - a.antall);
  const perManed = {};
  filtered.forEach(k => { const m = (k.dato||'').slice(0,7); if(m) perManed[m] = (perManed[m]||0) + 1; });
  const perManedSortert = Object.entries(perManed).sort((a,b) => b[0].localeCompare(a[0]));
  return {antall: filtered.length, kontrollgrad, manglende: relevanteBiler.length - bilerKontrollert.size, totalBiler: relevanteBiler.length, perBil, perManedSortert};
}
function rapportBilparkData(){
  const relevanteBiler = rapportRelevanteBiler();
  const counts = {'ute-av-drift':0, kritisk:0, verksted:0, oppfolging:0, 'ikke-kontrollert':0, operativ:0};
  relevanteBiler.forEach(v => { counts[vehicleHovedstatus(v.id)]++; });
  return {total: relevanteBiler.length, counts};
}
function rapportVerkstedData(){
  const range = rapportPeriodeRange(rapportFilterPeriode);
  const today = todayISO();
  const filtered = verkstedtimer.filter(t => rapportVehicleMatch(t.vehicleId) && datoInnenfor(t.dato, range));
  const fullforte = filtered.filter(t => t.dato < today);
  const kommende = filtered.filter(t => t.dato >= today);
  const behandlingstider = [];
  const filteredIds = new Set(filtered.map(t => t.id));
  aktiveSaker.forEach(s => {
    if(s.linkedVtId && filteredIds.has(s.linkedVtId) && s.completedAt && s.reportedAt){
      const d = isoDateDiff(s.reportedAt, s.completedAt);
      if(d !== null && d >= 0) behandlingstider.push(d);
    }
  });
  const snittBehandlingstid = behandlingstider.length > 0 ? Math.round(behandlingstider.reduce((a,b) => a+b, 0) / behandlingstider.length) : null;
  const perManed = {}, perBil = {}, perVerksted = {};
  filtered.forEach(t => {
    const m = (t.dato||'').slice(0,7); if(m) perManed[m] = (perManed[m]||0) + 1;
    if(t.vehicleId) perBil[t.vehicleId] = (perBil[t.vehicleId]||0) + 1;
    if(t.verksted) perVerksted[t.verksted] = (perVerksted[t.verksted]||0) + 1;
  });
  return {
    antall: filtered.length, fullforte: fullforte.length, kommende: kommende.length, snittBehandlingstid,
    perManed: Object.entries(perManed).sort((a,b) => b[0].localeCompare(a[0])),
    perBil: Object.entries(perBil).map(([vid, antall]) => ({v: vehicles.find(x => x.id === vid), antall})).sort((a,b) => b.antall - a.antall),
    perVerksted: Object.entries(perVerksted).sort((a,b) => b[1] - a[1])
  };
}
function rapportAvviksData(){
  const range = rapportPeriodeRange(rapportFilterPeriode);
  const filtered = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && (datoInnenfor(s.reportedAt, range) || datoInnenfor((s.resolvedAt||'').slice(0,10), range)));
  const apne = filtered.filter(sakErApen);
  const lukkede = filtered.filter(s => !sakErApen(s));
  const kritiske = apne.filter(s => s.priority === 'kritisk');
  const perType = {};
  SAK_TYPE_ORDER.forEach(t => perType[t] = 0);
  filtered.forEach(s => { if(perType[s.caseType] !== undefined) perType[s.caseType]++; });
  return {apne: apne.length, lukkede: lukkede.length, kritiske: kritiske.length, perType, totalt: filtered.length};
}
function rapportBilhelseData(){
  const range = rapportPeriodeRange(rapportFilterPeriode);
  const relevanteBiler = rapportRelevanteBiler();
  const top = (mapper) => relevanteBiler.map(v => ({v, antall: mapper(v)})).filter(x => x.antall > 0).sort((a,b) => b.antall - a.antall).slice(0, 5);
  return {
    flestAktiveSaker: top(v => vehicleAktiveSaker(v.id).length),
    flestVerkstedbesok: top(v => verkstedtimer.filter(t => t.vehicleId === v.id && datoInnenfor(t.dato, range)).length),
    flestVarsellamper: top(v => varsellys.filter(w => w.vehicleId === v.id && datoInnenfor(w.registrertDato, range)).length),
    flestSkader: top(v => damages.filter(d => d.vehicleId === v.id && datoInnenfor(d.dato, range)).length)
  };
}
function rapportKostnadsposter(){
  const range = rapportPeriodeRange(rapportFilterPeriode);
  return getKostnadsposter().filter(p => rapportVehicleMatch(p.vehicleId) && datoInnenfor(p.dato, range));
}
function rapportKostnadData(){
  const poster = rapportKostnadsposter();
  const sumFor = (kilde) => poster.filter(p => p.kilde === kilde).reduce((s,p) => s + bestKostnad(p), 0);
  return {
    verksted: sumFor('verksted'), skade: sumFor('skade'), dekk: sumFor('dekk'), annet: sumFor('annet'),
    totalt: poster.reduce((s,p) => s + bestKostnad(p), 0), antall: poster.length
  };
}
// Månedsrapport — ledelsesversjonen: samler nøkkeltall fra de andre rapportene for
// valgt periode (default denne måneden, siden dette er en MÅNEDSrapport).
function rapportManedData(){
  const periodeForMoned = rapportFilterPeriode || 'denne-maned';
  const range = rapportPeriodeRange(periodeForMoned);
  const kontrollData = (() => { const p = rapportFilterPeriode; rapportFilterPeriode = periodeForMoned; const d = rapportKontrollData(); rapportFilterPeriode = p; return d; })();
  const nyeSaker = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && datoInnenfor(s.reportedAt, range)).length;
  const lukkedeSaker = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && datoInnenfor((s.resolvedAt||'').slice(0,10), range)).length;
  const kritiskeHendelser = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && s.priority === 'kritisk' && datoInnenfor(s.reportedAt, range)).length;
  const forfalteOppfolginger = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && sakErApen(s) && sakOppfolgingStatus(s) === 'forfalt').length;
  const gjSakstid = (() => {
    const lukkede = aktiveSaker.filter(s => rapportVehicleMatch(s.vehicleId) && s.resolvedAt && datoInnenfor((s.resolvedAt||'').slice(0,10), range));
    const tider = lukkede.map(s => isoDateDiff(s.reportedAt, s.resolvedAt.slice(0,10))).filter(d => d !== null && d >= 0);
    return tider.length > 0 ? Math.round(tider.reduce((a,b)=>a+b,0)/tider.length) : null;
  })();
  const verkstedAktivitet = verkstedtimer.filter(t => rapportVehicleMatch(t.vehicleId) && datoInnenfor(t.dato, range)).length;
  const kostnader = (() => { const p = rapportFilterPeriode; rapportFilterPeriode = periodeForMoned; const d = rapportKostnadData(); rapportFilterPeriode = p; return d; })();
  return {periodeForMoned, kontrollData, nyeSaker, lukkedeSaker, kritiskeHendelser, forfalteOppfolginger, gjSakstid, verkstedAktivitet, kostnader};
}

function rapportTabellRad(label, verdi){
  return `<div class="ov-item"><span class="ov-label">${esc(label)}</span><span class="ov-value">${verdi}</span></div>`;

function exportRapportExcel(){
  let header, rows, arkNavn, filnavn;
  if(rapportType === 'kontroll'){
    const d = rapportKontrollData();
    header = ['Bil', 'Antall kontroller'];
    rows = d.perBil.map(r => [vehicleLabel(r.v), r.antall]);
    arkNavn = 'Kontrollrapport'; filnavn = 'Kontrollrapport_Eksport.xlsx';
  } else if(rapportType === 'bilpark'){
    const d = rapportBilparkData();
    header = ['Status', 'Antall'];
    rows = HOVEDSTATUS_ORDER.map(k => [HOVEDSTATUS_LABEL[k], d.counts[k]]);
    arkNavn = 'Bilparkrapport'; filnavn = 'Bilparkrapport_Eksport.xlsx';
  } else if(rapportType === 'verksted'){
    const d = rapportVerkstedData();
    header = ['Bil', 'Antall verkstedtimer'];
    rows = d.perBil.map(r => [r.v ? vehicleLabel(r.v) : 'Slettet kjøretøy', r.antall]);
    arkNavn = 'Verkstedrapport'; filnavn = 'Verkstedrapport_Eksport.xlsx';
  } else if(rapportType === 'avvik'){
    const d = rapportAvviksData();
    header = ['Sakstype', 'Antall'];
    rows = SAK_TYPE_ORDER.map(t => [SAK_TYPE_LABEL[t], d.perType[t] || 0]);
    arkNavn = 'Avviksrapport'; filnavn = 'Avviksrapport_Eksport.xlsx';
  } else if(rapportType === 'bilhelse'){
    const d = rapportBilhelseData();
    header = ['Bil', 'Aktive saker', 'Verkstedbesøk', 'Varsellamper', 'Skader'];
    rows = rapportRelevanteBiler().map(v => [
      vehicleLabel(v),
      vehicleAktiveSaker(v.id).length,
      verkstedtimer.filter(t => t.vehicleId === v.id).length,
      varsellys.filter(w => w.vehicleId === v.id).length,
      damages.filter(dd => dd.vehicleId === v.id).length
    ]);
    arkNavn = 'Bilhelserapport'; filnavn = 'Bilhelserapport_Eksport.xlsx';
  } else if(rapportType === 'kostnad'){
    const poster = rapportKostnadsposter().slice().sort((a,b) => (a.dato||'').localeCompare(b.dato||''));
    header = ['Bil', 'Kilde', 'Beskrivelse', 'Kostnad', 'Dato'];
    rows = poster.map(p => {
      const v = vehicles.find(x => x.id === p.vehicleId);
      return [v ? vehicleLabel(v) : 'Slettet kjøretøy', KOST_KILDE_LABEL[p.kilde] || p.kilde, p.tittel || '', bestKostnad(p), fmt(p.dato)];
    });
    arkNavn = 'Kostnadsrapport'; filnavn = 'Kostnadsrapport_Eksport.xlsx';
  } else if(rapportType === 'maned'){
    const d = rapportManedData();
    header = ['Nøkkeltall', 'Verdi'];
    rows = [
      ['Kontrollgrad', d.kontrollData.kontrollgrad + ' %'],
      ['Nye saker', d.nyeSaker],
      ['Lukkede saker', d.lukkedeSaker],
      ['Kritiske hendelser', d.kritiskeHendelser],
      ['Forfalte oppfølginger', d.forfalteOppfolginger],
      ['Gjennomsnittlig sakstid (dager)', d.gjSakstid === null ? '–' : d.gjSakstid],
      ['Verkstedaktivitet', d.verkstedAktivitet],
      ['Totale kostnader', d.kostnader.totalt]
    ];
    arkNavn = 'Månedsrapport'; filnavn = 'Manedsrapport_Eksport.xlsx';
  } else {
    return;
  }
  const aoa = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, arkNavn);
  XLSX.writeFile(wb, filnavn);
}

function renderKostnadsoversikt(){
  const alleposter = getKostnadsposter();
  const poster = filteredKostnadsposter();
  const today = todayISO();
  const iArPoster = alleposter.filter(p => p.dato && p.dato.startsWith(today.slice(0,4)));
  const totalIAr = iArPoster.reduce((s,p) => s + bestKostnad(p), 0);

  const avsettingerApne = alleposter.filter(p => p.requiresProvision && p.sakStatus !== 'lukket').reduce((s,p) => s + (p.provisionAmount||0), 0);
  const bilerMedKostnad = new Set(alleposter.map(p => p.vehicleId));
  const totaltAlleposter = alleposter.reduce((s,p) => s + bestKostnad(p), 0);
  const snittPerBil = vehicles.length > 0 ? totaltAlleposter / vehicles.length : 0;

  const verkstedSum = poster.filter(p => p.kilde === 'verksted').reduce((s,p) => s + bestKostnad(p), 0);
  const skadeSum = poster.filter(p => p.kilde === 'skade').reduce((s,p) => s + bestKostnad(p), 0);
  const dekkSum = poster.filter(p => p.kilde === 'dekk').reduce((s,p) => s + bestKostnad(p), 0);
  const andreSum = poster.filter(p => p.kilde === 'annet').reduce((s,p) => s + bestKostnad(p), 0);
  const totalSum = verkstedSum + skadeSum + dekkSum + andreSum;

  const antallAktiveFiltre = [kostFilterBil, kostFilterGruppe, kostFilterType, kostFilterManed, kostFilterAr, kostFilterKilde, kostFilterSakStatus].filter(Boolean).length + (kostFilterKunAvsettinger?1:0);

  const arISystemet = [...new Set(alleposter.map(p => p.dato ? p.dato.slice(0,4) : null).filter(Boolean))].sort().reverse();
  const MANED_LABEL = {'01':'Januar','02':'Februar','03':'Mars','04':'April','05':'Mai','06':'Juni','07':'Juli','08':'August','09':'September','10':'Oktober','11':'November','12':'Desember'};

  // Listevisning gruppert per bil
  const byVehicle = new Map();

// ================= scrAnalyse (Fase 9 — Analyse og Prediktiv Oppfølging) =================
// Viktig prinsipp: dette er ren, historisk mønstergjenkjenning på registrerte data —
// systemet vurderer aldri teknisk/sikkerhetsmessig tilstand på kjøretøy og analyserer
// eller rangerer ALDRI ansatte/sjåfører. Kun kjøretøy og saker telles og grupperes.
const ANALYSE_ORDER = ['gjentakende', 'bilanalyse', 'verkstedtrender', 'sakstyper', 'behandlingstid', 'utvikling'];
const ANALYSE_LABEL = {gjentakende:'Gjentakende feil', bilanalyse:'Biler med flest saker', verkstedtrender:'Verkstedtrender', sakstyper:'Saker per kategori', behandlingstid:'Gjennomsnittlig behandlingstid', utvikling:'Utvikling siste 12 måneder'};
const ANALYSE_IKON = {gjentakende:'🚨', bilanalyse:'🚗', verkstedtrender:'🔧', sakstyper:'📋', behandlingstid:'🕒', utvikling:'📈'};
const MANED_LABEL = {'01':'Januar','02':'Februar','03':'Mars','04':'April','05':'Mai','06':'Juni','07':'Juli','08':'August','09':'September','10':'Oktober','11':'November','12':'Desember'};

function goToAnalyse(type){
  analyseType = type;
  showAnalyseFilterMeny = false;
  goTo('analyse');
}
function analyseVehicleMatch(vehicleId){
  if(analyseFilterBil && vehicleId !== analyseFilterBil) return false;
  if(analyseFilterGruppe){
    const v = vehicles.find(x => x.id === vehicleId);
    if(!v || v.kategori !== analyseFilterGruppe) return false;
  }
  return true;
}
function analyseDatoMatch(dato){
  if(!analyseFilterManed && !analyseFilterAr) return true;
  if(!dato) return false;
  const ar = dato.slice(0,4), maned = dato.slice(5,7);
  if(analyseFilterAr && ar !== analyseFilterAr) return false;
  if(analyseFilterManed && maned !== analyseFilterManed) return false;
  return true;
}
// Sak-filter UTEN dato — brukt av "Utvikling siste 12 måneder", som alltid ser på et
// fast 12-måneders vindu og derfor ikke skal la måned/år-filteret snevre det inn videre.
function analyseSakMatchUtenDato(s){
  if(!analyseVehicleMatch(s.vehicleId)) return false;
  if(analyseFilterType && s.caseType !== analyseFilterType) return false;
  if(analyseFilterStatus === 'apen' && !sakErApen(s)) return false;
  if(analyseFilterStatus === 'lukket' && sakErApen(s)) return false;
  return true;
}
function analyseSakMatch(s){ return analyseSakMatchUtenDato(s) && analyseDatoMatch(s.reportedAt); }
function vehicleAlleSaker(vehicleId){ return aktiveSaker.filter(s => s.vehicleId === vehicleId); }
// Gjentakende registreringer siste 12 måneder på én bil — vises som informasjon på
// Kjøretøyprofil, ikke som en anbefaling.
function vehicleGjentakendeSisteAr(vehicleId){
  const grense = isoDaysAgo(365);
  return vehicleAlleSaker(vehicleId).filter(s => (s.reportCount||1) > 1 && s.lastReportedAt && s.lastReportedAt.slice(0,10) >= grense);
}

function analyseGjentakendeFeil(){
  return aktiveSaker.filter(s => (s.reportCount||1) > 1 && analyseSakMatch(s))
    .slice().sort((a,b) => (b.reportCount||1) - (a.reportCount||1));
}
function analyseBilerMedFlestSaker(){
  const relevante = vehicles.filter(v => analyseVehicleMatch(v.id));
  return relevante.map(v => ({v, antall: aktiveSaker.filter(s => s.vehicleId === v.id && analyseSakMatch(s)).length}))
    .filter(x => x.antall > 0).sort((a,b) => b.antall - a.antall);
}
function analyseSnitt(arr){ return arr.length ? Math.round(arr.reduce((a,b) => a+b, 0) / arr.length) : null; }
function analyseVerkstedtrender(){
  const filtered = verkstedtimer.filter(t => analyseVehicleMatch(t.vehicleId) && analyseDatoMatch(t.dato));
  const perManed = {}, perBil = {};
  filtered.forEach(t => {
    const m = (t.dato||'').slice(0,7); if(m) perManed[m] = (perManed[m]||0) + 1;
    if(t.vehicleId) perBil[t.vehicleId] = (perBil[t.vehicleId]||0) + 1;
  });
  const tidTilVerksted = [], tidTilLukket = [];
  aktiveSaker.filter(s => analyseSakMatch(s)).forEach(s => {
    if(s.linkedVtId){
      const vt = verkstedtimer.find(t => t.id === s.linkedVtId);
      if(vt){ const d = isoDateDiff(s.reportedAt, vt.dato); if(d !== null && d >= 0) tidTilVerksted.push(d); }
    }
    if(s.resolvedAt){ const d = isoDateDiff(s.reportedAt, s.resolvedAt.slice(0,10)); if(d !== null && d >= 0) tidTilLukket.push(d); }
  });
  return {
    perManed: Object.entries(perManed).sort((a,b) => b[0].localeCompare(a[0])),
    perBil: Object.entries(perBil).map(([vid,antall]) => ({v: vehicles.find(x => x.id === vid), antall})).sort((a,b) => b.antall - a.antall),
    snittTilVerksted: analyseSnitt(tidTilVerksted), snittTilLukket: analyseSnitt(tidTilLukket)
  };
}
function analyseSakstyper(){
  const filtered = aktiveSaker.filter(s => analyseSakMatch(s));
  const perType = {}; SAK_TYPE_ORDER.forEach(t => perType[t] = 0);
  filtered.forEach(s => { if(perType[s.caseType] !== undefined) perType[s.caseType]++; });
  const total = filtered.length;
  const prosent = {}; SAK_TYPE_ORDER.forEach(t => prosent[t] = total > 0 ? Math.round((perType[t]/total)*100) : 0);
  return {total, perType, prosent};
}
function analyseBehandlingstid(){
  const lukkede = aktiveSaker.filter(s => analyseSakMatch(s) && s.resolvedAt);
  const tider = lukkede.map(s => isoDateDiff(s.reportedAt, s.resolvedAt.slice(0,10))).filter(d => d !== null && d >= 0);
  if(tider.length === 0) return {antall: 0, snitt: null, korteste: null, lengste: null};
  return {antall: tider.length, snitt: analyseSnitt(tider), korteste: Math.min(...tider), lengste: Math.max(...tider)};
}
function analyseUtvikling(){
  const today = todayISO();
  const [ty, tm] = today.split('-').map(Number);
  const maneder = [];
  for(let i = 11; i >= 0; i--){
    let y = ty, m = tm - i;
    while(m < 1){ m += 12; y -= 1; }
    maneder.push(`${y}-${String(m).padStart(2,'0')}`);
  }
  return maneder.map(m => ({
    maned: m,
    nye: aktiveSaker.filter(s => analyseSakMatchUtenDato(s) && (s.reportedAt||'').startsWith(m)).length,
    lukkede: aktiveSaker.filter(s => analyseSakMatchUtenDato(s) && (s.resolvedAt||'').startsWith(m)).length,
    kritiske: aktiveSaker.filter(s => analyseSakMatchUtenDato(s) && s.priority === 'kritisk' && (s.reportedAt||'').startsWith(m)).length,
    verksted: verkstedtimer.filter(t => analyseVehicleMatch(t.vehicleId) && (t.dato||'').startsWith(m)).length
  }));
}

function exportAnalyseExcel(){
  let header, rows, arkNavn, filnavn;
  if(analyseType === 'gjentakende'){
    const liste = analyseGjentakendeFeil();
    header = ['Bil', 'Feiltype', 'Antall registreringer', 'Første registrering', 'Siste registrering'];
    rows = liste.map(s => { const v = sakVehicle(s); return [v ? vehicleLabel(v) : 'Slettet kjøretøy', s.title, s.reportCount||1, fmt(s.reportedAt), fmt((s.lastReportedAt||'').slice(0,10))]; });
    arkNavn = 'Gjentakende feil'; filnavn = 'Gjentakende_feil_Eksport.xlsx';
  } else if(analyseType === 'bilanalyse'){
    const liste = analyseBilerMedFlestSaker();
    header = ['Bil', 'Antall saker'];
    rows = liste.map(r => [vehicleLabel(r.v), r.antall]);
    arkNavn = 'Bilanalyse'; filnavn = 'Bilanalyse_Eksport.xlsx';
  } else if(analyseType === 'verkstedtrender'){
    const d = analyseVerkstedtrender();
    header = ['Måned', 'Antall verkstedtimer'];
    rows = d.perManed.map(([m,n]) => [m, n]);
    arkNavn = 'Verkstedtrender'; filnavn = 'Verkstedtrender_Eksport.xlsx';
  } else if(analyseType === 'sakstyper'){
    const d = analyseSakstyper();
    header = ['Sakstype', 'Antall', 'Andel'];
    rows = SAK_TYPE_ORDER.map(t => [SAK_TYPE_LABEL[t], d.perType[t]||0, (d.prosent[t]||0) + ' %']);
    arkNavn = 'Sakstyper'; filnavn = 'Sakstypeanalyse_Eksport.xlsx';
  } else if(analyseType === 'behandlingstid'){
    const d = analyseBehandlingstid();
    header = ['Nøkkeltall', 'Verdi'];
    rows = [['Antall lukkede saker', d.antall], ['Gjennomsnitt (dager)', d.snitt===null?'–':d.snitt], ['Korteste (dager)', d.korteste===null?'–':d.korteste], ['Lengste (dager)', d.lengste===null?'–':d.lengste]];
    arkNavn = 'Behandlingstid'; filnavn = 'Behandlingstid_Eksport.xlsx';
  } else if(analyseType === 'utvikling'){
    const d = analyseUtvikling();
    header = ['Måned', 'Nye saker', 'Lukkede saker', 'Kritiske saker', 'Verkstedtimer'];
    rows = d.map(r => [r.maned, r.nye, r.lukkede, r.kritiske, r.verksted]);
    arkNavn = 'Utvikling'; filnavn = 'Utvikling_12mnd_Eksport.xlsx';
  } else return;
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, arkNavn);
  XLSX.writeFile(wb, filnavn);
}

function attachAnalyseListeners(){
  const tilbakeBtn = document.getElementById('analyse-tilbake-btn');
  if(tilbakeBtn) tilbakeBtn.addEventListener('click', () => {
    if(analyseType){ analyseType = ''; showAnalyseFilterMeny = false; render(); }
    else goBack();
  });
  document.querySelectorAll('[data-goto-analyse]').forEach(el => el.addEventListener('click', () => goToAnalyse(el.dataset.gotoAnalyse)));
  const filterToggleBtn = document.getElementById('analyse-filter-toggle-btn');
  if(filterToggleBtn) filterToggleBtn.addEventListener('click', () => { showAnalyseFilterMeny = !showAnalyseFilterMeny; render(); });

  if(eksportBtn) eksportBtn.addEventListener('click', () => exportAnalyseExcel());

  if(fBil) fBil.addEventListener('change', e => { analyseFilterBil = e.target.value; render(); });
  const fGruppe = document.getElementById('analyse-f-gruppe');
  if(fGruppe) fGruppe.addEventListener('change', e => { analyseFilterGruppe = e.target.value; render(); });
  const fManed = document.getElementById('analyse-f-maned');
  if(fManed) fManed.addEventListener('change', e => { analyseFilterManed = e.target.value; render(); });
  const fAr = document.getElementById('analyse-f-ar');
  if(fAr) fAr.addEventListener('change', e => { analyseFilterAr = e.target.value; render(); });
  const fType = document.getElementById('analyse-f-type');
  if(fType) fType.addEventListener('change', e => { analyseFilterType = e.target.value; render(); });
  const fStatus = document.getElementById('analyse-f-status');

async function runDatabaseCheck(){
  dbStatusReport = await window.checkAirtableSchema();
  render();
}
async function runDatabaseSync(){
  dbStatusSyncing = true; dbStatusSyncLog = null; render();
  try{
    let report = await window.checkAirtableSchema();
    if(report.ok){
      const harMangler = report.tables.some(t => !t.exists || t.missingFields.length > 0);
      if(harMangler){
        dbStatusSyncLog = await window.autoFixAirtableSchema(report);
      }
    }
    dbStatusReport = await window.checkAirtableSchema();
  }catch(e){
    console.error('[runDatabaseSync] Feilet', e);
  }
  dbStatusSyncing = false;
  render();
}

// ================= "Oppdater app" (hard refresh, tilsvarende Ctrl+F5) =================
// Rører KUN service worker-registreringen og PWA-app-shell-cachen (sw.js/CACHE_VERSION) —
// selve dataene (bilregister, skader, verkstedtimer, sjåførkontroller, varsellamper) ligger
// utelukkende i Airtable og påvirkes ikke i det hele tatt av dette. Nyttig fordi mobile
// nettlesere ikke har noen Ctrl+F5-snarvei, og installerte PWA-er kan sitte fast på en gammel,
// cachet versjon av index.html/storage.airtable.js selv etter at nye filer er lastet opp.
async function hardRefreshApp(){
  if(!confirm('Appen vil oppdatere og laste inn nyeste versjon. Fortsette?')) return;
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){ await reg.unregister(); }
      console.log('[hardRefreshApp] Service worker(e) avregistrert:', regs.length);
    }
    if('caches' in window){
      const keys = await caches.keys();
      for(const k of keys){ await caches.delete(k); }
      console.log('[hardRefreshApp] Cache(r) tømt:', keys);
    }
  }catch(e){
    console.error('[hardRefreshApp] Klarte ikke tømme service worker/cache fullstendig', e);
    // Fortsetter uansett — selve omlastingen under tvinger frem ferske filer fra nettverket.
  }
  // Cache-busting query-parameter tvinger nettleseren til å hente index.html (og alt annet)
  // helt på nytt fra nettverket, i stedet for en eventuell mellomlagret HTTP-cache-kopi —
  // location.reload() alene er ikke pålitelig nok til dette på tvers av mobile nettlesere.
  const url = new URL(window.location.href);
  url.searchParams.set('_refresh', Date.now().toString());
  window.location.replace(url.toString());
}
